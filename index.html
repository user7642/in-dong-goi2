<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quản lý In & Đóng gói</title>
<!-- BUILD MARKER: best-carrier-custom-v1 — 2026-10-02
     Dùng để xác nhận bản deploy trên GitHub Pages đã cập nhật code lightbox
     mới nhất hay chưa: mở "View Page Source" (Ctrl+U) trên trang thật, tìm
     chuỗi "BUILD MARKER" — nếu thấy đúng nhãn này (best-carrier-custom-v1)
     nghĩa là bản mới đã lên; nếu thấy nhãn khác/không thấy dòng này nghĩa
     là GitHub Pages / trình duyệt vẫn đang phục vụ bản cache cũ. Mỗi lần
     đẩy thay đổi thật sự lên, đổi số hiệu (v1 -> v2...) để so sánh nhanh. -->
<style>
  /* ---- Hệ thống theme (giống catalog.html): DARK MODE là mặc định khai báo
     trong :root, LIGHT MODE chỉ bật khi <body> có class .light-theme (nút tròn
     góc trên-phải gắn/gỡ class này; lựa chọn lưu localStorage, dùng CHUNG khóa
     'theme-preference' với catalog.html nên 2 trang luôn cùng chế độ). Mọi rule
     bên dưới dùng var(--...) nên đổi biến ở 2 khối này là đổi cả trang. ---- */
  :root{
    --bg:#0f1115; --card:#1a1d23; --border:#2d3138; --text:#e8eaed; --muted:#9aa3af;
    --blue:#3b82f6; --blue-bg:#1e3a5f; --green:#34d399; --green-bg:#123524; --red:#f87171; --red-bg:#3a1a1a; --gray-bg:#262a32;
    --amber:#fbbf24;
    --input-bg:#20242b; --row-bg:#171a20; --notice-border:#2f5a94; --err-border:#6b2b2b;
    --bar-bg:#262b34; --bar-border:rgba(255,255,255,.1); --warn:#f87171;
    --green-solid:#15803d; --red-solid:#dc2626;
    --shadow:rgba(0,0,0,.45);
    --maxw:680px;
  }
  body.light-theme{
    --bg:#f5f6f7; --card:#ffffff; --border:#e2e4e7; --text:#1a1d21; --muted:#6b7280;
    --blue:#2563eb; --blue-bg:#eaf1ff; --green:#15803d; --green-bg:#e8f7ec; --red:#dc2626; --red-bg:#fde8e8; --gray-bg:#eceef0;
    --amber:#b45309;
    --input-bg:#ffffff; --row-bg:#fafbfc; --notice-border:#bcd0f7; --err-border:#f5b8b8;
    --bar-bg:#1a1d21; --bar-border:transparent; --warn:#d92d20;
    --green-solid:#15803d; --red-solid:#dc2626;
    --shadow:rgba(0,0,0,.12);
  }
  /* Nút tròn chuyển chế độ sáng/tối — cố định góc trên-phải màn hình. */
  .theme-toggle{
    position:fixed;top:14px;right:14px;z-index:40;
    width:40px;height:40px;border-radius:50%;
    background:var(--card);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;line-height:1;cursor:pointer;padding:0;
    box-shadow:0 2px 10px var(--shadow);
    transition:transform .2s ease,background-color .2s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .theme-toggle:hover{transform:scale(1.08) rotate(8deg);}
  }
  @media (max-width:420px){
    .theme-toggle{width:34px;height:34px;font-size:15px;top:10px;right:10px;}
  }
  /* Ô nhập liệu theo theme (trước đây dùng nền trắng mặc định của trình duyệt) */
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select{
    background:var(--input-bg);color:var(--text);
  }
  ::placeholder{color:var(--muted);opacity:.8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:90px;
  }
  /* header, thanh addbar/searchbar sticky, main, footer-style bars đều dùng
     chung 1 độ rộng tối đa (--maxw), canh giữa — để trên desktop các khối
     thẳng hàng nhau thay vì header/thanh công cụ chạy full-width còn danh
     sách bên dưới bị bó hẹp lại trông lệch. */
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 16px 0 16px;
    position:sticky;
    top:0;
    z-index:20;
    max-width:var(--maxw);
    margin:0 auto;
  }
  h1{font-size:18px;margin:0 0 12px 0;font-weight:600;text-align:center;}
  .tabs{display:flex;gap:6px;}
  .tab{
    flex:1;
    text-align:center;
    padding:12px 4px;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    border-bottom:3px solid transparent;
    cursor:pointer;
    user-select:none;
  }
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .count-badge{
    display:inline-block;
    background:var(--border);
    color:var(--text);
    border-radius:10px;
    font-size:12px;
    padding:1px 7px;
    margin-left:5px;
  }
  .tab.active .count-badge{background:var(--blue);color:#fff;}

  .addbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    gap:8px;
    position:sticky;
    top:53px;
    z-index:19;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .addbar input[type=text]{
    flex:1;
    min-width:0;
    font-size:16px;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }
  .addbar input[type=number]{
    width:64px;
    font-size:16px;
    padding:11px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    text-align:center;
  }
  .addbar button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
  }

  .searchbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:8px 16px;
    position:sticky;
    top:106px;
    z-index:18;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .searchbar input{
    width:100%;
    font-size:15px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }

  .quicklink{padding:10px 0 0 0;}
  .quicklink a{
    display:block;
    text-align:center;
    background:var(--blue-bg);
    color:var(--blue);
    font-weight:600;
    font-size:14px;
    padding:11px 12px;
    border-radius:8px;
    text-decoration:none;
  }

  /* Lề ngang 16px = đúng bằng lề của header / ô nhập / ô tìm kiếm, để mọi khối
     (Thêm DS, Tải tất cả, Chọn tất cả, thẻ việc) thẳng mép trái–phải với nhau. */
  main{padding:12px 16px 0 16px;max-width:var(--maxw);margin:0 auto;}
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }

  .noticebox{
    background:var(--blue-bg);
    color:var(--text);
    border:1px solid var(--notice-border);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    line-height:1.45;
    margin-bottom:10px;
  }
  .errbox{
    background:var(--red-bg);
    color:var(--red);
    border:1px solid var(--err-border);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    margin-bottom:10px;
  }

  /* ---- Order box (grouping) — thẻ tóm tắt kiểu Shopee ---- */
  .order-box{
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
    background:var(--card);
    cursor:pointer;
  }

  .order-summary-header{
    padding:9px 12px;background:var(--row-bg);border-bottom:1px solid var(--border);
    font-size:12.5px;cursor:pointer;user-select:none;
  }
  .order-time{color:var(--muted);}
  /* Header đơn = lưới 3 cột: [checkbox chọn đơn | ngày giờ | trạng thái + mũi tên].
     Hai cột ngoài rộng bằng nhau (1fr) nên ngày giờ luôn nằm đúng giữa thanh,
     dù cột trái/phải dài hay ngắn. */
  .order-summary-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:10px;}
  .order-summary-header .order-select-cb{justify-self:start;}
  .order-summary-header .order-time{justify-self:center;text-align:center;font-weight:600;}
  .order-summary-header .order-header-right{justify-self:end;}
  .order-select-cb{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:var(--blue);cursor:pointer;}
  .order-status-badge{font-weight:700;}
  .order-status-badge.st-warn{color:var(--amber);}
  .order-status-badge.st-info{color:var(--blue);}
  .order-status-badge.st-ready{color:var(--green);}

  .thumb-placeholder{
    width:72px;height:72px;flex-shrink:0;border-radius:8px;
    background:var(--gray-bg);display:flex;align-items:center;justify-content:center;
    font-size:26px;color:var(--muted);overflow:hidden;
    cursor:pointer;transition:opacity .12s;
  }
  .thumb-placeholder:active{opacity:.7;}
  .thumb-placeholder img{width:100%;height:100%;object-fit:cover;display:block;}

  /* Lightbox — bấm vào ảnh phân loại trong danh sách để phóng to, tránh
     nhầm giữa các phân loại có tông màu giống nhau khi nhìn ở ảnh tí hon. */
  .thumb-lightbox-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:tlbFadeIn .12s ease-out;
  }
  @keyframes tlbFadeIn{from{opacity:0;}to{opacity:1;}}
  .thumb-lightbox-box{
    position:relative;background:var(--card);border-radius:12px;max-width:min(1100px,94vw);max-height:94vh;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .thumb-lightbox-imgwrap{
    background:var(--gray-bg);display:flex;align-items:center;justify-content:center;
    max-height:82vh;overflow:hidden;
  }
  .thumb-lightbox-imgwrap img{max-width:100%;max-height:82vh;display:block;object-fit:contain;}
  .thumb-lightbox-imgwrap .thumb-lightbox-noimg{font-size:48px;color:var(--muted);padding:60px;}
  .thumb-lightbox-info{padding:12px 14px;border-top:1px solid var(--border);}
  .thumb-lightbox-title{font-weight:700;font-size:15px;color:var(--text);}
  .thumb-lightbox-classification{font-size:13px;color:var(--muted);margin-top:2px;}
  .thumb-lightbox-close{
    position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;border:none;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    -webkit-tap-highlight-color:transparent;
  }
  .thumb-lightbox-close:active{background:rgba(0,0,0,.75);}

  /* Preview khi rê chuột (chỉ desktop/thiết bị có hover thật — xem
     supportsHoverPreview trong JS) — hiện ảnh to ngay cạnh con trỏ mà
     KHÔNG cần bấm, nhanh hơn lightbox khi chỉ muốn liếc qua nhiều dòng
     liên tiếp. Bấm vẫn mở lightbox đầy đủ như cũ (hữu ích trên mobile). */
  .thumb-hover-preview{
    position:fixed;z-index:1001;pointer-events:none;
    background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 36px rgba(0,0,0,.32);
    overflow:hidden;width:420px;opacity:0;transform:translateY(4px);
    transition:opacity .1s,transform .1s;
  }
  .thumb-hover-preview.show{opacity:1;transform:translateY(0);}
  .thumb-hover-preview img{width:100%;height:420px;object-fit:cover;display:block;background:var(--gray-bg);}
  .thumb-hover-preview .thumb-hover-info{padding:10px 12px;border-top:1px solid var(--border);}
  .thumb-hover-preview .thumb-hover-title{font-weight:700;font-size:14px;color:var(--text);}
  .thumb-hover-preview .thumb-hover-classification{font-size:12.5px;color:var(--muted);margin-top:2px;}

  .order-item-summary{
    display:flex;gap:10px;align-items:flex-start;
    padding:10px 12px;border-bottom:1px solid var(--border);
  }
  .order-item-summary:last-of-type{border-bottom:none;}
  .order-item-summary input[type=checkbox]{width:20px;height:20px;flex-shrink:0;margin-top:4px;accent-color:var(--blue);}
  .info-summary{flex:1;min-width:0;}
  /* Tiêu đề: 1 dòng, dài quá thì ẩn bớt (ellipsis) — giống kiểu Shopee. */
  /* Tiêu đề + chip "File in" nằm chung 1 hàng flex: chữ tiêu đề (.name-text)
     co lại và hiện "…" khi dài, còn chip flex:none nên LUÔN còn chỗ. Trước đây
     chip nằm lẫn trong dòng chữ có overflow:hidden → màn hình hẹp bị cắt mất. */
  .name-summary{
    display:flex;align-items:center;gap:6px;
    font-size:14px;font-weight:600;line-height:1.35;
  }
  .name-summary .name-text{
    flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* Dòng dưới: phân loại bên trái (ẩn bớt nếu dài) + số lượng bên phải,
     luôn giữ chỗ cố định cho SL để không bao giờ bị đẩy mất. */
  .meta-row-summary{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:3px;
  }
  .classification-summary{
    flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:15.5px;font-weight:700;color:var(--blue);
  }
  .qty-summary{
    flex-shrink:0;font-size:15.5px;font-weight:700;color:var(--blue);
  }

  .order-summary-footer{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 12px;border-bottom:1px solid var(--border);
    font-size:12.5px;color:var(--muted);background:var(--row-bg);
  }
  .order-summary-footer b{color:var(--text);}

  /* Đơn dài (>3 sản phẩm): mặc định chỉ hiện 3 sản phẩm đầu, phần còn lại ẩn
     sau nút bấm "Xem thêm" / "Thu gọn" ở cuối danh sách sản phẩm. */
  .items-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 12px;border-bottom:1px solid var(--border);
    font-size:12.5px;color:var(--blue);background:var(--row-bg);flex-wrap:wrap;
    cursor:pointer;user-select:none;
  }
  .items-toggle:hover{background:var(--blue-bg);}
  .items-toggle .tg-count{color:var(--muted);}
  .items-toggle .tg-action{font-weight:600;}
  .items-toggle .tg-chev{font-size:11px;line-height:1;}

  .order-code-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;
  }
  .order-code-row .code-label{color:var(--muted);}
  /* Nhãn + nút tải phiếu giao nằm cạnh nhau ở bên trái dòng "Mã đơn hàng". */
  .order-code-row .code-label-wrap{display:flex;align-items:center;gap:4px;}
  .code-dl-btn{
    border:none;background:none;color:var(--blue);cursor:pointer;padding:2px 4px;
    display:inline-flex;align-items:center;line-height:0;border-radius:6px;
  }
  .code-dl-btn:hover{background:var(--blue-bg);}
  .code-dl-btn svg{width:16px;height:16px;}
  .order-code-row .code-value{font-weight:600;display:flex;align-items:center;gap:6px;}
  /* Placeholder cho đơn chưa có mã vận đơn thật — cố tình KHÔNG dùng chuỗi
     ký tự giả nữa (xem renderOrderName() trong script). Độ rộng cân đối do
     CSS quyết định, không phụ thuộc số ký tự của mã thật (mỗi hãng dài ngắn
     khác nhau: GHN ~8 ký tự, SPX ~18 ký tự...). */
  .order-name-placeholder{color:var(--border);font-weight:400;letter-spacing:1px;}


  .order-summary-actions{display:flex;gap:8px;padding:10px 12px;}
  .order-summary-actions button{
    flex:1;border:none;border-radius:8px;padding:10px 8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .order-summary-actions .ship-quick-btn{background:var(--gray-bg);color:var(--text);}
  /* Đơn chưa có phiếu giao: nút xám nhạt để người in biết chưa in được (vẫn bấm
     được để quản lý mở khu vực tải phiếu lên). */
  .order-summary-actions .ship-quick-btn.no-label{background:var(--gray-bg);color:var(--muted);font-weight:500;}
  .order-summary-actions .order-primary-btn{background:var(--blue);color:#fff;}
  .order-summary-actions .order-primary-btn.green{background:var(--green-solid);}

  /* Header đơn hàng: bấm vào để mở/đóng khu vực phiếu giao + ghi chú (thay
     cho việc mở trang chi tiết toàn màn hình như trước). */
  .order-header-right{display:flex;align-items:center;gap:6px;}
  .header-dot{font-size:12px;line-height:1;}
  .expand-arrow{font-size:10px;color:var(--muted);margin-left:2px;}

  /* ---- Tab "Chờ bàn giao" + "Đã bàn giao": thanh chuyển chế độ xem + chip lọc theo hãng ---- */
  .carrierBar{
    display:none;flex-direction:column;gap:8px;
    padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);
    max-width:var(--maxw);margin:0 auto;
  }
  .carrierChips{display:flex;gap:6px;flex-wrap:wrap;min-width:0;}
  .carrierChip{
    border:1px solid var(--border);background:var(--card);color:var(--text);
    border-radius:14px;padding:5px 10px;font-size:12.5px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;gap:5px;
    flex:0 0 auto;white-space:nowrap;max-width:100%;
  }
  .carrierChip .n{color:var(--muted);font-weight:400;}
  .carrierChip.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .carrierChip.active .n{color:#dbe8ff;}
  @media (max-width:420px){
    .carrierChips{gap:6px 5px;}
    .carrierChip{padding:5px 9px;font-size:12px;gap:4px;}
  }

  /* Dòng xem trước ghi chú chung của cả đơn — luôn hiện ngay dưới header,
     không cần mở khu vực mở rộng mới thấy. */
  .order-note-preview{
    font-size:15.5px;font-weight:700;color:#ff0000;background:var(--blue-bg);
    padding:7px 12px;word-break:break-word;border-bottom:1px solid var(--border);
  }

  /* Khu vực mở rộng: phiếu giao (đính kèm PDF, dùng chung cho cả đơn, không
     theo từng sản phẩm) + ghi chú chung của đơn — chỉ hiện khi bấm header. */
  .order-expand-panel{border-bottom:1px solid var(--border);background:var(--row-bg);}
  .ship-label-row{
    padding:9px 12px;
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  }
  /* Icon-only, gọn gàng: mọi nút trong khu vực mở rộng chỉ có icon, không chữ. */
  .icon-btn{
    border:none;border-radius:8px;width:40px;height:40px;font-size:17px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;
  }
  .icon-btn.attach-btn{background:var(--blue-bg);color:var(--blue);}
  .icon-btn.view-btn{background:var(--gray-bg);color:var(--text);}
  .icon-btn.download-btn{background:var(--green-bg);color:var(--green);}
  .icon-btn.remove-btn{background:var(--red-bg);color:var(--red);}
  .icon-btn.note-btn{background:var(--gray-bg);color:var(--text);}
  .icon-btn.note-btn.has-note{background:var(--blue-bg);color:var(--blue);}
  .icon-btn[disabled]{opacity:.6;cursor:default;}

  .edit-icon-btn{
    border:none;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 4px;
  }
  input.order-title-input{
    font-size:13px;font-weight:700;border:1px solid var(--blue);border-radius:6px;
    padding:6px 8px;flex:1;min-width:0;
  }
  .save-icon{
    border:none;background:var(--blue);color:#fff;border-radius:6px;
    padding:6px 9px;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;
  }
  select.order-carrier-select{
    font-size:13px;font-weight:700;border:1px solid var(--blue);border-radius:6px;
    padding:6px 8px;flex:1;min-width:0;background:var(--input-bg);color:var(--text);
  }

  .note-box{padding:0 12px 10px;}
  .note-box textarea{
    width:100%;font-size:13px;padding:8px 9px;border:1px solid var(--border);
    border-radius:8px;min-height:54px;font-family:inherit;
  }
  .note-box .note-save{
    margin-top:5px;font-size:12px;padding:6px 11px;border:none;border-radius:6px;
    background:var(--blue);color:#fff;cursor:pointer;font-weight:600;
  }

  .batchbar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--bar-bg);
    border-top:1px solid var(--bar-border);
    color:#fff;
    padding:9px 14px;
    display:none;
    /* 3 cột: [nhóm trái] [số đã chọn] [nhóm phải]. 1fr auto 1fr giúp số đếm
       nằm ĐÚNG GIỮA thanh (2 spacer flex:1 chỉ canh giữa phần còn trống giữa
       2 nhóm — lệch vì nhóm trái/phải rộng khác nhau). Nhóm quá rộng thì cột
       tự nở theo nội dung, không tràn. */
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:8px;
    z-index:30;
    max-width:var(--maxw);
    margin:0 auto;
    border-radius:12px 12px 0 0;
  }
  .batchbar.show{display:grid;}
  .batchbar .bb-group{display:flex;align-items:center;gap:8px;min-width:0;}
  .batchbar .bb-left{justify-self:start;}
  .batchbar .bb-right{justify-self:end;}
  .batchbar #batchCount{font-size:14px;text-align:center;white-space:nowrap;}
  .batchbar button{
    border:none;
    border-radius:8px;
    padding:11px 14px;
    min-height:44px;          /* vùng chạm tối thiểu cho ngón tay */
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .batchbar .done-btn{background:var(--green-solid);color:#fff;}
  .batchbar .del-btn{background:var(--red-solid);color:#fff;}
  .batchbar .pdf-btn{color:#fff;}
  .batchbar .pdf-btn.dl{background:#3b82f6;}
  .batchbar .pdf-btn.merge{background:#8b5cf6;}
  .batchbar .pdf-btn svg{width:16px;height:16px;flex:none;}
  .batchbar .div-btn{background:rgba(255,255,255,.16);color:#fff;}
  .batchbar .div-btn.on{background:rgba(255,255,255,.34);}
  .batchbar .div-btn svg{width:16px;height:16px;flex:none;}
  .batchbar.busy .div-btn{display:none;}   /* đang tải/gộp: chữ tiến độ ở giữa cần chỗ */
  .batchbar button:disabled{opacity:.4;cursor:not-allowed;}
  /* Điện thoại: chỉ hiện icon cho 2 nút PDF, thu gọn khoảng cách/cỡ chữ để
     5 phần tử vẫn vừa 1 hàng ở màn hình ~360px. Nhãn chữ vẫn nằm trong
     aria-label/title nên không mất tính truy cập. */
  @media (max-width:520px){
    .batchbar{padding:9px 8px;gap:6px;}
    .batchbar .bb-group{gap:4px;}
    .batchbar button{padding:11px 12px;font-size:13px;}
    .batchbar .pdf-btn,.batchbar .div-btn{width:40px;padding:0;}
    .batchbar .pdf-btn .btn-label,.batchbar .div-btn .btn-label{display:none;}
    .batchbar #batchCount{font-size:12px;}
  }

  /* Lưới 3 cột [Chọn tất cả | nút Sắp xếp | Số lượng...] — 2 cột ngoài rộng
     bằng nhau (1fr) nên nút Sắp xếp luôn nằm đúng giữa thanh. */
  .listToolbar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
    padding:4px 0 10px;
  }
  .listToolbar .selectAllRow{justify-self:start;min-width:0;}
  .listToolbar .listToolbarRight{justify-self:end;min-width:0;}
  .sortModeBtn{
    border:1px solid var(--border);border-radius:8px;padding:7px 12px;
    font-size:13px;font-weight:600;background:transparent;color:var(--text);
    cursor:pointer;white-space:nowrap;
  }
  .sortModeBtn.active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}
  body.sorting .selectAllRow{visibility:hidden;}
  /* Chế độ sắp xếp: mỗi đơn thu gọn (header + hàng nút ⤒ ▲ ▼ ⤓ + sản phẩm đầu). */
  .order-box.sorting{cursor:default;}
  .order-box.sorting .order-summary-header{cursor:default;}
  .order-box.sorting .order-select-cb{visibility:hidden;}
  .order-sort-bar{display:flex;border-bottom:1px solid var(--border);background:var(--row-bg);}
  .order-sort-bar button{
    flex:1;border:none;border-radius:0;background:transparent;color:var(--text);
    padding:9px 0;font-size:15px;cursor:pointer;
  }
  .order-sort-bar button+button{border-left:1px solid var(--border);}
  .order-sort-bar button:disabled{opacity:.3;cursor:default;}
  .order-sort-more{padding:7px 12px;font-size:12.5px;color:var(--muted);background:var(--row-bg);border-bottom:1px solid var(--border);}
  .selectAllRow{
    display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;
  }
  .selectAllRow input{width:20px;height:20px;accent-color:var(--blue);}
  .listToolbarRight{display:flex;align-items:center;gap:8px;}
  .totalQtyInfo{font-size:13px;color:var(--muted);white-space:nowrap;}
  .totalQtyInfo b{color:var(--text);}
  .clearAllBtn{
    border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;
    background:var(--red-bg);color:var(--red);cursor:pointer;
  }
  .download-all-wrap{padding:0 0 10px;gap:8px;}
  .download-all-wrap .download-all-btn{flex:1;min-width:0;line-height:1.3;}
  .download-all-btn.merge{background:var(--blue-bg);color:var(--blue);}
  .download-all-btn[disabled]{opacity:.6;cursor:default;}
  /* 1 dòng chữ đỏ cảnh báo trùng mã đơn hàng — ngay dưới nút "Tải tất cả phiếu giao". */
  .dup-warn{color:var(--warn);font-size:12.5px;font-weight:600;padding:0 0 10px;line-height:1.4;}
  .download-all-btn{
    width:100%;border:none;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;
    background:var(--green-bg);color:var(--green);cursor:pointer;
  }
  .task-linkchip{
    flex:none;display:inline-flex;align-items:center;justify-content:center;gap:3px;
    font-size:11.5px;font-weight:600;white-space:nowrap;
    color:var(--blue);background:var(--blue-bg);border-radius:8px;padding:2px 7px;
    text-decoration:none;
  }
  /* Điện thoại: chip chỉ còn icon 🔗 (chữ "File in" ẩn, vẫn có aria-label/title),
     nới vùng chạm cho dễ bấm bằng ngón tay. */
  @media (max-width:520px){
    .task-linkchip{min-width:30px;min-height:28px;padding:3px 6px;}
    .task-linkchip .chip-label{display:none;}
  }

  .status-line{
    font-size:11px;
    text-align:center;
    color:var(--muted);
    padding:8px 0 2px 0;
    max-width:var(--maxw);
    margin:0 auto;
  }

  /* Ẩn khối "Tải tất cả" trên điện thoại (mọi tab) */
  @media (max-width: 767px){
    div#downloadAllWrap{ display:none !important; }
  }

  /* Điện thoại: số đếm luôn nằm hàng 2 ở cả 3 tab (không phụ thuộc độ dài chữ) */
  @media (max-width: 767px){
    .tabs .tab{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:4px;
      text-align:center;
    }
    .tabs .tab .count-badge{
      margin-left:0;
      margin-top:0;
    }
  }

  /* ---- Đồng bộ độ rộng các khối với header ----
     Header / thanh nhập / ô tìm kiếm là các dải nền trắng rộng đúng --maxw,
     nội dung cách mép 16px. Các khối bên dưới (Thêm DS, Tải tất cả, Chọn tất cả,
     chip hãng, thẻ việc) dùng cùng quy tắc: dải nền trắng rộng bằng header,
     nội dung cách mép 16px, nên mọi tab đều đều nhau. ---- */
  main{padding:0;}
  .quicklink,
  .download-all-wrap,
  .dup-warn,
  .listToolbar,
  .carrierBar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    margin:0;
  }
  .download-all-wrap{padding:10px 16px !important;}
  .dup-warn{padding:8px 16px;}
  .carrierBar{max-width:none;}
  #errArea:not(:empty){padding:10px 16px 0;}
  #list{padding:10px 0 0;}
  #list .order-box{
    border-left:0;border-right:0;border-radius:0;
    margin-bottom:10px;
  }
  .empty{padding:60px 16px;}

  /* ================= Bảng ghi chú vị trí =================
     Điện thoại / tablet: nút 📌 góc trên-phải mở bảng dạng "tấm trượt từ đáy" (có nền mờ phía sau).
     Desktop >=1250px: bảng ghim cố định góc dưới-trái, luôn hiện (giống bảng "Sản phẩm đã chọn" ở catalog). */
  .note-fab{
    position:fixed;top:14px;left:14px;z-index:40;width:40px;height:40px;border-radius:50%;
    background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:18px;line-height:1;cursor:pointer;padding:0;box-shadow:0 2px 10px var(--shadow);
  }
  .note-fab.has-note::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--amber);}
  @media (max-width:420px){ .note-fab{width:34px;height:34px;font-size:15px;top:10px;left:10px;} }
  .loc-note-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:none;}
  .loc-note-backdrop.show{display:block;}
  .loc-note{
    position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:var(--maxw);
    max-height:85vh;max-height:85dvh;z-index:1001;display:none;flex-direction:column;
    background:var(--card);border:1px solid var(--border);border-bottom:none;border-radius:16px 16px 0 0;
    box-shadow:0 -8px 28px var(--shadow);padding:14px;
  }
  .loc-note.show{display:flex;}
  .loc-note-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .loc-note-head h3{flex:1;margin:0;font-size:16px;}
  .loc-note-edit{
    width:36px;height:36px;border:none;border-radius:8px;background:var(--gray-bg);color:var(--text);
    font-size:16px;cursor:pointer;padding:0;flex-shrink:0;
  }
  .loc-note-edit.active{background:var(--blue-bg);}
  .loc-note-body{overflow:auto;min-height:0;flex:0 1 auto;}
  .loc-note-text{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.5;min-height:96px;}
  .loc-note-text.empty{color:var(--muted);font-style:italic;}
  .loc-note-body textarea{
    display:block;width:100%;min-height:120px;font-size:16px;line-height:1.5;padding:10px 12px;
    border:1px solid var(--border);border-radius:8px;font-family:inherit;resize:none;overflow:hidden;
  }
  .loc-note-err{color:var(--red);font-size:12.5px;margin-top:6px;}
  .loc-note-btns,.loc-note-actions{display:flex;gap:8px;margin-top:10px;}
  .loc-note-btns button,.loc-note-close{
    flex:1;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .loc-note-save{background:var(--green-solid);color:#fff;}
  .loc-note-cancel,.loc-note-close{background:var(--gray-bg);color:var(--text);}
  /* Ảnh trong ghi chú: tự co theo bề rộng bảng (điện thoại / desktop đều vừa), bấm để xem lớn */
  .loc-note-imgs{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .loc-note-imgs img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:zoom-in;}
  .loc-note-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .lnt{position:relative;width:72px;height:72px;border-radius:8px;border:1px solid var(--border);background:var(--gray-bg);overflow:hidden;}
  .lnt img{width:100%;height:100%;object-fit:cover;display:block;}
  .lnt .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:0;cursor:pointer;line-height:1;}
  .lnt.busy{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;}
  .loc-note-addimg{display:block;width:100%;margin-top:10px;border:1px dashed var(--border);background:transparent;color:var(--text);border-radius:8px;padding:9px;font-size:13px;cursor:pointer;}
  .loc-note-hint{font-size:12px;color:var(--muted);margin-top:4px;}
  /* Ghi chú dạng dòng chảy: chữ / ảnh / chữ... (ảnh nằm đúng chỗ con trỏ lúc dán) */
  .loc-note-flow{display:flex;flex-direction:column;gap:8px;}
  .loc-note-flow .loc-note-text{min-height:0;}
  .loc-note-flow img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:zoom-in;}
  /* Khung soạn thảo kiểu trang tài liệu: 1 khung chung, chữ không có ô viền riêng */
  .lnb-doc{border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-height:110px;cursor:text;}
  .lnb-doc:focus-within{border-color:var(--blue);}
  .loc-note-body textarea.lnb-ta{display:block;width:100%;min-height:26px;margin:0;padding:2px 0;border:none;outline:none;box-shadow:none;background:transparent;color:inherit;font-size:15px;line-height:1.5;border-radius:0;}
  .loc-note-body textarea.lnb-ta.solo{min-height:96px;}
  .lnfig{position:relative;margin:6px 0 2px;}
  .lnfig img{display:block;width:100%;height:auto;max-height:40vh;object-fit:contain;border-radius:8px;border:1px solid var(--border);background:#fff;}
  .lnfig .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border:none;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:13px;padding:0;cursor:pointer;line-height:1;}
  .lnfig.busy{height:84px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:13px;}
  #noteLightbox{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:12px;}
  #noteLightbox.show{display:flex;}
  #noteLightbox img{max-width:96vw;max-height:92vh;object-fit:contain;background:#fff;border-radius:6px;}
  #noteLightbox .lbx{position:absolute;top:10px;right:10px;width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px;cursor:pointer;padding:0;}
  @media (min-width:1250px){
    .note-fab,.loc-note-backdrop,.loc-note-actions{display:none !important;}
    .loc-note{
      display:flex;left:16px;right:auto;bottom:16px;width:260px;max-width:260px;margin:0;max-height:70vh;
      border:1px solid var(--border);border-radius:14px;z-index:20;box-shadow:0 8px 28px var(--shadow);
    }
    /* Nút thu nhỏ: chỉ hiện khi ghi chú đang TRỐNG (có ghi chú thì không cho thu nhỏ để khỏi bỏ sót) */
    .loc-note.can-mini .loc-note-minbtn{display:block;}
    /* Trạng thái thu nhỏ: chỉ còn 1 thanh nhỏ ở góc dưới-trái, bấm vào để mở */
    .loc-note.mini{
      width:auto;max-width:none;padding:8px 14px;cursor:pointer;border-radius:999px;
    }
    .loc-note.mini:hover{background:var(--gray-bg);}
    .loc-note.mini .loc-note-head{margin:0;}
    .loc-note.mini .loc-note-head h3{font-size:14px;white-space:nowrap;}
    .loc-note.mini .loc-note-body,
    .loc-note.mini .loc-note-edit,
    .loc-note.mini .loc-note-minbtn{display:none;}
  }
  .loc-note-minbtn{
    display:none;width:36px;height:36px;border:none;border-radius:8px;background:var(--gray-bg);color:var(--text);
    font-size:16px;font-weight:700;cursor:pointer;padding:0;flex-shrink:0;
  }

  /* ================= Đường kẻ ngang phân cách các nhóm đơn (tab Chờ xử lý) =================
     Chèn bằng nút "—" ở thanh công cụ: tích chọn đơn → bấm "—" → đường kẻ nằm ngay TRÊN đơn đó. */
  :root{--divider:#e879f9;}
  body.light-theme{--divider:#c026d3;}
  .order-divider{display:flex;align-items:center;gap:8px;padding:0 16px;margin:0 0 10px;min-height:22px;}
  .od-line{flex:1;height:4px;border-radius:2px;background:var(--divider);}
  .od-x{
    flex:none;width:24px;height:24px;border-radius:50%;border:none;padding:0;cursor:pointer;
    background:transparent;color:var(--divider);font-size:14px;line-height:1;opacity:.75;
  }
  .od-x:hover{opacity:1;background:var(--gray-bg);}
  .toolbarMid{display:flex;align-items:center;gap:6px;justify-self:center;}

  /* ================= Cảnh báo đang lọc theo hãng ================= */
  .carrierWarnWrap{padding:0 16px 10px;background:var(--card);border-bottom:1px solid var(--border);}
  .carrierWarn{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(251,191,36,.14);
    border:1px solid var(--amber);color:var(--amber);border-radius:8px;padding:7px 10px;
    font-size:12.5px;font-weight:600;line-height:1.4;
  }
  .carrierWarn .cw-text{flex:1 1 180px;min-width:0;}
  .carrierWarn button{
    border:none;border-radius:6px;background:var(--amber);color:#1a1d21;font-weight:700;
    font-size:12.5px;padding:7px 12px;cursor:pointer;
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggleBtn" type="button" title="Chuyển chế độ sáng/tối" aria-label="Chuyển chế độ sáng/tối">🌙</button>

<header>
  <h1>Quản lý In &amp; Đóng gói</h1>
  <div class="tabs">
    <div class="tab active" data-tab="in">Chờ xử lý <span class="count-badge" id="badge-in">0</span></div>
    <div class="tab" data-tab="dong_goi">Chờ bàn giao <span class="count-badge" id="badge-dong_goi">0</span></div>
    <div class="tab" data-tab="xong">Đã bàn giao <span class="count-badge" id="badge-xong">0</span></div>
  </div>
</header>

<div class="addbar" id="addbar">
  <input type="text" id="newName" placeholder="Tên sản phẩm...">
  <input type="number" id="newQty" placeholder="SL" value="1" min="1">
  <button id="addBtn">+</button>
</div>

<div class="searchbar">
  <input type="text" id="searchTask" placeholder="🔍 Tìm việc theo tên, tên đơn hoặc ghi chú...">
</div>

<main>
  <div class="quicklink"><a href="catalog.html">+ Thêm danh sách công việc</a></div>
  <div class="download-all-wrap" id="downloadAllWrap" style="display:none;padding-top:8px;">
    <button class="download-all-btn" id="downloadAllBtn">⬇️ Tải tất cả phiếu giao</button>
    <button class="download-all-btn merge" id="mergeLabelsBtn">📄 Gộp 1 file PDF</button>
  </div>
  <div class="dup-warn" id="dupWarn" style="display:none;"></div>
  <div id="errArea"></div>
  <div class="listToolbar" id="listToolbar">
    <label class="selectAllRow"><input type="checkbox" id="selectAllBox"> Chọn tất cả</label>
    <div class="toolbarMid">
      <button class="sortModeBtn" id="sortModeBtn" type="button" title="Bật/tắt chế độ sắp xếp thứ tự đơn">🔀 Sắp xếp</button>
    </div>
    <div class="listToolbarRight">
      <span class="totalQtyInfo" id="totalQtyInfo">Số lượng: 0</span>
      <button class="clearAllBtn" id="clearAllBtn" style="display:none;">🧹 Làm sạch</button>
    </div>
  </div>
  <div class="carrierBar" id="carrierBar" style="display:none;">
    <div class="carrierChips" id="carrierChips"></div>
  </div>
  <div class="carrierWarnWrap" id="carrierWarnWrap" style="display:none;"><div class="carrierWarn" id="carrierWarn"></div></div>
  <div id="list"></div>
</main>

<div class="status-line" id="connStatus"></div>

<script>
// ---- Chuyển chế độ sáng/tối (giống catalog.html) ----
// Mặc định DARK; bấm nút gắn/gỡ class "light-theme" trên <body>. Lựa chọn lưu
// localStorage khóa 'theme-preference' (chung với catalog.html) và được áp lại
// ngay khi script chạy, trước khi trang hiện ra → không chớp sai theme. Nếu môi
// trường chặn localStorage thì bỏ qua việc lưu, trang vẫn chạy bình thường.
(function(){
  var STORAGE_KEY = 'theme-preference';
  var body = document.body;
  var btn = document.getElementById('themeToggleBtn');
  function readStored(){ try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; } }
  function writeStored(v){ try{ localStorage.setItem(STORAGE_KEY, v); }catch(e){} }
  var stored = readStored();
  if(stored === 'light') body.classList.add('light-theme');
  else if(stored === 'dark') body.classList.remove('light-theme');
  function paintThemeBtn(){
    var isLight = body.classList.contains('light-theme');
    btn.textContent = isLight ? '☀️' : '🌙';
    btn.title = isLight ? 'Chuyển sang chế độ tối' : 'Chuyển sang chế độ sáng';
  }
  btn.addEventListener('click', function(){
    body.classList.toggle('light-theme');
    writeStored(body.classList.contains('light-theme') ? 'light' : 'dark');
    paintThemeBtn();
  });
  paintThemeBtn();
})();
</script>

// ---- Helper: commit an edit (save) either on explicit click or on click-away ----
// Attaches a "focusout" listener to containerEl; if focus moves to something
// outside containerEl, commitFn() runs automatically (click ra ngoài = lưu & đóng).
// The returned function can be wired to a "Lưu" button so both paths share
// the same one-shot commit (no double-submit).
function attachClickAwayCommit(containerEl, commitFn){
  let committed = false;
  const commit = () => {
    if(committed) return;
    committed = true;
    commitFn();
  };
  containerEl.addEventListener("focusout", () => {
    setTimeout(() => {
      if(!containerEl.isConnected) return; // already closed/removed (e.g. Hủy)
      if(!containerEl.contains(document.activeElement)) commit();
    }, 0);
  });
  return commit;
}

// ---- Helpers: id generation for orders ----
function newOrderId(){ return "o_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
// Không còn sinh "tên tự động" giả (kiểu "#ABC123XYZ") cho đơn chưa đặt tên
// nữa — orderName để trống (null/"") cho tới khi quét được mã vận đơn thật từ
// PDF phiếu giao (xem extractTrackingFromPdf ở dưới). Ở mọi nơi hiển thị,
// orderName trống được render bằng placeholder CSS "┈┈┈┈┈┈┈┈┈" (class
// "order-name-placeholder", xem hàm renderOrderName()) thay vì một chuỗi ký
// tự giả — tránh gây hiểu lầm với mã vận đơn thật, và không phụ thuộc vào
// việc "đoán" độ dài mã thật (mã thật của mỗi hãng dài ngắn khác nhau).
function renderOrderName(name){

}

selectAllBox.addEventListener("change", () => {

  else shown.forEach(t => selected.delete(orderKey(t)));

function orderKey(t){ return t.orderId || t.id; }
function taskCreatedMs(t){
  return (t.createdAt && typeof t.createdAt.toMillis === "function") ? t.createdAt.toMillis() : Date.now();
}
// Khóa thứ tự của 1 đơn theo danh sách sản phẩm của nó.
function orderSortKeyOf(items){
  for(const t of items) if(typeof t.sortOrder === "number") return t.sortOrder;
  return Math.min(...items.map(taskCreatedMs));
}
// Khóa lớn nhất / nhỏ nhất trong TOÀN BỘ đơn (mọi tab) — để "lên đầu"/"xuống cuối".
function orderKeyExtremes(){
  const byOrder = new Map();
  allTasks.forEach(t => { const k = orderKey(t); if(!byOrder.has(k)) byOrder.set(k, []); byOrder.get(k).push(t); });
  let max = -Infinity, min = Infinity;
  byOrder.forEach(items => { const k = orderSortKeyOf(items); if(k > max) max = k; if(k < min) min = k; });
  return { max: max === -Infinity ? Date.now() : max, min: min === Infinity ? Date.now() : min };
}
async function setOrderSortKey(orderId, key){
  const items = allTasks.filter(t => orderKey(t) === orderId);
  items.forEach(t => { t.sortOrder = key; });
  try{
    await Promise.all(items.map(t => updateDoc(doc(db, "tasks", t.id), { sortOrder: key })));
  }catch(e){
    connStatus.textContent = "Không lưu được thứ tự mới: " + e.message;
  }
}
// dir: -1 = lên 1 bậc, +1 = xuống 1 bậc (so với đơn kế bên ĐANG HIỂN THỊ).
async function moveOrder(orderId, dir){
  const idx = currentGroups.findIndex(g => g.orderId === orderId);
  const nIdx = idx + dir;
  if(idx < 0 || nIdx < 0 || nIdx >= currentGroups.length) return;
  const a = currentGroups[idx], b = currentGroups[nIdx];
  const ka = orderSortKeyOf(a.items), kb = orderSortKeyOf(b.items);
  // Hoán đổi khóa; nếu 2 khóa trùng nhau thì lệch 1 để vẫn đổi được chỗ.
  const newA = ka === kb ? kb + (dir < 0 ? 1 : -1) : kb;
  // setOrderSortKey cập nhật dữ liệu cục bộ ngay (đồng bộ) rồi mới ghi
  // Firestore → render ngay được, giao diện đổi chỗ tức thì.
  setOrderSortKey(a.orderId, newA);
  setOrderSortKey(b.orderId, ka);
  render();
}
async function moveOrderToEdge(orderId, toTop){
  const { max, min } = orderKeyExtremes();
  await setOrderSortKey(orderId, toTop ? max + 1 : min - 1);
  render();
}
// Trạng thái task ứng với tab hiện tại.

}

// ---- Add task ----
document.getElementById("addBtn").addEventListener("click", addTask);
document.getElementById("newName").addEventListener("keydown", e => { if(e.key === "Enter") addTask(); });

async function addTask(){
  const nameEl = document.getElementById("newName");
  const qtyEl = document.getElementById("newQty");
  const name = nameEl.value.trim();
  // Chặn số lượng âm/0/thập phân gõ tay (thuộc tính min="1" trên input chỉ
  // là gợi ý UI, không chặn được người dùng gõ số âm bằng bàn phím) — ép về
  // tối thiểu 1 nếu giá trị không hợp lệ hoặc nhỏ hơn 1.
  const qty = Math.max(1, parseInt(qtyEl.value) || 1);
  if(!name) return;
  try{
    await addDoc(tasksCol, {
      name, qty,
      status: "cho_in",
      note: "",
      orderId: newOrderId(),
      orderName: null,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    nameEl.value = "";
    qtyEl.value = "1";
    nameEl.focus();
  }catch(e){
    showError("Không thêm được việc mới: " + e.message);
  }
}

// ---- Realtime listener ----
const q = query(tasksCol, orderBy("createdAt", "asc"));
onSnapshot(q, snap => {
  allTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  tasksSettled = !snap.metadata.fromCache && !snap.metadata.hasPendingWrites;
  connStatus.textContent = "";
  render();
  schedulePruneDividers();
}, err => {
  connStatus.textContent = "Lỗi kết nối: " + err.message;
});

// Lưu ý: từ khi chuyển phiếu giao sang lưu ở Cloudinary, việc xóa file PDF
// không còn thực hiện được an toàn từ trình duyệt nữa (Cloudinary yêu cầu ký
// bằng API Secret để xóa, không thể nhúng secret đó vào code public trên
// GitHub Pages). Nên khi 1 đơn bị xóa (thủ công), chỉ Firestore doc bị xóa —
// file PDF cũ trên Cloudinary sẽ "mồ côi" (không tự dọn). Vì file phiếu giao
// rất nhẹ và gói free Cloudinary có 25GB/tháng, việc này không đáng ngại —
// đây là đánh đổi đã thống nhất để tránh phải khai thẻ cho Firebase Blaze.

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Định dạng thời gian tạo đơn kiểu "14:32, 26/07" — thay cho tên người mua
// (dữ liệu không có) trên thẻ tóm tắt, giống vị trí đó ở giao diện Shopee.
function formatDT(ts){
  if(!ts || typeof ts.toDate !== "function") return "";
  const d = ts.toDate();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const mo = String(d.getMonth() + 1).padStart(2, "0");
  return `${hh}:${mm}, ${dd}/${mo}`;
}

const STATUS_LABEL = { in: "Chờ xử lý", dong_goi: "Chờ bàn giao", xong: "Đã bàn giao" };
const STATUS_COLOR_CLASS = { in: "st-warn", dong_goi: "st-info", xong: "st-ready" };

// ---- Đơn vị vận chuyển ----
// Danh sách hãng đã nhận diện được từ mẫu phiếu thật (xem detectCarrierFromText).
// "unknown" đại diện cho các đơn chưa nhận diện được hãng (mẫu lạ, PDF ảnh
// scan không đọc được text, hoặc chưa đính phiếu giao) — vẫn xử lý như 1
// nhóm/carrier bình thường trong UI, chỉ khác là luôn xếp cuối danh sách.
// MUỐN THÊM HÃNG MỚI NHANH (không cần viết thêm logic): thêm 1 dòng vào
// CARRIER_LABEL + 1 key vào CARRIER_ORDER (trước "unknown"). Còn nếu chưa kịp
// sửa code thì người dùng vẫn tự ghi tên hãng bất kỳ qua tùy chọn "✏️ Khác
// (tự nhập)" ở ô Đơn vị VC — xem carrierKeyOf() bên dưới.
// Nhãn ngắn chỉ dùng cho chip lọc (để vừa 1 hàng trên điện thoại); tên đầy đủ vẫn dùng ở nơi khác.
const CARRIER_SHORT = { "jt": "J&T", "spx": "SPX", "ghn": "GHN", "best": "BEST", "unknown": "Chưa rõ" };
const CARRIER_LABEL = { "jt": "J&T Express", "spx": "SPX Express", "ghn": "Giao Hàng Nhanh", "best": "BEST Express", "unknown": "Chưa rõ hãng" };
const CARRIER_ORDER = ["jt", "spx", "ghn", "best", "unknown"]; // thứ tự cố định khi hiển thị nhóm — "unknown" luôn ở cuối
// Hãng do người dùng TỰ GÕ: lưu carrier = "custom" + carrierName = chữ tự gõ.
// Mỗi tên (không phân biệt hoa/thường) là 1 nhóm riêng, xếp sau các hãng đã
// biết và trước "unknown".
const CARRIER_CUSTOM = "custom";
const customCarrierNames = new Map(); // key "custom:<tên viết thường>" -> tên hiển thị (giữ nguyên hoa/thường)
// Khóa nhóm hãng của 1 {carrier, carrierName}: key đã biết | "custom:..." | "unknown".
function carrierKeyOf(c){
  const carrier = c && c.carrier, name = ((c && c.carrierName) || "").trim();
  if(carrier === CARRIER_CUSTOM && name){
    const key = CARRIER_CUSTOM + ":" + name.toLowerCase();
    if(!customCarrierNames.has(key)) customCarrierNames.set(key, name);
    return key;
  }
  return (carrier && CARRIER_LABEL[carrier]) ? carrier : "unknown";
}
function carrierLabelOf(key){
  if(CARRIER_LABEL[key]) return CARRIER_LABEL[key];
  return customCarrierNames.get(key) || CARRIER_LABEL.unknown;
}
// Sắp các key hiện có: hãng đã biết (theo CARRIER_ORDER) -> hãng tự nhập (A-Z) -> unknown.
function sortCarrierKeys(keys){
  const set = new Set(keys);
  const known = CARRIER_ORDER.filter(k => k !== "unknown" && set.has(k));
  const custom = keys.filter(k => !CARRIER_LABEL[k]).sort((a, b) => carrierLabelOf(a).localeCompare(carrierLabelOf(b), "vi"));
  return known.concat(custom, set.has("unknown") ? ["unknown"] : []);
}

// Chỉ bật preview-khi-rê-chuột trên thiết bị có hover thật + con trỏ chính
// xác (chuột desktop) — tránh tình trạng lag/kẹt overlay trên cảm ứng, nơi
// "hover" có thể bị trình duyệt giả lập khi chạm.
const supportsHoverPreview = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
let hoverPreviewEl = null;

function getHoverPreviewEl(){
  if(hoverPreviewEl) return hoverPreviewEl;
  hoverPreviewEl = document.createElement("div");
  hoverPreviewEl.className = "thumb-hover-preview";
  document.body.appendChild(hoverPreviewEl);
  return hoverPreviewEl;
}

function showHoverPreview(t, anchorEl){
  const { title, classification } = splitProductName(t.name);
  const el = getHoverPreviewEl();
  el.innerHTML = t.image
    ? `<img src="${t.image}" alt="">`
    : `<div class="thumb-lightbox-noimg" style="padding:80px 0;text-align:center;">🖼</div>`;
  el.innerHTML += `<div class="thumb-hover-info">
      <div class="thumb-hover-title"></div>
      <div class="thumb-hover-classification"></div>
    </div>`;
  el.querySelector(".thumb-hover-title").textContent = title;
  el.querySelector(".thumb-hover-classification").textContent = classification;

  // Đặt preview cạnh bên phải thumbnail; nếu không đủ chỗ (gần mép phải
  // màn hình) thì lật sang trái. Kẹp trong khung nhìn theo chiều dọc.
  const rect = anchorEl.getBoundingClientRect();
  const previewW = 420, previewH = 480, gap = 12;
  let left = rect.right + gap;
  if(left + previewW > window.innerWidth) left = rect.left - previewW - gap;
  left = Math.max(8, Math.min(left, window.innerWidth - previewW - 8));
  let top = rect.top;
  top = Math.max(8, Math.min(top, window.innerHeight - previewH - 8));
  el.style.left = left + "px";
  el.style.top = top + "px";
  el.classList.add("show");
}

function hideHoverPreview(){
  if(hoverPreviewEl) hoverPreviewEl.classList.remove("show");
}
// An toàn: nếu cuộn trang hoặc đổi tab trong lúc đang hover (element bị gỡ
// khỏi DOM giữa chừng khiến mouseleave không kịp bắn), ẩn preview theo để
// tránh ô nổi bị "kẹt" sai vị trí trên màn hình.
window.addEventListener("scroll", hideHoverPreview, true);
window.addEventListener("resize", hideHoverPreview);

// Khung ảnh sản phẩm — hiện ảnh thật nếu task có field "image" (URL, gán từ
// catalog.html), ảnh lỗi tự rơi về icon 🖼 mặc định thay vì để ô vỡ hình.
// Bấm vào ảnh sẽ mở lightbox phóng to (xem openThumbLightbox); trên desktop
// rê chuột qua cũng hiện preview to ngay lập tức (xem showHoverPreview) —
// các phân loại cùng sản phẩm (vd MS1/MS2/MS3) thường có tông màu giống
// nhau, ảnh tí hon 56-72px rất dễ nhìn nhầm, cần phóng to để người in xác
// nhận đúng mẫu trước khi in.
function renderThumb(t){
  const thumb = document.createElement("div");
  thumb.className = "thumb-placeholder";
  thumb.title = "Bấm để xem ảnh lớn";
  if(t.image){
    const img = document.createElement("img");
    img.src = t.image;
    img.alt = t.name || "";
    img.addEventListener("error", () => { thumb.innerHTML = ""; thumb.textContent = "🖼"; });
    thumb.appendChild(img);
  } else {
    thumb.textContent = "🖼";
  }
  thumb.addEventListener("click", e => {
    e.stopPropagation();
    hideHoverPreview();
    openThumbLightbox(t);
  });
  if(supportsHoverPreview){
    thumb.addEventListener("mouseenter", () => showHoverPreview(t, thumb));
    thumb.addEventListener("mouseleave", hideHoverPreview);
  }
  return thumb;
}

// Overlay phóng to ảnh phân loại — đóng bằng nút X, bấm ra ngoài, hoặc phím Esc.
function openThumbLightbox(t){
  const { title, classification } = splitProductName(t.name);
  const overlay = document.createElement("div");
  overlay.className = "thumb-lightbox-overlay";

  const box = document.createElement("div");
  box.className = "thumb-lightbox-box";

  const closeBtn = document.createElement("button");
  closeBtn.className = "thumb-lightbox-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", close);
  box.appendChild(closeBtn);

  const imgWrap = document.createElement("div");
  imgWrap.className = "thumb-lightbox-imgwrap";
  if(t.image){
    const img = document.createElement("img");
    img.src = t.image;
    img.alt = t.name || "";
    img.addEventListener("error", () => {
      imgWrap.innerHTML = `<div class="thumb-lightbox-noimg">🖼</div>`;
    });
    imgWrap.appendChild(img);
  } else {
    imgWrap.innerHTML = `<div class="thumb-lightbox-noimg">🖼</div>`;
  }
  box.appendChild(imgWrap);

  const info = document.createElement("div");
  info.className = "thumb-lightbox-info";
  info.innerHTML = `<div class="thumb-lightbox-title"></div><div class="thumb-lightbox-classification"></div>`;
  info.querySelector(".thumb-lightbox-title").textContent = title;
  info.querySelector(".thumb-lightbox-classification").textContent = classification;
  box.appendChild(info);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  // Khoá cuộn nền trong lúc lightbox mở — quan trọng trên mobile/tablet để
  // tránh trang phía sau trôi/nảy theo khi vuốt trong vùng overlay.
  const prevBodyOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";

  function close(){
    overlay.remove();
    document.body.style.overflow = prevBodyOverflow;
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e){ if(e.key === "Escape") close(); }
  overlay.addEventListener("click", e => { if(e.target === overlay) close(); });
  document.addEventListener("keydown", onKey);
}

// ---- Grouping helpers ----
function groupShown(shown){
  const order = [];
  const map = new Map();
  shown.forEach(t => {
    const oid = t.orderId || t.id;
    if(!map.has(oid)){
      // Không còn fallback về t.name nữa: orderName rỗng phải hiện placeholder
      // "┈┈┈┈┈┈┈┈┈" (renderOrderName()) chứ không phải tên sản phẩm — trước
      // đây fallback này vô hại vì orderName luôn có giá trị (mã "#..." tự
      // sinh), giờ orderName có thể thật sự rỗng nên phải bỏ fallback.
      map.set(oid, { orderId: oid, orderName: t.orderName || null, carrier: null, carrierName: "", shipLabelUrl: "", note: "", items: [] });
      order.push(oid);
    }
    const g = map.get(oid);
    // shipLabelUrl/note/carrier được ghi lặp lên mọi item cùng orderId (giống
    // orderName) — chỉ cần lấy giá trị đầu tiên tìm thấy trong cả nhóm.
    if(!g.shipLabelUrl && t.shipLabelUrl) g.shipLabelUrl = t.shipLabelUrl;
    if(!g.note && t.note) g.note = t.note;
    if(!g.carrier && t.carrier) g.carrier = t.carrier;
    if(!g.carrierName && t.carrierName) g.carrierName = t.carrierName;
    g.items.push(t);
  });
  return order.map(oid => map.get(oid));
}

// Cho biết những orderId nào sẽ KHÔNG còn item nào sau khi xóa các id trong
// deletedIds — dùng để biết đơn nào "trống hẳn" (từ đó dọn phiếu giao đính
// kèm nếu cần). So sánh trên allTasks HIỆN TẠI (trước khi xóa thật sự), nên
// phải gọi hàm này trước khi deleteDoc(), không phải sau.
// ---- Render ----
// Trả về danh sách task theo TAB + TỪ KHÓA TÌM KIẾM — CHƯA áp dụng lọc theo
// hãng vận chuyển (xem applyCarrierFilter()). Tách riêng để carrierBar luôn
// tính được tổng số đúng của từng hãng, không bị chính bộ lọc của nó che mất.
function getShown(){
  let shown;
  if(currentTab === "in") shown = allTasks.filter(t => t.status === "cho_in");
  else if(currentTab === "dong_goi") shown = allTasks.filter(t => t.status === "cho_dong_goi");
  // Không giới hạn số mục ở client: tập dữ liệu status=xong không còn tự dọn
  // theo thời gian nữa (đã bỏ cơ chế hết hạn 7 ngày) — người dùng tự xóa thủ
  // công qua nút "Làm sạch" khi cần.
  else shown = allTasks.filter(t => t.status === "xong").slice().reverse(); // mới bàn giao xếp trước

  if(searchTerm) shown = shown.filter(matchesSearch);
  return shown;
}

// 1 task có khớp từ khóa tìm kiếm hiện tại không (tên, mã đơn hoặc ghi chú).
function matchesSearch(t){
  return (t.name || "").toLowerCase().includes(searchTerm) ||
    (t.orderName || "").toLowerCase().includes(searchTerm) ||
    (t.note || "").toLowerCase().includes(searchTerm);
}

// Các đơn có phiếu giao CỦA ĐÚNG TAB ĐANG MỞ: tab "Chờ xử lý" chỉ lấy đơn chờ
// xử lý, tab "Chờ bàn giao" chỉ lấy đơn chờ bàn giao (mỗi đơn 1 lần), có áp từ
// khóa tìm kiếm. Dùng chung cho nút "Tải tất cả phiếu giao" và "Gộp 1 file
// PDF". Không áp bộ lọc hãng. Tab "Đã bàn giao" không dùng 2 nút này.
function getActiveLabelGroups(){
  const status = currentTab === "in" ? "cho_in" : currentTab === "dong_goi" ? "cho_dong_goi" : null;
  if(!status) return [];
  let tasks = allTasks.filter(t => t.status === status);
  if(searchTerm) tasks = tasks.filter(matchesSearch);
  return groupShown(tasks).filter(g => g.shipLabelUrl);
}

// Phiếu giao của các đơn đang được TÍCH CHỌN (thanh thao tác hàng loạt). Selected
// chứa id từng sản phẩm; groupShown gộp theo orderId nên 1 đơn nhiều sản phẩm
// chỉ cho ra 1 phiếu (không bị tải/gộp trùng).
// Trả { groups: các đơn CÓ phiếu, missing: số đơn đã chọn nhưng chưa có phiếu }.
function getSelectedLabelGroups(){
  const tasks = getSelectedTasks();
  const all = groupShown(tasks);
  const groups = all.filter(g => g.shipLabelUrl);
  return { groups, missing: all.length - groups.length };
}
