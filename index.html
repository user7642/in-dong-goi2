const locNoteEditBtn = document.getElementById("locNoteEditBtn");
const desktopNoteMQ = window.matchMedia("(min-width:1250px)");
let locNoteText = "";
let locNoteDraft = "";
let locNoteEditing = false;
let locNoteErr = "";       // lỗi khi lưu
let locNoteSyncErr = "";   // lỗi đồng bộ
let locNoteMini = true;    // desktop: thu nhỏ khi ghi chú trống (người dùng bấm mở thì = false)
const locNoteMinBtn = document.getElementById("locNoteMinBtn");

// Ghi chú = chuỗi khối theo thứ tự: {t:"text",v:"..."} hoặc {t:"img",u:"https://..."}
// (ảnh nằm đúng vị trí đã chèn, chữ ngay dưới ảnh là chú thích của ảnh đó).
let locNoteBlocks = [];        // đã lưu (đồng bộ mọi máy)
let locNoteDraftBlocks = [];   // bản nháp đang sửa; ảnh đang tải có busy:true
let locNoteCaret = null;       // vị trí con trỏ gần nhất {block,pos}
let locNotePendingFocus = null;// khối chữ cần trả con trỏ sau khi vẽ lại
function noteBusyCount(){ return locNoteDraftBlocks.filter(b => b.t === "img" && b.busy).length; }
function noteImgCount(){ return locNoteDraftBlocks.filter(b => b.t === "img").length; }
function hasLocNote(){ return locNoteBlocks.some(b => b.t === "img" || (b.v || "").trim()); }
// Chuẩn hóa để sửa được: luôn có khối chữ ở đầu, cuối và giữa 2 ảnh; 2 khối chữ liền nhau thì gộp.
function normBlocks(list){
  const out = [];
  (list || []).forEach(b => {
    if(b.t === "img"){
      if(!out.length || out[out.length - 1].t === "img") out.push({ t: "text", v: "" });
      out.push(b);
    } else {
      const last = out[out.length - 1];
      if(last && last.t === "text"){ if(b.v) last.v = last.v ? last.v + "\n" + b.v : b.v; }
      else out.push({ t: "text", v: b.v || "" });
    }
  });
  if(!out.length || out[out.length - 1].t === "img") out.push({ t: "text", v: "" });
  return out;
}
// Đọc từ Firestore: ưu tiên blocks; bản cũ chỉ có text + images thì quy về chữ rồi các ảnh.
function blocksFromDoc(d){
  const okUrl = u => typeof u === "string" && /^https:\/\//.test(u);
  if(Array.isArray(d.blocks)){
    return d.blocks.filter(b => b && ((b.t === "text" && typeof b.v === "string") || (b.t === "img" && okUrl(b.u))))
      .map(b => b.t === "img" ? { t: "img", u: b.u } : { t: "text", v: b.v });
  }
  const out = [];
  if(typeof d.text === "string" && d.text.trim()) out.push({ t: "text", v: d.text });
  (Array.isArray(d.images) ? d.images : []).filter(okUrl).forEach(u => out.push({ t: "img", u }));
  return out;
}
function blocksForSave(){
  const o = [];
  locNoteDraftBlocks.forEach(b => {
    if(b.t === "img"){ if(b.u && !b.busy) o.push({ t: "img", u: b.u }); }
    else { const v = (b.v || "").replace(/\s+$/, ""); if(v.trim()) o.push({ t: "text", v }); }
  });
  return o;
}
function captureNoteFocus(){
  const a = document.activeElement;
  if(a && a.tagName === "TEXTAREA" && a.__b && locNoteBody.contains(a)) locNotePendingFocus = { block: a.__b, pos: a.selectionStart };
}
function setLocNoteOpen(open){
  locNotePanel.classList.toggle("show", open);
  locNoteBackdrop.classList.toggle("show", open && !desktopNoteMQ.matches);
}
function applyLocNoteMini(){
  // Chỉ được thu nhỏ khi ghi chú trống (không chữ, không ảnh) và không đang soạn.
  const canMini = !hasLocNote() && !locNoteEditing;
  if(hasLocNote()) locNoteMini = true;   // có ghi chú: lần sau trống lại sẽ về dạng thu nhỏ
  const mini = canMini && locNoteMini;
  locNotePanel.classList.toggle("mini", mini);
  locNotePanel.classList.toggle("can-mini", canMini && !locNoteMini);
  if(mini){ locNotePanel.setAttribute("role","button"); locNotePanel.tabIndex = 0; locNotePanel.setAttribute("aria-expanded","false"); }
  else { locNotePanel.removeAttribute("role"); locNotePanel.removeAttribute("tabindex"); locNotePanel.removeAttribute("aria-expanded"); }
}

// ---- Ảnh trong ghi chú ----
// Chèn tham số biến đổi của Cloudinary vào URL để ảnh hiển thị nhẹ + vừa khung (w = bề rộng tối đa).
function noteImgUrl(url, w){
  return url.includes("/image/upload/") ? url.replace("/image/upload/", `/image/upload/c_limit,w_${w},q_auto,f_auto/`) : url;
}
function makeNoteImg(url, w, cls){
  const img = document.createElement("img");
  if(cls) img.className = cls;
  img.loading = "lazy"; img.alt = "";
  img.src = noteImgUrl(url, w);
  // Nếu tài khoản Cloudinary chặn biến đổi (strict transformations) thì quay về ảnh gốc.
  img.onerror = () => { img.onerror = null; img.src = url; };
  return img;
}
// Thu nhỏ ảnh trước khi tải (cạnh dài tối đa 1600px, JPEG 85%) — ảnh chụp màn hình/điện thoại
// thường vài MB, thu nhỏ giúp tải nhanh, đỡ tốn dung lượng Cloudinary.
async function shrinkImage(file){
  if(!/^image\/(png|jpe?g|webp|bmp)$/i.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const MAX = 1600, k = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
    if(k === 1 && file.size < 600 * 1024){ if(bmp.close) bmp.close(); return file; }
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    if(bmp.close) bmp.close();
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
    return (blob && blob.size < file.size) ? blob : file;
  }catch(e){ return file; }
}
async function uploadNoteImage(file){
  const blob = await shrinkImage(file);
  const fd = new FormData();
  fd.append("file", blob, "ghi-chu.jpg");
  fd.append("upload_preset", CLOUDINARY_NOTE_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
  const data = await res.json().catch(() => ({}));
  if(!res.ok || !data.secure_url){
    const m = (data.error && data.error.message) || ("HTTP " + res.status);
    throw new Error(/preset/i.test(m) ? `${m} (kiểm tra upload preset "${CLOUDINARY_NOTE_PRESET}" đã tạo, chế độ Unsigned)` : m);
  }
  return data.secure_url;
}
// Chèn ảnh vào đúng vị trí con trỏ: tách khối chữ làm 2 (trước | sau), đặt ảnh ở giữa.
// Chữ phía sau con trỏ trở thành khối chữ nằm ngay dưới ảnh (chỗ ghi chú cho ảnh).
function addNoteFiles(fileList, target){
  const files = Array.from(fileList || []).filter(f => f && /^image\//.test(f.type));
  if(!files.length) return;
  let cur = (target && locNoteDraftBlocks.includes(target.block)) ? target : null;
  if(!cur){ const lt = locNoteDraftBlocks[locNoteDraftBlocks.length - 1]; cur = { block: lt, pos: (lt.v || "").length }; }
  locNoteErr = "";
  for(const f of files){
    if(noteImgCount() >= NOTE_MAX_IMAGES){ locNoteErr = `Tối đa ${NOTE_MAX_IMAGES} ảnh cho mỗi ghi chú.`; break; }
    const v = cur.block.v || "";
    const idx = locNoteDraftBlocks.indexOf(cur.block);
    const img = { t: "img", busy: true, u: "" };
    const tail = { t: "text", v: v.slice(cur.end != null ? cur.end : cur.pos) };
    cur.block.v = v.slice(0, cur.pos);
    locNoteDraftBlocks.splice(idx + 1, 0, img, tail);
    cur = { block: tail, pos: 0 };
    uploadNoteImage(f)
      .then(u => { img.u = u; img.busy = false; })
      .catch(e => {
        locNoteErr = "Không tải được ảnh: " + e.message;
        const i = locNoteDraftBlocks.indexOf(img);
        if(i >= 0){ locNoteDraftBlocks.splice(i, 1); locNoteDraftBlocks = normBlocks(locNoteDraftBlocks); }
      })
      .finally(() => { captureNoteFocus(); renderLocNote(); });
  }
  locNoteCaret = cur; locNotePendingFocus = cur;
  renderLocNote();
}
// Lightbox xem ảnh lớn (bấm nền / ✕ / Esc để đóng)
const noteLb = document.createElement("div");
noteLb.id = "noteLightbox";
noteLb.innerHTML = '<button type="button" class="lbx" aria-label="Đóng">✕</button><img alt="">';
document.body.appendChild(noteLb);
const noteLbImg = noteLb.querySelector("img");
function openNoteLb(url){
  noteLbImg.onerror = () => { noteLbImg.onerror = null; noteLbImg.src = url; };
  noteLbImg.src = noteImgUrl(url, 2000);
  noteLb.classList.add("show");
}
function closeNoteLb(){ noteLb.classList.remove("show"); noteLbImg.removeAttribute("src"); }
noteLb.addEventListener("click", e => { if(e.target !== noteLbImg) closeNoteLb(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && noteLb.classList.contains("show")){ e.stopPropagation(); closeNoteLb(); } }, true);

function renderLocNote(){
  locNoteFab.classList.toggle("has-note", hasLocNote());
  applyLocNoteMini();
  locNoteEditBtn.classList.toggle("active", locNoteEditing);
  locNoteBody.innerHTML = "";
  if(locNoteEditing){
    const fits = [];
    const docEl = document.createElement("div");
    docEl.className = "lnb-doc";
    // Bấm vào khoảng trống của khung (dưới cùng) -> đưa con trỏ về cuối khối chữ cuối.
    docEl.addEventListener("click", e => {
      if(e.target !== docEl) return;
      const tas = docEl.querySelectorAll("textarea");
      const last = tas[tas.length - 1];
      if(last){ last.focus(); last.setSelectionRange(last.value.length, last.value.length); }
    });
    locNoteDraftBlocks.forEach((b, i) => {
      if(b.t === "text"){
        const ta = document.createElement("textarea");
        ta.className = "lnb-ta"; ta.rows = 1; ta.__b = b; ta.value = b.v || "";
        const solo = locNoteDraftBlocks.length === 1;
        if(solo){ ta.className += " solo"; ta.placeholder = "Ghi chú... (dán ảnh Ctrl+V tại vị trí con trỏ)"; }
        const fit = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
        fits.push(fit);
        const mark = () => { locNoteCaret = { block: b, pos: ta.selectionStart }; };
        ta.addEventListener("input", () => { b.v = ta.value; fit(); mark(); });
        ["focus", "click", "keyup", "select"].forEach(ev => ta.addEventListener(ev, mark));
        ta.addEventListener("keydown", e => {
          if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ saveLocNote(); return; }
          // Mũi tên ↑/↓ ở mép khối chữ: nhảy sang khối chữ trước/sau (qua ảnh) như trình soạn thảo.
          if(ta.selectionStart !== ta.selectionEnd || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
          const tas = Array.from(locNoteBody.querySelectorAll("textarea.lnb-ta")), k = tas.indexOf(ta);
          if(e.key === "ArrowUp" && ta.selectionStart === 0 && k > 0){
            e.preventDefault(); const t = tas[k - 1]; t.focus(); t.setSelectionRange(t.value.length, t.value.length);
          } else if(e.key === "ArrowDown" && ta.selectionStart === ta.value.length && k >= 0 && k < tas.length - 1){
            e.preventDefault(); const t = tas[k + 1]; t.focus(); t.setSelectionRange(0, 0);
          }
        });
        docEl.appendChild(ta);
      } else if(b.busy){
        const f = document.createElement("div"); f.className = "lnfig busy"; f.textContent = "Đang tải ảnh…";
        docEl.appendChild(f);
      } else {
        const f = document.createElement("div"); f.className = "lnfig";
        f.appendChild(makeNoteImg(b.u, 700));
        const x = document.createElement("button");
        x.type = "button"; x.className = "x"; x.textContent = "✕"; x.title = "Gỡ ảnh này"; x.setAttribute("aria-label", "Gỡ ảnh");
        x.addEventListener("click", () => {
          const k = locNoteDraftBlocks.indexOf(b);
          const prev = locNoteDraftBlocks[k - 1];
          locNoteDraftBlocks.splice(k, 1);
          locNoteDraftBlocks = normBlocks(locNoteDraftBlocks);
          if(prev) locNotePendingFocus = { block: prev };
          renderLocNote();
        });
        f.appendChild(x); docEl.appendChild(f);
      }
    });
    locNoteBody.appendChild(docEl);
    const add = document.createElement("button");
    add.type = "button"; add.className = "loc-note-addimg"; add.textContent = "🖼 Thêm ảnh tại vị trí con trỏ";
    const fi = document.createElement("input");
    fi.type = "file"; fi.accept = "image/*"; fi.multiple = true; fi.style.display = "none";
    fi.addEventListener("change", () => { addNoteFiles(fi.files, locNoteCaret); fi.value = ""; });
    add.addEventListener("click", () => fi.click());
    locNoteBody.appendChild(add); locNoteBody.appendChild(fi);
    const hint = document.createElement("div");
    hint.className = "loc-note-hint";
    hint.textContent = "Dán (Ctrl+V) hoặc kéo thả ảnh tại vị trí con trỏ. Bấm vào khoảng trống trên/dưới ảnh để gõ chữ. Tối đa " + NOTE_MAX_IMAGES + " ảnh.";
    locNoteBody.appendChild(hint);
    if(locNoteErr){
      const er = document.createElement("div");
      er.className = "loc-note-err";
      er.textContent = "⚠️ " + locNoteErr;
      locNoteBody.appendChild(er);
    }
    const busy = noteBusyCount();
    const btns = document.createElement("div");
    btns.className = "loc-note-btns";
    const cancel = document.createElement("button");
    cancel.type = "button"; cancel.className = "loc-note-cancel"; cancel.textContent = "Hủy";
    cancel.addEventListener("click", () => { locNoteEditing = false; locNoteErr = ""; locNoteMini = true; renderLocNote(); });
    const save = document.createElement("button");
    save.type = "button"; save.className = "loc-note-save"; save.textContent = busy ? "Đang tải ảnh…" : "Lưu";
    save.disabled = busy > 0;
    save.addEventListener("click", saveLocNote);
    btns.appendChild(cancel); btns.appendChild(save);
    locNoteBody.appendChild(btns);
    setTimeout(() => {
      fits.forEach(f => f());
      const pf = locNotePendingFocus; locNotePendingFocus = null;
      if(pf){
        const ta = Array.from(locNoteBody.querySelectorAll("textarea")).find(t => t.__b === pf.block);
        if(ta){ const n = pf.pos == null ? ta.value.length : Math.min(pf.pos, ta.value.length); ta.focus(); ta.setSelectionRange(n, n); }
      }
    }, 0);
  } else {
    if(!hasLocNote()){
      const t = document.createElement("div");
      t.className = "loc-note-text empty";
      t.textContent = "Chưa có ghi chú. Bấm ✏️ để viết.";
      locNoteBody.appendChild(t);
    } else {
      const flow = document.createElement("div");
      flow.className = "loc-note-flow";
      locNoteBlocks.forEach(b => {
        if(b.t === "img"){
          const img = makeNoteImg(b.u, 900);
          img.addEventListener("click", e => { e.stopPropagation(); openNoteLb(b.u); });
          flow.appendChild(img);
        } else if((b.v || "").trim()){
          const t = document.createElement("div");
          t.className = "loc-note-text"; t.textContent = b.v;
          flow.appendChild(t);
        }
      });
      locNoteBody.appendChild(flow);
    }
    if(locNoteSyncErr){
      const er = document.createElement("div");
      er.className = "loc-note-err";
      er.textContent = "⚠️ " + locNoteSyncErr;
      locNoteBody.appendChild(er);
    }
  }
}
async function saveLocNote(){
  if(noteBusyCount() > 0){ locNoteErr = "Ảnh đang tải lên, đợi xong rồi bấm Lưu."; renderLocNote(); return; }
  const blocks = blocksForSave();
  // text + images giữ lại để tương thích bản cũ / nơi khác đọc ghi chú.
  const text = blocks.filter(b => b.t === "text").map(b => b.v).join("\n");
  const images = blocks.filter(b => b.t === "img").map(b => b.u);
  try{
    await setDoc(locNoteRef, { blocks, text, images, updatedAt: serverTimestamp() });
    locNoteBlocks = blocks; locNoteText = text;
    locNoteEditing = false;
    locNoteErr = "";
    locNoteMini = true;
  }catch(e){
    locNoteErr = "Không lưu được ghi chú: " + e.message;
  }
  renderLocNote();
}
locNoteEditBtn.addEventListener("click", () => {
  if(locNoteEditing){ const ta = locNoteBody.querySelector("textarea"); if(ta) ta.focus(); return; }
  locNoteDraftBlocks = normBlocks(locNoteBlocks.map(b => Object.assign({}, b)));
  locNoteCaret = null;
  locNotePendingFocus = { block: locNoteDraftBlocks[0] };
  locNoteErr = "";
  locNoteEditing = true;
  renderLocNote();
});
// Dán ảnh (Ctrl+V / ảnh chụp màn hình / copy từ Zalo) hoặc kéo thả vào bảng khi đang sửa.
locNotePanel.addEventListener("paste", e => {
  if(!locNoteEditing || !e.clipboardData) return;
  const imgs = Array.from(e.clipboardData.files || []).filter(f => /^image\//.test(f.type));
  if(!imgs.length) return;   // dán chữ bình thường thì để nguyên
  e.preventDefault();
  const t = e.target;
  addNoteFiles(imgs, (t && t.tagName === "TEXTAREA" && t.__b) ? { block: t.__b, pos: t.selectionStart, end: t.selectionEnd } : locNoteCaret);
});
locNotePanel.addEventListener("dragover", e => { if(locNoteEditing) e.preventDefault(); });
locNotePanel.addEventListener("drop", e => {
  if(!locNoteEditing || !e.dataTransfer) return;
  const imgs = Array.from(e.dataTransfer.files || []).filter(f => /^image\//.test(f.type));
  if(!imgs.length) return;
  e.preventDefault();
  const t = e.target;
  addNoteFiles(imgs, (t && t.tagName === "TEXTAREA" && t.__b) ? { block: t.__b, pos: t.selectionStart } : locNoteCaret);
});
locNotePanel.addEventListener("click", () => {
  if(locNotePanel.classList.contains("mini")){ locNoteMini = false; renderLocNote(); }
});
locNotePanel.addEventListener("keydown", e => {
  if(locNotePanel.classList.contains("mini") && (e.key === "Enter" || e.key === " ") && e.target === locNotePanel){
    e.preventDefault(); locNoteMini = false; renderLocNote();
  }
});
locNoteMinBtn.addEventListener("click", e => {
  e.stopPropagation();
  if(!hasLocNote() && !locNoteEditing){ locNoteMini = true; renderLocNote(); }
});
locNoteFab.addEventListener("click", () => setLocNoteOpen(!locNotePanel.classList.contains("show")));
locNoteBackdrop.addEventListener("click", () => setLocNoteOpen(false));
document.getElementById("locNoteCloseBtn").addEventListener("click", () => setLocNoteOpen(false));
document.addEventListener("keydown", e => { if(e.key === "Escape" && !desktopNoteMQ.matches) setLocNoteOpen(false); });
desktopNoteMQ.addEventListener("change", () => setLocNoteOpen(locNotePanel.classList.contains("show")));
onSnapshot(locNoteRef, snap => {
  const d = snap.exists() ? snap.data() : {};
  locNoteText = d.text || "";
  locNoteBlocks = blocksFromDoc(d);
  locNoteSyncErr = "";
  if(!locNoteEditing) renderLocNote();   // đang gõ dở thì không ghi đè bản nháp
  else locNoteFab.classList.toggle("has-note", hasLocNote());
}, err => {
  locNoteSyncErr = "Lỗi đồng bộ ghi chú: " + err.message;
  if(!locNoteEditing) renderLocNote();
});
renderLocNote();

// =====================================================================
// (2) ĐƯỜNG KẺ NGANG PHÂN CÁCH CÁC NHÓM ĐƠN (tab Chờ xử lý) — đồng bộ: meta/dividers
// Dùng như "chèn đường kẻ ngang" của Google Docs: tích chọn đơn → bấm nút "—" → đường kẻ
// xuất hiện ngay TRÊN đơn đó (bấm lại lần nữa để gỡ). Chèn được nhiều đường → nhiều nhóm.
// Mỗi đường lưu bằng "khóa thứ tự" của đơn nằm ngay dưới nó (không lưu theo vị trí số),
// nên đơn mới thêm tự lên trên cùng, còn đơn cũ bàn giao/xóa đi thì đường kẻ vẫn đứng đúng chỗ.
// =====================================================================
const dividersRef = doc(db, "meta", "dividers");
onSnapshot(dividersRef, snap => {
  const d = snap.exists() ? snap.data() : {};
  Object.keys(DIV_FIELD).forEach(tab => {
    const arr = d[DIV_FIELD[tab]];
    dividersByTab[tab] = Array.isArray(arr) ? arr.filter(k => typeof k === "number").sort((x, y) => y - x) : [];
  });
  dividersSettled = !snap.metadata.fromCache && !snap.metadata.hasPendingWrites;
  render();
  schedulePruneDividers();
}, err => { connStatus.textContent = "Lỗi đồng bộ đường kẻ: " + err.message; });

// Khóa thứ tự của từng đơn đang nằm ở 1 tab — tính trên TOÀN BỘ đơn của tab theo trạng thái,
// KHÔNG phụ thuộc tìm kiếm / lọc hãng (các bộ lọc đó chỉ đổi cách hiển thị).
function tabOrderKeyMap(tab){
  const by = new Map();
  allTasks.forEach(t => {
    if(t.status !== TAB_STATUS[tab]) return;
    const k = orderKey(t);
    if(!by.has(k)) by.set(k, []);
    by.get(k).push(t);
  });
  const m = new Map();
  by.forEach((items, k) => m.set(k, orderSortKeyOf(items)));
  return m;
}

// Đường kẻ chỉ hiện khi KHÔNG tìm kiếm và KHÔNG lọc hãng (dữ liệu kẻ không bị ảnh hưởng).
function dividersHidden(){ return !!searchTerm || (hasCarrierView() && carrierFilter !== "all"); }

// Ghi từng thay đổi nhỏ (arrayUnion / arrayRemove) thay vì ghi đè cả danh sách → nhiều máy
// cùng sửa / cùng tự dọn không đè mất thay đổi của nhau. Firestore hiện kết quả ngay trên máy
// đang bấm và tự hoàn tác nếu ghi lỗi.
async function writeDividers(tab, addKeys, removeKeys){
  const op = addKeys.length ? arrayUnion(...addKeys) : arrayRemove(...removeKeys);
  try{ await setDoc(dividersRef, { [DIV_FIELD[tab]]: op, updatedAt: serverTimestamp() }, { merge: true }); }
  catch(e){ showError("Không lưu được đường kẻ: " + e.message); }
}

// Tự xóa: kẻ của 1 tab bị gỡ khi tab đó không còn đơn nào nằm dưới nó (các đơn đã sang tab khác).
let pruneTimer = null;
function schedulePruneDividers(){ clearTimeout(pruneTimer); pruneTimer = setTimeout(pruneDividers, 1200); }
async function pruneDividers(){
  if(!tasksSettled || !dividersSettled) return;
  const patch = {};
  Object.keys(DIV_FIELD).forEach(tab => {
    const keys = dividersByTab[tab];
    if(!keys.length) return;
    const valid = Array.from(tabOrderKeyMap(tab).values());
    const minKey = valid.length ? Math.min(...valid) : Infinity;
    const stale = keys.filter(k => k < minKey);          // không còn đơn nào có khóa <= k
    if(stale.length) patch[DIV_FIELD[tab]] = arrayRemove(...stale);
  });
  if(Object.keys(patch).length === 0) return;
  try{ await setDoc(dividersRef, patch, { merge: true }); }catch(e){ /* sẽ thử lại ở lần đồng bộ sau */ }
}

document.getElementById("divBtn").addEventListener("click", () => {
  if(dividersHidden()){ showNotice("Bỏ tìm kiếm / lọc hãng để chèn hoặc gỡ đường kẻ."); return; }
  const tab = currentTab;
  const map = tabOrderKeyMap(tab);
  const keys = Array.from(new Set(Array.from(selected).filter(id => map.has(id)).map(id => map.get(id))));
  if(keys.length === 0){ showNotice("Tích chọn đơn muốn chèn đường kẻ phía trên."); return; }
  const have = new Set(dividersByTab[tab]);
  const missing = keys.filter(k => !have.has(k));
  selected.clear();   // tránh lỡ tay bấm "Đã in xong" lên các đơn vừa chọn
  render();
  if(missing.length) writeDividers(tab, missing, []);   // còn đơn chưa có kẻ → chèn cho tất cả
  else writeDividers(tab, [], keys);                    // tất cả đã có kẻ → gỡ
});

function appendGroupsWithDivider(groups){
  const ds = dividersByTab[currentTab].slice().sort((x, y) => y - x);
  if(ds.length === 0 || dividersHidden()){
    groups.forEach(g => list.appendChild(renderOrderBox(g)));
    return;
  }
  // groups đã sắp theo khóa giảm dần. Đường kẻ K nằm ngay trước đơn đầu tiên có khóa <= K.
  let di = 0;
  groups.forEach(g => {
    const here = [];
    while(di < ds.length && g.sortKey <= ds[di]){ here.push(ds[di]); di++; }
    if(here.length) list.appendChild(renderDividerEl(here));
    list.appendChild(renderOrderBox(g));
  });
}
function renderDividerEl(keys){
  const el = document.createElement("div");
  el.className = "order-divider";
  const line = document.createElement("div"); line.className = "od-line";
  const x = document.createElement("button");
  x.type = "button"; x.className = "od-x"; x.textContent = "✕"; x.title = "Gỡ đường kẻ này";
  x.addEventListener("click", () => writeDividers(currentTab, [], keys));
  el.appendChild(line); el.appendChild(x);
  return el;
}

// =====================================================================
// (3) CHỐNG BỎ SÓT KHI LỌC THEO HÃNG Ở TAB "CHỜ XỬ LÝ"
//  - Banner vàng luôn hiện khi đang lọc: ghi rõ đang ẩn bao nhiêu đơn + nút "Hiện tất cả".
//  - Tự về "Tất cả" sau CARRIER_IDLE_MS KHÔNG THAO TÁC (chạm/cuộn/gõ phím đều tính là thao tác
//    và làm đồng hồ chạy lại từ đầu → đang xem dở thì không bị reset giữa chừng).
//  - Tắt màn hình / chuyển app rồi quay lại sau > CARRIER_HIDDEN_MS cũng tự về "Tất cả".
//  - Bộ lọc chỉ nằm trên máy đang dùng (không đồng bộ), đổi tab / tải lại trang là về "Tất cả".
// =====================================================================
function carrierGuardActive(){ return currentTab === "in" && carrierFilter !== "all"; }
function autoResetCarrierFilter(why){
  if(!carrierGuardActive()) return;
  carrierFilter = "all";
  render();
  showNotice(why);
}
function armCarrierGuard(restart){
  if(!carrierGuardActive()){ clearTimeout(carrierIdleTimer); carrierIdleTimer = null; return; }
  if(carrierIdleTimer && !restart) return;
  clearTimeout(carrierIdleTimer);
  carrierIdleTimer = setTimeout(() => {
    carrierIdleTimer = null;
    autoResetCarrierFilter(`Đã tự quay về "Tất cả" vì ${CARRIER_IDLE_MS / 60000} phút không thao tác — để không bỏ sót đơn của hãng khác.`);
  }, CARRIER_IDLE_MS);
}
["pointerdown", "keydown", "scroll", "touchstart", "wheel"].forEach(ev =>
  window.addEventListener(ev, () => { if(carrierIdleTimer) armCarrierGuard(true); }, { passive: true, capture: true }));
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(hiddenAt && Date.now() - hiddenAt > CARRIER_HIDDEN_MS){
    autoResetCarrierFilter('Đã quay về "Tất cả" vì bạn vừa rời khỏi ứng dụng một lúc — để không bỏ sót đơn của hãng khác.');
  }
  hiddenAt = 0;
});
function updateCarrierWarn(baseShown, shown){
  const wrap = document.getElementById("carrierWarnWrap");
  const el = document.getElementById("carrierWarn");
  if(carrierFilter === "all" || !hasCarrierView()){ wrap.style.display = "none"; el.innerHTML = ""; return; }
  wrap.style.display = "block";
  const hidden = countOrders(baseShown) - countOrders(shown);
  el.innerHTML = "";
  const txt = document.createElement("span");
  txt.className = "cw-text";
  txt.textContent = `⚠️ Đang chỉ hiện ${carrierLabelOf(carrierFilter)} — đang ẩn ${hidden} đơn của hãng khác.` +
    (currentTab === "in" ? ` Tự về "Tất cả" sau ${CARRIER_IDLE_MS / 60000} phút không thao tác.` : "");
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = "Hiện tất cả";
  btn.addEventListener("click", () => { carrierFilter = "all"; render(); });
  el.appendChild(txt); el.appendChild(btn);
}

// ---- Batch actions ----
function updateBatchBar(){
  const n = selected.size;
  if(!labelBusy) batchCountEl.textContent = compactBar.matches ? String(n) : n + " đã chọn"; // đang tải/gộp thì ô này đang hiện tiến độ
  const doneBtn = document.getElementById("batchDone");
  // Tab "Đã bàn giao" là bước cuối nên không có thao tác chuyển tiếp hàng loạt.
  if(currentTab === "xong"){
    doneBtn.style.display = "none";
  } else {
    doneBtn.style.display = "inline-flex";
    doneBtn.textContent = currentTab === "in" ? "Đã in xong" : "Đã bàn giao";
  }
  // 2 nút PDF: chỉ ở 2 tab đang xử lý (giống 2 nút đầu danh sách), mờ đi khi
  // các đơn đã chọn chưa có phiếu giao nào.
  const pdfGroup = document.getElementById("batchPdfGroup");
  pdfGroup.style.display = currentTab === "xong" ? "none" : "flex";
  if(currentTab !== "xong" && n > 0){
    const { groups } = getSelectedLabelGroups();
    const has = groups.length > 0;
    if(!labelBusy){ batchDownloadPdfBtn.disabled = !has; batchMergePdfBtn.disabled = !has; }
    batchDownloadPdfBtn.title = has ? `Tải ${groups.length} phiếu giao đã chọn` : "Các đơn đã chọn chưa có phiếu giao";
    batchMergePdfBtn.title = has ? `Gộp ${groups.length} phiếu giao đã chọn thành 1 file` : "Các đơn đã chọn chưa có phiếu giao";
  }
  // Nút đường kẻ: hiện ở cả 3 tab; mờ khi đang tìm kiếm / lọc hãng; sáng lên nếu mọi đơn đã chọn đều đã có kẻ (bấm = gỡ).
  const divBtn = document.getElementById("divBtn");
  if(n > 0){
    const hidden = dividersHidden();
    divBtn.disabled = hidden;
    let allHave = false;
    if(!hidden){
      const map = tabOrderKeyMap(currentTab), have = new Set(dividersByTab[currentTab]);
      const ks = Array.from(selected).filter(id => map.has(id)).map(id => map.get(id));
      allHave = ks.length > 0 && ks.every(k => have.has(k));
    }
    divBtn.classList.toggle("on", allHave);
    divBtn.title = hidden ? "Bỏ tìm kiếm / lọc hãng để chèn hoặc gỡ đường kẻ"
      : allHave ? "Gỡ đường kẻ phía trên các đơn đã chọn" : "Chèn đường kẻ phía trên các đơn đã chọn";
  }
  batchbar.classList.toggle("show", n > 0 && !sortMode);
}
compactBar.addEventListener("change", () => updateBatchBar());

document.getElementById("batchDone").addEventListener("click", async () => {
  const tasks = getSelectedTasks();
  try{
    for(const t of tasks) await advanceStatus(t);
  }catch(e){ showError("Lỗi khi xử lý theo lô: " + e.message); }
  selected.clear();
  updateBatchBar();
});

document.getElementById("batchDel").addEventListener("click", async () => {
  if(!confirm("Xóa " + selected.size + " đơn đã chọn?")) return;
  const ids = getSelectedTasks().map(t => t.id);
  try{
    for(const id of ids){
      await deleteDoc(doc(db, "tasks", id));
    }
  }catch(e){ showError("Không xóa được các mục đã chọn: " + e.message); }
  selected.clear();
  updateBatchBar();
});
</script>
