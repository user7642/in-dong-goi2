// Carrier hiệu lực của 1 task — "unknown" cho mọi giá trị lạ/rỗng, để luôn
// khớp với 1 trong các key của CARRIER_LABEL (tránh sinh nhóm rác nếu dữ
// liệu cũ/lỗi có carrier không nằm trong danh sách đã biết).
function effectiveCarrier(t){
  return carrierKeyOf(t);
}

// Áp dụng lọc theo hãng (carrierFilter) — chỉ có tác dụng ở tab "Chờ bàn giao"
// và "Đã bàn giao".
function applyCarrierFilter(tasks){
  if(!hasCarrierView() || carrierFilter === "all") return tasks;
  return tasks.filter(t => effectiveCarrier(t) === carrierFilter);
}

// Vẽ chip lọc theo hãng (tab "Chờ bàn giao" + "Đã bàn giao").
// baseShown = tasks theo tab+tìm kiếm, TRƯỚC khi lọc theo hãng, để đếm số
// lượng đúng cho từng chip.
function renderCarrierBar(baseShown){
  // Đếm theo KIỆN HÀNG (số đơn/orderId khác nhau), không đếm số sản phẩm —
  // đơn gộp nhiều sản phẩm chỉ tính 1.
  const counts = new Map();
  baseShown.forEach(t => {
    const key = effectiveCarrier(t);
    if(!counts.has(key)) counts.set(key, new Set());
    counts.get(key).add(t.orderId || t.id);
  });

  const chipsEl = document.getElementById("carrierChips");
  chipsEl.innerHTML = "";

  const allChip = document.createElement("button");
  allChip.type = "button";
  allChip.className = "carrierChip" + (carrierFilter === "all" ? " active" : "");
  allChip.innerHTML = `Tất cả <span class="n">${countOrders(baseShown)}</span>`;
  allChip.addEventListener("click", () => { carrierFilter = "all"; render(); });
  chipsEl.appendChild(allChip);

  sortCarrierKeys(Array.from(counts.keys())).forEach(key => {
    const n = counts.has(key) ? counts.get(key).size : 0;
    if(n === 0) return; // ẩn hãng hiện không có đơn nào để đỡ rối chip
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "carrierChip" + (carrierFilter === key ? " active" : "");
    chip.textContent = (CARRIER_SHORT[key] || carrierLabelOf(key)) + " ";
    { const nSpan = document.createElement("span"); nSpan.className = "n"; nSpan.textContent = n; chip.appendChild(nSpan); }
    chip.addEventListener("click", () => { carrierFilter = (carrierFilter === key ? "all" : key); render(); });
    chipsEl.appendChild(chip);
  });
}

function updateSelectAllBox(shown){
  const ids = new Set(shown.map(orderKey));
  const n = ids.size;
  let nSel = 0;
  ids.forEach(id => { if(selected.has(id)) nSel++; });
  selectAllBox.checked = n > 0 && nSel === n;
  selectAllBox.indeterminate = nSel > 0 && nSel < n;
}

// Số kiện hàng (đơn/orderId khác nhau) trong 1 danh sách task bất kỳ.
function countOrders(tasks){
  return new Set(tasks.map(t => t.orderId || t.id)).size;
}

// Số kiện hàng đang ở 1 trạng thái — dùng cho badge số trên tab. Không phụ
// thuộc từ khóa tìm kiếm/lọc hãng: badge luôn phản ánh TOÀN BỘ dữ liệu.
function countOrdersByStatus(status){
  const ids = new Set();
  allTasks.forEach(t => { if(t.status === status) ids.add(t.orderId || t.id); });
  return ids.size;
}

// Cảnh báo TRÙNG MÃ ĐƠN HÀNG (orderName) — dấu hiệu điển hình của việc tải nhầm
// cùng 1 phiếu giao cho 2 đơn khác nhau. Chỉ so sánh trong tập đơn ĐANG XỬ LÝ
// (tab Chờ xử lý + tab Chờ bàn giao gộp chung, nên bắt được cả trường hợp 1
// đơn ở tab 1 trùng với 1 đơn ở tab 2). KHÔNG so với tab "Đã bàn giao": tab đó dữ liệu
// lớn, đã xử lý xong, và mã cũ có thể tái xuất hợp lệ (giao lại...) → dễ báo
// động giả. Tính hoàn toàn trên allTasks có sẵn trong bộ nhớ (1 lượt duyệt,
// không gọi mạng) nên rất nhanh. So sánh không phân biệt hoa/thường, bỏ qua
// đơn chưa có mã (tên trống).
function findDuplicateOrderCodes(){
  const byKey = new Map(); // KEY -> { label, orderIds:Set }
  allTasks.forEach(t => {
    if(t.status !== "cho_in" && t.status !== "cho_dong_goi") return;
    const name = (t.orderName || "").trim();
    if(!name || isBlankOrderName(name)) return;
    const key = name.toUpperCase();
    if(!byKey.has(key)) byKey.set(key, { label: name, orderIds: new Set() });
    byKey.get(key).orderIds.add(t.orderId || t.id);
  });
  const dups = [];
  byKey.forEach(v => { if(v.orderIds.size >= 2) dups.push(v.label); });
  return dups;
}

// Có đơn ĐANG XỬ LÝ khác (khác orderId, trạng thái Chờ xử lý/Chờ bàn giao) đang mang cùng
// mã đơn hàng này không? (không phân biệt hoa/thường, bỏ qua mã trống)
function isOrderNameUsedByOtherActiveOrder(orderId, name){
  const key = (name || "").trim().toUpperCase();
  if(!key) return false;
  return allTasks.some(t =>
    (t.status === "cho_in" || t.status === "cho_dong_goi") &&
    (t.orderId || t.id) !== orderId &&
    (t.orderName || "").trim().toUpperCase() === key);
}

function updateDupWarning(){
  const el = document.getElementById("dupWarn");
  const dups = (currentTab === "in" || currentTab === "dong_goi") ? findDuplicateOrderCodes() : [];
  if(dups.length === 0){ el.style.display = "none"; el.textContent = ""; return; }
  const MAX = 3;
  const shownCodes = dups.slice(0, MAX).join(", ");
  const more = dups.length > MAX ? ` và ${dups.length - MAX} mã khác` : "";
  el.textContent = `⚠️ Trùng mã đơn hàng: ${shownCodes}${more} — kiểm tra lại phiếu giao`;
  el.style.display = "block";
}

function render(){
  const baseShown = getShown(); // theo tab + tìm kiếm, CHƯA lọc theo hãng

  // Bộ lọc hãng đang chọn mà không còn đơn nào thuộc hãng đó (vừa bàn giao/xóa
  // hết) → tự về "Tất cả", tránh kẹt ở danh sách rỗng với chip hãng đã biến mất.
  if(carrierFilter !== "all" && !baseShown.some(t => effectiveCarrier(t) === carrierFilter)){
    carrierFilter = "all";
  }
  const shown = applyCarrierFilter(baseShown);

  // Chỉ giữ trong danh sách chọn những đơn ĐANG HIỂN THỊ (đúng tab + tìm kiếm +
  // lọc hãng). Đơn vừa chuyển trạng thái/bị xóa, hoặc bị ẩn do đổi bộ lọc/tìm
  // kiếm, bị bỏ chọn — tránh việc "Đã bàn giao"/"Xóa" hàng loạt tác động lên
  // những đơn không nhìn thấy và để số "đã chọn" luôn đúng.
  {
    const visible = new Set(shown.map(orderKey));
    selected.forEach(id => { if(!visible.has(id)) selected.delete(id); });
  }
  updateDupWarning();
  updateLabelButtons();
  updateBatchBar();
  armCarrierGuard(false);
  const badgeIn = countOrdersByStatus("cho_in");
  const badgeDG = countOrdersByStatus("cho_dong_goi");
  const badgeXong = countOrdersByStatus("xong");
  document.getElementById("badge-in").textContent = badgeIn;
  document.getElementById("badge-dong_goi").textContent = badgeDG;
  document.getElementById("badge-xong").textContent = badgeXong;

  updateSelectAllBox(shown);

  // Tổng số lượng (cộng dồn field qty của từng sản phẩm) của danh sách ĐANG
  // HIỂN THỊ — theo đúng tab + tìm kiếm + lọc hãng hiện tại, nằm cùng hàng với
  // "Chọn tất cả" (căn phải) — đây là con số "số lượng" cũ từng nằm cạnh tên
  // tab, giờ chuyển xuống đây; số cạnh tên tab đổi thành số kiện hàng.
  // Tính theo KIỆN HÀNG (số đơn), không cộng số lượng sản phẩm.
  totalQtyInfo.innerHTML = `Số lượng: <b>${countOrders(shown)}</b>`;
  // Ẩn hẳn hàng "Chọn tất cả" + "Số lượng" khi danh sách đang hiển thị rỗng —
  // đỡ rối vì lúc đó chọn/số lượng đều vô nghĩa (0).
  listToolbar.style.display = shown.length === 0 ? "none" : "grid";

  list.innerHTML = "";
  document.body.classList.toggle("sorting", sortMode);
  sortModeBtn.textContent = sortMode ? "✅ Xong" : "🔀 Sắp xếp";
  sortModeBtn.classList.toggle("active", sortMode);

  const carrierBar = document.getElementById("carrierBar");
  if(hasCarrierView() && baseShown.length > 0){
    carrierBar.style.display = "flex";
    renderCarrierBar(baseShown);
    updateCarrierWarn(baseShown, shown);
  } else {
    carrierBar.style.display = "none";
    updateCarrierWarn(baseShown, shown);
  }

  if(shown.length === 0){
    const emptyMsg = searchTerm ? "Không tìm thấy việc nào khớp."
      : currentTab === "in" ? "Chưa có việc nào. Thêm sản phẩm ở ô trên."
      : carrierFilter !== "all" ? "Không có đơn nào thuộc hãng này."
      : currentTab === "dong_goi" ? "Chưa có đơn nào chờ bàn giao."
      : "Chưa có đơn nào đã bàn giao.";
    list.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  const groups = groupShown(shown);
  // Thứ tự đơn: theo "khóa thứ tự" (mặc định = giờ tạo đơn → đơn MỚI THÊM trên
  // cùng; sau khi sắp xếp thủ công = field sortOrder) — áp dụng cho cả 3 tab.
  // Thứ tự sản phẩm trong 1 đơn không đổi.
  groups.forEach(g => { g.sortKey = orderSortKeyOf(g.items); });
  groups.sort((a, b) => b.sortKey - a.sortKey);   // khóa lớn → trên cùng
  currentGroups = groups;
  appendGroupsWithDivider(groups);
}

// Thẻ tóm tắt 1 đơn hàng trong danh sách — kiểu Shopee, giờ là TẦNG DUY NHẤT
// (không còn trang "Chi tiết đơn hàng" toàn màn hình). Bấm vào header (giờ
// tạo + trạng thái) để mở/đóng khu vực mở rộng chứa phiếu giao + ghi chú.
function renderOrderBox(g){
  const box = document.createElement("div");
  box.className = "order-box";

  const isExpanded = expandedOrderIds.has(g.orderId);

  // Dòng đầu: thời gian tạo đơn (thay cho tên người mua — không có dữ liệu
  // thật) + trạng thái màu + chấm báo hiệu (📎 phiếu giao, 📝 ghi chú) + mũi
  // tên ▾/▸. Bấm vào bất kỳ đâu trên header sẽ mở/đóng khu vực mở rộng.
  const header = document.createElement("div");
  header.className = "order-summary-header";
  header.addEventListener("click", () => {
    if(sortMode) return;   // đang sắp xếp: không mở/đóng khu vực mở rộng
    if(isExpanded) expandedOrderIds.delete(g.orderId); else expandedOrderIds.add(g.orderId);
    render();
  });
  const timeSpan = document.createElement("span");
  timeSpan.className = "order-time";
  timeSpan.textContent = formatDT(g.items[0] && g.items[0].createdAt);

  const rightWrap = document.createElement("span");
  rightWrap.className = "order-header-right";
  const statusSpan = document.createElement("span");
  statusSpan.className = "order-status-badge " + STATUS_COLOR_CLASS[currentTab];
  statusSpan.textContent = STATUS_LABEL[currentTab];
  rightWrap.appendChild(statusSpan);
  if(g.shipLabelUrl){
    const dot = document.createElement("span");
    dot.className = "header-dot";
    dot.title = "Đã đính kèm phiếu giao";
    dot.textContent = "📎";
    rightWrap.appendChild(dot);
  }
  // Chip hãng vận chuyển ở header đã được thay bằng dòng "Đơn vị VC:" riêng
  // (đặt ngay trước dòng "Mã đơn hàng", có thể bấm ✏️ để sửa tay) — xem bên dưới.
  if(g.note){
    const dot = document.createElement("span");
    dot.className = "header-dot";
    dot.title = "Đơn có ghi chú";
    dot.textContent = "📝";
    rightWrap.appendChild(dot);
  }
  const arrow = document.createElement("span");
  arrow.className = "expand-arrow";
  arrow.textContent = isExpanded ? "▾" : "▸";
  rightWrap.appendChild(arrow);

  // Ô chọn theo KIỆN HÀNG: cột trái của header (lưới 3 cột, xem CSS).
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.className = "order-select-cb";
  cb.checked = selected.has(g.orderId);
  cb.addEventListener("click", e => e.stopPropagation());
  cb.addEventListener("change", () => {
    if(cb.checked) selected.add(g.orderId); else selected.delete(g.orderId);
    updateSelectAllBox(applyCarrierFilter(getShown()));
    updateBatchBar();
  });
  header.appendChild(cb);        // cột 1 (trái)
  header.appendChild(timeSpan);  // cột 2 (giữa)
  header.appendChild(rightWrap); // cột 3 (phải)
  box.appendChild(header);

  // Chế độ sắp xếp: thẻ đơn thu gọn (header + hàng nút + sản phẩm đầu tiên) để
  // đơn dài không che mất các đơn khác khi cần dời chỗ.
  if(sortMode){
    box.classList.add("sorting");
    const idx = currentGroups.findIndex(x => x.orderId === g.orderId);
    const first = idx <= 0, last = idx === currentGroups.length - 1;
    const bar = document.createElement("div");
    bar.className = "order-sort-bar";
    const mk = (icon, title, disabled, fn) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = icon; b.title = title; b.disabled = disabled;
      if(!disabled) b.addEventListener("click", e => { e.stopPropagation(); fn(); });
      bar.appendChild(b);
    };
    mk("⤒", "Lên đầu danh sách", first, () => moveOrderToEdge(g.orderId, true));
    mk("▲", "Lên 1 bậc", first, () => moveOrder(g.orderId, -1));
    mk("▼", "Xuống 1 bậc", last, () => moveOrder(g.orderId, 1));
    mk("⤓", "Xuống cuối danh sách", last, () => moveOrderToEdge(g.orderId, false));
    box.appendChild(bar);
    if(g.items[0]) box.appendChild(renderItemSummary(g.items[0]));
    if(g.items.length > 1){
      const more = document.createElement("div");
      more.className = "order-sort-more";
      more.textContent = `… và ${g.items.length - 1} sản phẩm khác (tổng ${g.items.length} sản phẩm)`;
      box.appendChild(more);
    }
    return box;
  }

  // Xem trước ghi chú chung của đơn — luôn hiện nếu có, không cần mở rộng.
  if(g.note){
    const notePrev = document.createElement("div");
    notePrev.className = "order-note-preview";
    notePrev.textContent = "📝 " + g.note;
    box.appendChild(notePrev);
  }

  if(isExpanded){
    box.appendChild(renderOrderExpandPanel(g));
  }

  const hasMore = g.items.length > ITEMS_PREVIEW_LIMIT;
  const showAll = !hasMore || showAllItemsIds.has(g.orderId);
  (showAll ? g.items : g.items.slice(0, ITEMS_PREVIEW_LIMIT))
    .forEach(t => box.appendChild(renderItemSummary(t)));

  if(hasMore){
    const toggle = document.createElement("div");
    toggle.className = "items-toggle";
    toggle.setAttribute("role", "button");
    toggle.innerHTML = showAll
      ? `<span class="tg-action">Thu gọn</span><span class="tg-chev">▲</span>`
      : `<span class="tg-count">Tổng cộng ${g.items.length} sản phẩm ·</span><span class="tg-action">Nhấn xem đầy đủ</span><span class="tg-chev">▼</span>`;
    toggle.addEventListener("click", e => {
      e.stopPropagation();
      if(showAll) showAllItemsIds.delete(g.orderId); else showAllItemsIds.add(g.orderId);
      render();
    });
    box.appendChild(toggle);
  }

  const totalQty = g.items.reduce((s, t) => s + (t.qty || 1), 0);
  const footer = document.createElement("div");
  footer.className = "order-summary-footer";
  footer.innerHTML = `<span>${g.items.length} sản phẩm</span><span>Tổng số lượng: <b>${totalQty}</b></span>`;
  box.appendChild(footer);

  // Đơn vị VC (hãng vận chuyển) — đặt ngay trước dòng "Mã đơn hàng", cùng
  // kiểu dòng (label bên trái, giá trị + nút bút chì bên phải) để sửa tay khi
  // tự nhận diện sai hãng. <select> cho các hãng đã biết + tùy chọn "Khác
  // (tự nhập)" để gõ tên hãng bất kỳ.
  const carrierRow = document.createElement("div");
  carrierRow.className = "order-code-row";
  if(editingCarrierIds.has(g.orderId)){
    const curKey = carrierKeyOf(g);
    const select = document.createElement("select");
    select.className = "order-carrier-select";
    Object.keys(CARRIER_LABEL).forEach(key => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = CARRIER_LABEL[key];
      if(curKey === key) opt.selected = true;
      select.appendChild(opt);
    });
    // Tùy chọn tự nhập: chọn xong hiện ô gõ chữ — dùng khi nhận diện sai /
    // "Chưa rõ hãng" / hãng mới chưa có trong danh sách và chưa kịp sửa code.
    const customOpt = document.createElement("option");
    customOpt.value = CARRIER_CUSTOM;
    customOpt.textContent = "✏️ Khác (tự nhập)…";
    if(curKey.startsWith(CARRIER_CUSTOM + ":")) customOpt.selected = true;
    select.appendChild(customOpt);

    const customInput = document.createElement("input");
    customInput.type = "text";
    customInput.className = "order-title-input";
    customInput.placeholder = "Gõ tên hãng bất kỳ…";
    customInput.maxLength = 60;
    customInput.value = curKey.startsWith(CARRIER_CUSTOM + ":") ? carrierLabelOf(curKey) : "";
    const syncCustomVisible = () => { customInput.style.display = select.value === CARRIER_CUSTOM ? "" : "none"; };
    syncCustomVisible();

    const saveBtn = document.createElement("button");
    saveBtn.className = "save-icon";
    saveBtn.textContent = "Lưu";
    const commit = attachClickAwayCommit(carrierRow, () => {
      editingCarrierIds.delete(g.orderId);
      if(select.value === CARRIER_CUSTOM){
        const name = customInput.value.trim();
        // Để trống = coi như chưa rõ hãng (không lưu chuỗi rỗng).
        if(name) setOrderCarrier(g.orderId, CARRIER_CUSTOM, name);
        else setOrderCarrier(g.orderId, "unknown");
      } else {
        setOrderCarrier(g.orderId, select.value);
      }
    });
    saveBtn.addEventListener("click", commit);
    select.addEventListener("change", () => {
      syncCustomVisible();
      if(select.value === CARRIER_CUSTOM){ customInput.focus(); return; } // chờ người dùng gõ rồi bấm Lưu
      commit();
    });
    customInput.addEventListener("keydown", e => { if(e.key === "Enter") commit(); });
    carrierRow.appendChild(select);
    carrierRow.appendChild(customInput);
    carrierRow.appendChild(saveBtn);
    setTimeout(() => (select.value === CARRIER_CUSTOM ? customInput : select).focus(), 0);
  } else {
    const carrierLabelSpan = document.createElement("span");
    carrierLabelSpan.className = "code-label";
    carrierLabelSpan.textContent = "Đơn vị VC";
    const carrierValueWrap = document.createElement("span");
    carrierValueWrap.className = "code-value";
    const carrierValueText = document.createElement("span");
    carrierValueText.textContent = carrierLabelOf(carrierKeyOf(g));
    const carrierEditBtn = document.createElement("button");
    carrierEditBtn.className = "edit-icon-btn";
    carrierEditBtn.textContent = "✏️";
    carrierEditBtn.title = "Đổi hãng vận chuyển";
    carrierEditBtn.addEventListener("click", () => { editingCarrierIds.add(g.orderId); render(); });
    carrierValueWrap.appendChild(carrierValueText);
    carrierValueWrap.appendChild(carrierEditBtn);
    carrierRow.appendChild(carrierLabelSpan);
    carrierRow.appendChild(carrierValueWrap);
  }
  box.appendChild(carrierRow);

  // Mã đơn hàng — không còn nút "Sao chép"; mã dịch sang phải lấp chỗ trống,
  // vẫn giữ nút bút chì nhỏ để đổi tên đơn khi cần.
  const codeRow = document.createElement("div");
  codeRow.className = "order-code-row";
  if(editingOrderIds.has(g.orderId)){
    const input = document.createElement("input");
    input.type = "text";
    input.className = "order-title-input";
    input.value = g.orderName || "";
    const saveBtn = document.createElement("button");
    saveBtn.className = "save-icon";
    saveBtn.textContent = "Lưu";
    const commit = attachClickAwayCommit(codeRow, () => renameOrder(g.orderId, input.value));
    saveBtn.addEventListener("click", commit);
    input.addEventListener("keydown", e => { if(e.key === "Enter") commit(); });
    codeRow.appendChild(input);
    codeRow.appendChild(saveBtn);
    setTimeout(() => input.focus(), 0);
  } else {
    const labelSpan = document.createElement("span");
    labelSpan.className = "code-label";
    labelSpan.textContent = "Mã đơn hàng";
    // Nút ⬇ tải phiếu giao ngay sau chữ "Mã đơn hàng" — có ở MỌI tab (In /
    // Chờ bàn giao / Đã bàn giao) để người dùng không phải tìm trong header. Chỉ
    // hiện khi đơn ĐÃ có phiếu giao đính kèm.
    const labelWrap = document.createElement("span");
    labelWrap.className = "code-label-wrap";
    labelWrap.appendChild(labelSpan);
    if(g.shipLabelUrl){
      const dlBtn = document.createElement("button");
      dlBtn.type = "button";
      dlBtn.className = "code-dl-btn";
      dlBtn.title = "Tải phiếu giao";
      dlBtn.setAttribute("aria-label", "Tải phiếu giao");
      dlBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>';
      dlBtn.addEventListener("click", () => downloadShipLabel(g.shipLabelUrl, g.orderName));
      labelWrap.appendChild(dlBtn);
    }
    const valueWrap = document.createElement("span");
    valueWrap.className = "code-value";
    const valueText = document.createElement("span");
    valueText.innerHTML = renderOrderName(g.orderName);
    const editBtn = document.createElement("button");
    editBtn.className = "edit-icon-btn";
    editBtn.textContent = "✏️";
    editBtn.title = "Đổi tên đơn";
    editBtn.addEventListener("click", () => { editingOrderIds.add(g.orderId); render(); });
    valueWrap.appendChild(valueText);
    valueWrap.appendChild(editBtn);
    codeRow.appendChild(labelWrap);
    codeRow.appendChild(valueWrap);
  }
  box.appendChild(codeRow);

  const actionsRow = document.createElement("div");
  actionsRow.className = "order-summary-actions";

  if(currentTab === "in"){
    const shipBtn = document.createElement("button");
    shipBtn.className = "ship-quick-btn" + (g.shipLabelUrl ? "" : " no-label");
    shipBtn.textContent = g.shipLabelUrl ? "📦 In phiếu giao" : "⚠️ Chưa có phiếu giao";
    shipBtn.title = g.shipLabelUrl ? "Tải phiếu giao để in" : "Chưa có phiếu giao — chờ quản lý tải lên";
    shipBtn.addEventListener("click", () => {
      if(g.shipLabelUrl) downloadShipLabel(g.shipLabelUrl, g.orderName);
      else { expandedOrderIds.add(g.orderId); render(); }
    });
    actionsRow.appendChild(shipBtn);

    const btn = document.createElement("button");
    btn.className = "order-primary-btn";
    btn.textContent = "✅ Đã in xong";
    btn.addEventListener("click", () => advanceOrderItems(g.items));
    actionsRow.appendChild(btn);
  } else if(currentTab === "dong_goi"){
    const revBtn = document.createElement("button");
    revBtn.className = "ship-quick-btn";
    revBtn.textContent = "↩ Lùi lại";
    revBtn.addEventListener("click", () => revertOrderItems(g.items));
    actionsRow.appendChild(revBtn);

    const btn = document.createElement("button");
    btn.className = "order-primary-btn green";
    btn.textContent = "🚚 Đã bàn giao";
    btn.addEventListener("click", () => handOverWholeOrder(g.orderId));
    actionsRow.appendChild(btn);
  } else if(currentTab === "xong"){
    const revBtn = document.createElement("button");
    revBtn.className = "ship-quick-btn";
    revBtn.textContent = "↩ Lùi lại";
    revBtn.addEventListener("click", () => revertOrderItems(g.items));
    actionsRow.appendChild(revBtn);
  }
  box.appendChild(actionsRow);

  return box;
}

// Tên sản phẩm thường được gõ theo dạng "Tên gốc — Phân loại" (dấu gạch
// ngang dài "—"). Hàm này tách ra 2 phần để hiển thị tiêu đề và phân loại
// trên 2 dòng riêng thay vì dính liền — nếu không có "—" thì coi cả chuỗi
// là tiêu đề, không có phân loại.
function splitProductName(name){
  name = name || "";
  const idx = name.indexOf("—");
  if(idx === -1) return { title: name, classification: "" };
  const title = name.slice(0, idx).trim();
  const classification = name.slice(idx + 1).trim();
  return title ? { title, classification } : { title: classification, classification: "" };
}

// Dòng 1 sản phẩm trong thẻ tóm tắt — chỉ ảnh/tiêu đề/SL + checkbox (dùng
// cho chọn hàng loạt), KHÔNG có nút thao tác (những nút đó chuyển hết vào
// trang chi tiết vì ít khi dùng tới).
function renderItemSummary(t){
  const row = document.createElement("div");
  row.className = "order-item-summary";

  row.appendChild(renderThumb(t));

  const info = document.createElement("div");
  info.className = "info-summary";
  const { title, classification } = splitProductName(t.name);
  const nameDiv = document.createElement("div");
  nameDiv.className = "name-summary";
  nameDiv.title = t.name;
  const nameText = document.createElement("span");
  nameText.className = "name-text";
  nameText.textContent = title;
  nameDiv.appendChild(nameText);
  if(t.link){
    const linkA = document.createElement("a");
    linkA.className = "task-linkchip";
    linkA.href = t.link;
    linkA.target = "_blank";
    linkA.rel = "noopener";
    linkA.title = "Mở file in";
    linkA.setAttribute("aria-label", "Mở file in");
    const icon = document.createElement("span");
    icon.textContent = "🔗";
    const label = document.createElement("span");
    label.className = "chip-label";
    label.textContent = "File in";
    linkA.appendChild(icon);
    linkA.appendChild(label);
    linkA.addEventListener("click", e => e.stopPropagation());
    nameDiv.appendChild(linkA);
  }
  const metaDiv = document.createElement("div");
  metaDiv.className = "meta-row-summary";
  const classDiv = document.createElement("span");
  classDiv.className = "classification-summary";
  classDiv.title = classification;
  classDiv.textContent = classification;
  const qtyDiv = document.createElement("span");
  qtyDiv.className = "qty-summary";
  qtyDiv.textContent = "SL: " + (t.qty || 1);
  metaDiv.appendChild(classDiv);
  metaDiv.appendChild(qtyDiv);
  info.appendChild(nameDiv);
  info.appendChild(metaDiv);
  row.appendChild(info);

  return row;
}

// Nút icon-only dùng chung cho khu vực mở rộng (phiếu giao + ghi chú) — gọn
// gàng, không chữ, chỉ 1 icon + tooltip (title) khi hover/giữ.
function mkIconBtn(icon, cls, title, onClick){
  const b = document.createElement("button");
  b.className = "icon-btn " + cls;
  b.textContent = icon;
  b.title = title;
  b.addEventListener("click", onClick);

// Khu vực mở rộng của 1 đơn hàng — hiện khi bấm vào header. Gồm 1 hàng icon:
// phiếu giao (đính kèm PDF, dùng chung cho cả đơn — khác "🔗 File in" ở từng
// sản phẩm) rồi tới nút 📝 Ghi chú ở CUỐI CÙNG (sau nút Xóa/Tải lên). Bấm 📝
// lần nữa mới mở ô nhập để gõ ghi chú.
function renderOrderExpandPanel(g){
  const wrap = document.createElement("div");
  wrap.className = "order-expand-panel";

  const rowEl = document.createElement("div");
  rowEl.className = "ship-label-row";

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "application/pdf";
  fileInput.style.display = "none";
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if(f) uploadShipLabel(g.orderId, f);
    fileInput.value = "";
  });
  rowEl.appendChild(fileInput);

  if(uploadingShipLabelIds.has(g.orderId)){
    const busyBtn = mkIconBtn("⏳", "attach-btn", "Đang tải lên...", () => {});
    busyBtn.disabled = true;
    rowEl.appendChild(busyBtn);
  } else if(g.shipLabelUrl){
    // target="_blank" qua window.open — chỉ mở tab mới hiển thị PDF (trình
    // duyệt tự render), không tải file về máy như nút tải xuống.
    rowEl.appendChild(mkIconBtn("👁", "view-btn", "Xem phiếu giao", () => window.open(g.shipLabelUrl, "_blank", "noopener")));
    rowEl.appendChild(mkIconBtn("⬇️", "download-btn", "Tải phiếu giao", () => downloadShipLabel(g.shipLabelUrl, g.orderName)));
    // Không còn nút "Thay file" riêng: tải lên lần nữa = thay phiếu hiện tại.
    rowEl.appendChild(mkIconBtn("⬆️", "attach-btn", "Tải lên phiếu mới (thay phiếu hiện tại)", () => fileInput.click()));
    rowEl.appendChild(mkIconBtn("🗑", "remove-btn", "Xóa phiếu giao", () => removeShipLabel(g.orderId)));
  } else {
    rowEl.appendChild(mkIconBtn("⬆️", "attach-btn", "Tải lên phiếu giao", () => fileInput.click()));
  }

  // Nút ghi chú — luôn đặt cuối cùng trong hàng icon.
  const noteBtn = mkIconBtn("📝", "note-btn" + (g.note ? " has-note" : ""), "Ghi chú đơn hàng", () => {
    if(openOrderNoteIds.has(g.orderId)) openOrderNoteIds.delete(g.orderId);
    else openOrderNoteIds.add(g.orderId);
    render();
  });
  rowEl.appendChild(noteBtn);

  wrap.appendChild(rowEl);

  if(openOrderNoteIds.has(g.orderId)){
    const noteBox = document.createElement("div");
    noteBox.className = "note-box";
    const ta = document.createElement("textarea");
    ta.placeholder = "Ghi chú cho đơn hàng này...";
    ta.value = g.note || "";
    const saveNoteBtn = document.createElement("button");
    saveNoteBtn.className = "note-save";
    saveNoteBtn.textContent = "Lưu ghi chú";
    const commit = attachClickAwayCommit(noteBox, async () => {
      await saveOrderNote(g.orderId, ta.value);
      openOrderNoteIds.delete(g.orderId);
      render();
    });
    saveNoteBtn.addEventListener("click", commit);
    noteBox.appendChild(ta);
    noteBox.appendChild(saveNoteBtn);
    wrap.appendChild(noteBox);
    setTimeout(() => ta.focus(), 0);
  }

  return wrap;
}

// ---- Actions ----

async function advanceStatus(t){
  const next = t.status === "cho_in" ? "cho_dong_goi" : "xong";
  const patch = { status: next, updatedAt: serverTimestamp() };
  try{
    await updateDoc(doc(db, "tasks", t.id), patch);
  }catch(e){ showError("Không cập nhật được trạng thái: " + e.message); }
}

async function revertStatus(t){
  const prev = t.status === "cho_dong_goi" ? "cho_in" : t.status === "xong" ? "cho_dong_goi" : null;
  if(!prev) return;
  try{
    await updateDoc(doc(db, "tasks", t.id), { status: prev, updatedAt: serverTimestamp() });
  }catch(e){ showError("Không lùi được trạng thái: " + e.message); }
}

// Bàn giao cả đơn cho shipper: chuyển mọi sản phẩm của đơn đang ở tab "Chờ bàn
// giao" sang tab "Đã bàn giao".
async function handOverWholeOrder(orderId){
  const items = allTasks.filter(t => t.orderId === orderId && t.status === "cho_dong_goi");
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { status: "xong", updatedAt: serverTimestamp() });
    }
  }catch(e){ showError("Không bàn giao được cả đơn: " + e.message); }
}

// Ghi chú giờ là CHUNG CHO CẢ ĐƠN (không còn riêng từng sản phẩm) — ghi cùng
// 1 giá trị lên mọi item cùng orderId, giống cách renameOrder() đồng bộ tên đơn.
async function saveOrderNote(orderId, note){
  const items = allTasks.filter(t => t.orderId === orderId);
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { note: note || "", updatedAt: serverTimestamp() });
    }
  }catch(e){ showError("Không lưu được ghi chú: " + e.message); }
}

// ---- Trích mã vận đơn từ PDF phiếu giao ----
// Có 2 cách, dùng kết hợp:
//  1) Đọc MÃ QR in trên phiếu (render trang PDF ra canvas rồi giải mã bằng
//     jsQR) — ĐÂY LÀ CÁCH CHÍNH. Mã QR trên các phiếu đã kiểm tra (J&T, SPX,
//     GHN) đều encode ĐÚNG mã vận đơn dạng chữ thuần, không kèm nhãn hay chữ
//     rác gì khác — nên không cần biết trước mẫu của từng hãng, không sợ hãng
//     đổi cách trình bày, và vẫn đọc được kể cả khi PDF là ảnh scan (miễn ảnh
//     đủ nét để thấy mã QR), vì làm việc trên ảnh render chứ không phụ thuộc
//     lớp text của PDF.
//  2) Đọc LỚP TEXT bằng pdf.js (cách cũ) — chỉ dùng làm DỰ PHÒNG khi trang
//     không có mã QR nào đọc được. Không còn dùng để suy ra tên hãng nữa —
//     kết quả trả về CHỈ LÀ chuỗi mã vận đơn (string), không kèm carrier.
async function renderPdfPageToCanvas(page, scale){
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

// "Mã ứng viên" là link (vd QR khuyến mãi "Quét QR mở shop TikTok" trên phiếu
// BEST) thì KHÔNG phải mã vận đơn — phải loại, nếu không sẽ lấy nhầm link làm
// mã đơn (đã gặp thật: jsQR đôi khi đọc QR khuyến mãi trước QR mã vận đơn).
function isUrlLike(str){
  return /^(https?:\/\/|www\.)/i.test(str) || /[\/\s]/.test(str);
}

// Đọc MÃ VẠCH 1D (Code128/39/93, ITF, EAN13) bằng ZXing. Trả về chuỗi hoặc null.
// Thư viện không tải được / không thấy mã vạch → null (không ném lỗi).
function readBarcode1D(imageData){
  try{
    const Z = window.ZXing;
    if(!Z) return null;
    const { width: w, height: h, data } = imageData;
    const lum = new Uint8ClampedArray(w * h);
    for(let i = 0; i < w * h; i++) lum[i] = (data[i*4] * 299 + data[i*4+1] * 587 + data[i*4+2] * 114) / 1000;
    const hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.CODE_93, Z.BarcodeFormat.ITF, Z.BarcodeFormat.EAN_13]);
    const reader = new Z.MultiFormatReader();
    reader.setHints(hints);
    const res = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum, w, h))));
    const t = res && res.getText && res.getText();
    return t ? t.trim() : null;
  }catch(e){ return null; }
}

// Đọc TẤT CẢ mã QR trong ảnh: jsQR mỗi lần chỉ trả 1 mã, nên sau khi đọc được
// thì TÔ TRẮNG vùng mã đó rồi quét tiếp để lấy các mã còn lại (phiếu có ≥2 QR:
// QR mã vận đơn + QR khuyến mãi).
function readAllQr(imageData){
  const { width: w, height: h } = imageData;
  const d = new Uint8ClampedArray(imageData.data);
  const out = [];
  for(let k = 0; k < 6; k++){
    const qr = window.jsQR(d, w, h);
    if(!qr) break;
    if(qr.data && qr.data.trim()) out.push(qr.data.trim());
    const L = qr.location;
    const pts = [L.topLeftCorner, L.topRightCorner, L.bottomLeftCorner, L.bottomRightCorner];
    const x0 = Math.max(0, Math.floor(Math.min(...pts.map(q => q.x))) - 4);
    const x1 = Math.min(w - 1, Math.ceil(Math.max(...pts.map(q => q.x))) + 4);
    const y0 = Math.max(0, Math.floor(Math.min(...pts.map(q => q.y))) - 4);
    const y1 = Math.min(h - 1, Math.ceil(Math.max(...pts.map(q => q.y))) + 4);
    for(let y = y0; y <= y1; y++){
      for(let x = x0; x <= x1; x++){
        const i = (y * w + x) * 4;
        d[i] = d[i+1] = d[i+2] = 255; d[i+3] = 255;
      }
    }
  }
  return out;
}

// Trả về MẢNG mã ứng viên theo thứ tự ưu tiên: MÃ VẠCH 1D → QR.
// Mã vạch 1D có trên mọi phiếu (máy quét dùng nó để nhập đơn) nên là nguồn
// chính: đọc được mã vạch thì DỪNG NGAY, không trộn thêm QR (tránh lấy nhầm
// QR khuyến mãi/mã phân tuyến). QR chỉ được thử khi KHÔNG đọc được mã vạch
// ở mọi độ phân giải. Mã dạng link luôn bị loại.
async function extractCodeCandidatesFromPdf(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  // Thử nhiều độ phân giải (scale) tăng dần: chỉ tăng khi lần trước thất bại.
  const scales = [2, 3, 4];
  // Vòng 1: mã vạch 1D
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    for(const scale of scales){
      const canvas = await renderPdfPageToCanvas(page, scale);
      const imageData = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
      const bc = readBarcode1D(imageData);
      if(bc && !isUrlLike(bc)) return [bc];
    }
  }
  // Vòng 2 (dự phòng): QR
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    for(const scale of scales){
      const canvas = await renderPdfPageToCanvas(page, scale);
      const imageData = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
      const cands = [];
      readAllQr(imageData).forEach(c => { if(c && !isUrlLike(c) && !cands.includes(c)) cands.push(c); });
      if(cands.length) return cands;
    }
  }
  return [];
}

// Chọn mã vận đơn từ các ứng viên: ưu tiên mã xuất hiện NHIỀU NHẤT trong text
// layer (mã vận đơn thường lặp nhiều lần dọc lề phiếu); hòa/không có text thì
// giữ thứ tự ưu tiên (mã vạch 1D → QR). Loại mã trùng "Order ID" của sàn.
function pickTrackingCode(cands, text){
  const orderIds = new Set(Array.from((text || "").matchAll(/Order\s*ID\s*:?\s*(\d+)/gi)).map(m => m[1]));
  const list = cands.filter(c => !orderIds.has(c));
  if(!list.length) return null;
  let best = list[0], bestN = -1;
  list.forEach(c => {
    const n = (text || "").split(c).length - 1;
    if(n > bestN){ best = c; bestN = n; }
  });
  return best;
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = "";
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += " " + content.items.map(it => it.str).join(" ");
  }
  return text;
}

// Nhận diện hãng vận chuyển từ text layer của PDF. Dùng CHUNG text đã đọc
// sẵn cho detectTrackingFromText (không đọc thêm PDF/QR nào) — chạy độc lập
// với việc QR có đọc được mã vận đơn hay không, vì thông tin hãng nằm ở phần
// header/khuyến mãi của phiếu chứ không nằm trong mã QR. Trả về 1 trong các
// key của CARRIER_LABEL ("jt"/"spx"/"ghn"), hoặc null nếu không khớp mẫu nào
// (mẫu lạ hoặc PDF ảnh scan không có text layer) — null sẽ được coi là
// "unknown" ở nơi gọi.
function detectCarrierFromText(text){
  // BEST Express (phiếu TikTok Shop): logo là ảnh, nhưng dòng dịch vụ có chữ
  // "TT-VN-BEST-COD-STD" trong text layer. Dùng mẫu hẹp "TT-VN-BEST" thay vì
  // chữ "BEST" trơn để khỏi nhầm với tên sản phẩm kiểu "best seller".
  if(/TT-?\s*VN-?\s*BEST|BEST\s*EXPRESS/i.test(text)) return "best";
  if(/J\s*&\s*T/i.test(text)) return "jt";
  if(/SPX/i.test(text)) return "spx";
  if(/Giao\s*H[àa]ng\s*Nhanh|\bGHN\b/i.test(text)) return "ghn";
  return null;
}

// NHẬN DIỆN HÃNG TỪ MÃ VẬN ĐƠN (nguồn chính, chạy trước text layer). Quy luật
// rút ra từ các phiếu mẫu thật:
//  - SPX:  "SPXVN" + số                      (vd SPXVN066711019298)
//  - BEST: "TTVN" + số                       (vd TTVN1113547228)
//  - J&T:  "JNT..." (Lazada, vd JNTMP0042877234VNA) hoặc 12 chữ số bắt đầu
//          bằng 86 (TikTok, vd 862434050357)
//  - GHN:  "GY" hoặc "GR" + 6 ký tự chữ/số = 8 ký tự  (vd GYYHQPEF, GYEE97XK, GRQFAQK4, GRQFFCDT)
// Không khớp luật nào → null ("chưa rõ", để người dùng tự chọn), KHÔNG đoán.
// Nếu gặp hãng/mã mới thì thêm luật ở đây.
function detectCarrierFromCode(code){
  if(!code) return null;
  const c = String(code).trim();
  if(/^SPXVN\d+$/i.test(c)) return "spx";
  if(/^TTVN\d{6,}$/i.test(c)) return "best";
  if(/^JNT[A-Z0-9]{8,}$/i.test(c)) return "jt";
  if(/^86\d{10}$/.test(c)) return "jt";
  if(/^G[YR][A-Z0-9]{6}$/i.test(c)) return "ghn";
  return null;
}

// Phần tử xuất hiện nhiều nhất trong mảng (mã vận đơn lặp nhiều lần ở lề phiếu).
function mostFrequent(arr){
  const freq = new Map();
  arr.forEach(n => freq.set(n, (freq.get(n) || 0) + 1));
  let best = null, bestCount = 0;
  for(const [n, c] of freq){ if(c > bestCount){ best = n; bestCount = c; } }
  return best;
}

// Dự phòng cuối cùng khi không đọc được mã vạch lẫn QR — dò trong lớp text,
// theo đúng các dạng mã ở detectCarrierFromCode(). Loại "Order ID" của sàn.
function detectTrackingFromText(text){
  const cleaned = (text || "").replace(/Order\s*ID\s*:?\s*\d+/gi, "");
  let m;
  if((m = cleaned.match(/\bSPXVN\d{8,}\b/g))) return mostFrequent(m);
  if((m = cleaned.match(/\bTTVN\d{6,}\b/g))) return mostFrequent(m);
  if((m = cleaned.match(/\bJNT[A-Z0-9]{8,}\b/g))) return mostFrequent(m);
  if((m = cleaned.match(/\b86\d{10}\b/g))) return mostFrequent(m);
  // J&T phiếu lạ: dãy số dài lặp nhiều nhất (đã loại Order ID)
  if(/J\s*&\s*T/i.test(cleaned)){
    const nums = cleaned.match(/\d{9,15}/g) || [];
    const best = mostFrequent(nums);
    if(best) return best;
  }
  // GHN / họ Shopee: có nhãn "Mã vận đơn:" ngay trước mã
  const lab = cleaned.match(/Mã vận đơn:?\s*([A-Za-z0-9]{5,})/i);
  if(lab) return lab[1];
  if((m = cleaned.match(/\bG[YR][A-Z0-9]{6}\b/g))) return mostFrequent(m);
  return null;
}

// Trả về { trackingCode, carrier } — gộp chung 1 lượt đọc PDF cho cả 2 việc,
// vì text layer (dùng để suy ra carrier) vốn dĩ đã phải đọc song song với QR
// làm phương án dự phòng cho trackingCode; không tách thành 1 nút/1 lượt quét
// riêng để tránh đọc PDF 2 lần và tránh lệch dữ liệu giữa 2 lần quét.
async function extractShipLabelInfo(file){
  // Không "nuốt" lỗi hoàn toàn ở đây — chỉ ném lỗi ra ngoài cho nơi gọi (để
  // phân biệt "đọc PDF lỗi thật sự" vs "đọc được nhưng không khớp mẫu nào")
  // khi KHÔNG lấy được trackingCode từ bất kỳ nguồn nào cả (xem điều kiện ở
  // cuối hàm) — còn nếu QR đã đọc được mã vận đơn thì luôn coi là thành công,
  // dù việc đọc text layer (chỉ dùng suy carrier) có lỗi hay không.

  // Đọc song song; trackingCode ưu tiên mã vạch 1D → QR → text.
  // extractCodeCandidatesFromPdf tự bắt lỗi riêng (trả mảng rỗng nếu lỗi). Với extractPdfText,
  // GIỮ LẠI lỗi (textError) thay vì để nó làm Promise.all reject toàn bộ —
  // nếu không, lỗi đọc text layer sẽ "cuốn trôi" luôn kết quả QR đã đọc
  // thành công ở nhánh kia (bug cũ). textError chỉ được ném ra ở điều kiện
  // cuối hàm, khi thực sự không còn gì để dùng.
  let textError = null;
  const [candidates, text] = await Promise.all([
    extractCodeCandidatesFromPdf(file).catch(() => []),
    extractPdfText(file).catch(e => { textError = e; return ""; })
  ]);

  const trackingCode = pickTrackingCode(candidates, text) || detectTrackingFromText(text);
  // Ưu tiên nhận diện hãng từ chính MÃ VẬN ĐƠN (mã vạch); không khớp luật nào
  // thì mới thử text layer; vẫn không ra → null ("chưa rõ", người dùng tự chọn).
  const carrier = detectCarrierFromCode(trackingCode) || detectCarrierFromText(text) || null;

  // Chỉ coi là "lỗi đọc PDF thật sự" khi KHÔNG lấy được trackingCode từ bất kỳ
  // nguồn nào (kể cả QR) VÀ việc đọc text layer có lỗi thật.
  if(!trackingCode && textError) throw textError;

  return { trackingCode, carrier };
}

// Tải file PDF lên Cloudinary (unsigned upload preset) rồi ghi URL vào mọi
// item cùng orderId (giống cách renameOrder() đồng bộ tên đơn). Dùng chung
// 1 public_id cố định theo orderId nên lần tải lên sau tự ghi đè file cũ
// (cần bật "Overwrite" cho upload preset "ship-labels" trên Cloudinary).
async function uploadShipLabel(orderId, file){
  if(!file) return;
  if(file.type !== "application/pdf"){
    showError("Chỉ chấp nhận file PDF cho phiếu giao.");
    return;
  }
  uploadingShipLabelIds.add(orderId);
  render();
  try{
    // URL (public_id) LUÔN cố định theo orderId nội bộ — không đổi dù đọc
    // được mã vận đơn hay không, để link luôn "vô danh" với người ngoài và
    // luôn ghi đè đúng 1 file (không phát sinh file mồ côi khi mã vận đơn
    // đổi giữa các lần tải lên). Chỉ TÊN FILE GỐC (display name trên
    // Cloudinary) mới đổi theo mã vận đơn khi đọc được, để tiện tìm kiếm
    // trong Media Library — tách biệt hoàn toàn khỏi URL thật.
    // QUAN TRỌNG: public_id MỚI cho MỖI LẦN tải lên (orderId + dấu thời gian).
    // Trước đây dùng public_id cố định theo orderId để "ghi đè", nhưng ghi đè
    // trên unsigned upload phụ thuộc cài đặt Overwrite của preset — nếu tắt,
    // Cloudinary âm thầm trả về FILE CŨ (app vẫn báo thành công, nội dung tải
    // về vẫn là phiếu cũ — đã gặp thật). Public_id mới thì không bao giờ trùng
    // nên luôn lấy đúng file vừa chọn, không phụ thuộc cài đặt nào. Đổi lại
    // file cũ nằm lại trên Cloudinary (vô hại, không còn được tham chiếu).
    const publicId = `ship-labels/${orderId}-${Date.now().toString(36)}`;
    const currentItem = allTasks.find(t => t.orderId === orderId);
    const currentName = (currentItem && currentItem.orderName) || "";
    let uploadFile = file;
    let trackingCode = null;
    let carrier = null;
    let readErrorMsg = null;
    try{
      ({ trackingCode, carrier } = await extractShipLabelInfo(file));
    }catch(e){
      readErrorMsg = (e && e.message) ? e.message : String(e);
    }
    // Carrier ghi nhận độc lập với việc có đọc được trackingCode hay không —
    // 1 phiếu vẫn có thể nhận ra hãng (qua header/khuyến mãi trong text layer)
    // dù QR/mã vận đơn không đọc được. Chỉ bỏ qua khi đọc PDF LỖI THẬT SỰ
    // (readErrorMsg) — còn "đọc được nhưng không khớp mẫu nào" vẫn ghi nhận
    // là "unknown" (khác với "chưa từng thử đọc").
    // Tải lại phiếu (thay file): nhận diện được hãng thì ghi đè; KHÔNG nhận
    // diện được thì giữ nguyên hãng người dùng đã chọn tay trước đó (chỉ ghi
    // "unknown" nếu đơn chưa có hãng nào).
    if(!readErrorMsg){
      if(carrier) await setOrderCarrier(orderId, carrier);
      else if(!currentItem || carrierKeyOf(currentItem) === "unknown") await setOrderCarrier(orderId, "unknown");
    }
    if(trackingCode){
      const safeCode = trackingCode.replace(/[^A-Za-z0-9]/g, "");
      uploadFile = new File([file], `${safeCode}.pdf`, { type: file.type });
      const newTitle = trackingCode;
      // Tự đổi tên (không hỏi) khi: đơn chưa có tên; HOẶC tên hiện tại đã đúng
      // bằng mã mới (không có gì để đổi); HOẶC tên hiện tại đang TRÙNG với 1
      // đơn đang xử lý khác (tên đó đã bị nghi sai do tải nhầm phiếu — mã đọc
      // từ chính file PDF mới đáng tin hơn). Các trường hợp còn lại (tên do
      // người dùng đặt riêng, không trùng ai) vẫn hỏi lại cho chắc.
      const sameName = currentName.trim().toUpperCase() === newTitle.trim().toUpperCase();
      const shouldRename = isBlankOrderName(currentName) || sameName ||
        isOrderNameUsedByOtherActiveOrder(orderId, currentName) ||
        confirm(`Đơn đang có tên "${currentName}".\nĐổi tên đơn thành "${newTitle}"?`);
      if(shouldRename && !sameName) await renameOrder(orderId, newTitle);
      // Mã vừa đọc được đã thuộc về 1 đơn đang xử lý khác → nhắc ngay (dòng đỏ
      // cảnh báo trùng ở đầu danh sách cũng sẽ hiện).
      if(isOrderNameUsedByOtherActiveOrder(orderId, newTitle)){
        showError(`Mã "${newTitle}" đang trùng với 1 đơn khác — có thể đã tải nhầm phiếu giao, hãy kiểm tra lại.`);
      }
    } else {
      if(readErrorMsg){
        showError("Không đọc được file PDF này để tự nhận diện mã vận đơn — vẫn tải phiếu lên bình thường, bạn có thể tự đổi tên đơn nếu cần.");
      } else {
        showError("Không nhận diện được mã vận đơn từ file này (mẫu lạ hoặc PDF ảnh scan) — vẫn tải phiếu lên bình thường, bạn có thể tự đổi tên đơn nếu cần.");
      }
      // Không giữ tên gốc lộn xộn từ điện thoại — đổi theo tên đơn hiện tại
      // (giống cách downloadShipLabel() đặt tên lúc tải xuống).
      const safeName = (currentName || "don-hang").replace(/[^a-zA-Z0-9-_]+/g, "_");
      uploadFile = new File([file], `phieu-giao-${safeName}.pdf`, { type: file.type });
    }
    const formData = new FormData();
    formData.append("file", uploadFile);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("public_id", publicId);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload`, {
      method: "POST",
      body: formData
    });
    const data = await res.json();
    if(!res.ok) throw new Error((data && data.error && data.error.message) || ("HTTP " + res.status));
    if(data.existing) throw new Error("Cloudinary trả về file cũ thay vì file mới — thử tải lên lại.");
    // Kiểm tra chéo: dung lượng file Cloudinary báo lại phải bằng file vừa chọn.
    // Lệch = file lưu trên Cloudinary KHÔNG phải file vừa tải (như vụ trả về
    // phiếu cũ) → báo ngay thay vì để phát hiện muộn lúc tải xuống.
    if(typeof data.bytes === "number" && data.bytes !== uploadFile.size){
      showError("Cảnh báo: file lưu trên Cloudinary có dung lượng khác file bạn vừa chọn — hãy bấm tải xuống kiểm tra lại nội dung phiếu giao.");
    }
    const url = data.secure_url;
    const items = allTasks.filter(t => t.orderId === orderId);
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { shipLabelUrl: url, updatedAt: serverTimestamp() });
    }
  }catch(e){
    showError("Không tải lên được phiếu giao: " + e.message);
  }finally{
    uploadingShipLabelIds.delete(orderId);
    render();
  }
}

async function removeShipLabel(orderId){
  if(!confirm("Xóa phiếu giao đã đính kèm cho đơn này?")) return;
  try{
    // Không xóa file trên Cloudinary ở đây: xóa cần chữ ký (API secret) nên
    // không thể gọi an toàn từ trình duyệt. Chỉ gỡ URL khỏi Firestore; file
    // cũ trên Cloudinary sẽ tự bị ghi đè ở lần tải lên kế tiếp cho orderId này.
    const items = allTasks.filter(t => t.orderId === orderId);
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { shipLabelUrl: deleteField(), updatedAt: serverTimestamp() });
    }
  }catch(e){ showError("Không xóa được phiếu giao: " + e.message); }
}

// Tải file về máy trực tiếp (không mở tab mới): fetch nguyên byte gốc thành
// blob rồi tự trigger tải — cách này bắt buộc phải dùng vì URL nằm khác domain
// (Cloudinary), thẻ <a download> trỏ thẳng URL cross-domain sẽ bị trình
// duyệt mở tab xem thay vì tải về.
async function downloadShipLabel(url, orderName){
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const safeName = (orderName || "don-hang").replace(/[^a-zA-Z0-9-_]+/g, "_");
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = `phieu-giao-${safeName}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
  }catch(e){
    showError("Không tải được phiếu giao (có thể do cấu hình CORS trên Cloudinary): " + e.message);
  }
}

// Tải lần lượt (tuần tự, không đồng thời) mọi phiếu giao của các đơn ĐANG

// groups: danh sách đơn cần tải; opts.source = "top" (nút đầu danh sách, tải

// chú số đơn bị bỏ qua vì chưa có phiếu.
async function downloadShipLabels(groups, opts = {}){
  const source = opts.source || "top";
  if(groups.length === 0){
    showError("Không có phiếu giao nào để tải.");

  }
  if(source === "top" && !confirm(`Tải xuống ${groups.length} phiếu giao (tab ${STATUS_LABEL[currentTab] || "hiện tại"})?`)) return;

  if(opts.skipNote) showNotice(`Đã tải ${groups.length} phiếu giao. ${opts.skipNote}`);
}

// ---- Gộp phiếu giao thành MỘT DẢI DỌC để in 1 lần ----
// Mỗi phiếu được CẮT SÁT phần nội dung thật (bỏ phần giấy trắng — vd phiếu
// Shopee nằm gọn ở góc 1/4 trang A4), xếp nối tiếp thành 1 cột dọc, canh trái,
// giữ 100% kích thước gốc (mã vạch quét được) — NGOẠI LỆ DUY NHẤT: phiếu khổ A4
// (TikTok in A4 = đúng bản A6 phóng 200%) được THU VỀ 50% = khổ A6 thật, để cả
// dải luôn cùng 1 cỡ A6 (~104 mm) thay vì bị 1 phiếu A4 làm cả cột rộng gấp đôi.
// Chiều rộng cột = phiếu RỘNG NHẤT sau khi đã quy về A6 (tính lại mỗi lần).
// Giữa 2 phiếu có 1 đường kẻ nét đứt nằm giữa khe để cắt bằng kéo. Chiều cao
// để TỰ NHIÊN theo số phiếu (máy in dùng cuộn, không giới hạn chiều dài); chỉ
// khi chạm trần kỹ thuật STRIP_MAX_H_MM mới sang trang mới.
const STRIP_PAD_MM = 1.5;    // viền chừa quanh nội dung khi cắt sát
const STRIP_GAP_MM = 4;      // khe giữa 2 phiếu (đường kẻ cắt nằm chính giữa khe)
// Trần kỹ thuật của định dạng PDF: tối đa 14400 đơn vị = 200 inch ≈ 5080 mm mỗi
// cạnh trang (Acrobat và nhiều RIP/phần mềm xem không mở nổi trang dài hơn).
// Để 5000 mm cho an toàn — khoảng 35 phiếu khổ A6 mới chạm; đây KHÔNG phải giới
// hạn của máy in và không làm co dãn phiếu (phiếu luôn giữ 100%).
const STRIP_MAX_H_MM = 5000;
// Phiếu sau khi cắt sát mà rộng hơn ngưỡng này = khổ A4 (A6 chỉ ~102-105 mm,
// A4 ~205 mm) → thu về A4_TO_A6_SCALE. A4 → A6 đúng bằng 1/2 nên 0.5 là chính xác.
const A4_MIN_WIDTH_MM = 150;
const A4_TO_A6_SCALE = 0.5;
const STRIP_SCAN_SCALE = 2;  // độ phân giải khi dò vùng nội dung (2 = 144 dpi ≈ 0,18 mm/điểm ảnh)
const PT_PER_MM = 72 / 25.4;

// Vùng bao các điểm KHÔNG TRẮNG của 1 ảnh (px, x1/y1 loại trừ). null nếu trang trắng.
function contentBoxFromImageData(img){
  const w = img.width, h = img.height, d = img.data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for(let y = 0; y < h; y++){
    const row = y * w * 4;
    for(let x = 0; x < w; x++){
      const i = row + x * 4;
      if(d[i+3] > 0 && (d[i] < 235 || d[i+1] < 235 || d[i+2] < 235)){
        if(x < x0) x0 = x;
        if(x > x1) x1 = x;
        if(y < y0) y0 = y;
        y1 = y;
      }
    }
  }
  return x1 < 0 ? null : { x0, y0, x1: x1 + 1, y1: y1 + 1 };
}

// Chia các khối (mỗi khối cao sizes[i].h mm) vào các trang: mỗi khối nối tiếp
// khối trước cách GAP; vượt maxH thì sang trang mới. Trả về
// [{ items:[{index, top}], height }] — top = khoảng cách (mm) từ mép trên trang.
function layoutStrips(sizes, gapMm, maxHMm){
  const pages = [];
  let cur = { items: [], height: 0 };
  sizes.forEach((sz, index) => {
    const need = (cur.items.length ? gapMm : 0) + sz.h;
    if(cur.items.length && cur.height + need > maxHMm){
      pages.push(cur);
      cur = { items: [], height: 0 };
    }
    const top = cur.items.length ? cur.height + gapMm : 0;
    cur.items.push({ index, top });
    cur.height = top + sz.h;
  });
  if(cur.items.length) pages.push(cur);
  return pages;
}

// Đọc 1 file PDF phiếu: dò vùng nội dung của từng trang bằng pdf.js rồi nhúng
// đúng vùng đó vào outDoc (pdf-lib). Trả về các khối { embedded, wMm, hMm }.
async function extractLabelBlocks(arrayBuffer, outDoc, PDFDocument){
  const src = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer.slice(0)) }).promise;
  const blocks = [];
  try{
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const [vx0, vy0, vx1, vy1] = page.view; // khung trang (hệ tọa độ PDF, gốc dưới-trái)
      let left = vx0, right = vx1, top = vy1, bottom = vy0; // mặc định: cả trang
      if(!page.rotate){ // trang bị xoay thì giữ nguyên cả trang, không cắt (hiếm gặp)
        const canvas = await renderPdfPageToCanvas(page, STRIP_SCAN_SCALE);
        const box = contentBoxFromImageData(canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height));
        if(!box) continue; // trang trắng hoàn toàn → bỏ qua
        const pad = STRIP_PAD_MM * PT_PER_MM, S = STRIP_SCAN_SCALE;
        left = Math.max(vx0, vx0 + box.x0 / S - pad);
        right = Math.min(vx1, vx0 + box.x1 / S + pad);
        top = Math.min(vy1, vy1 - box.y0 / S + pad);
        bottom = Math.max(vy0, vy1 - box.y1 / S - pad);
      }
      const embedded = await outDoc.embedPage(src.getPage(i - 1), { left, right, top, bottom });
      const rawW = (right - left) / PT_PER_MM, rawH = (top - bottom) / PT_PER_MM;
      const k = rawW > A4_MIN_WIDTH_MM ? A4_TO_A6_SCALE : 1; // A4 → A6
      // wMm/hMm là kích thước SAU khi quy về A6; drawPage bên dưới tự co theo đó.
      blocks.push({ embedded, wMm: rawW * k, hMm: rawH * k, scaled: k !== 1 });
    }
  } finally {
    pdf.destroy();
  }
  return blocks;
}

// groups/opts giống downloadShipLabels (source "top" = mọi đơn của tab đang mở,
// "batch" = chỉ các đơn đã tích).
async function mergeShipLabels(groups, opts = {}){
  const source = opts.source || "top";
  if(groups.length === 0){ showError("Không có phiếu giao nào để gộp."); return; }
  if(!window.PDFLib){
    showError("Chưa tải được thư viện ghép PDF (cần mạng) — hãy tải lại trang rồi thử lại.");
    return;
  }
  const { PDFDocument, rgb } = window.PDFLib;
  labelBusy = true;
  setLabelButtonsDisabled(true);
  const failed = [];
  try{
    const out = await PDFDocument.create();
    const blocks = [];
    for(let i = 0; i < groups.length; i++){
      setLabelProgress(source, "merge", i + 1, groups.length);
      try{
        const res = await fetch(groups[i].shipLabelUrl);
        if(!res.ok) throw new Error("HTTP " + res.status);
        blocks.push(...await extractLabelBlocks(await res.arrayBuffer(), out, PDFDocument));
      }catch(e){
        failed.push(groups[i].orderName || "(đơn chưa có mã)");
      }
    }
    if(blocks.length === 0) throw new Error("không ghép được phiếu nào");

    const stripWmm = Math.max(...blocks.map(b => b.wMm)); // rộng = phiếu rộng nhất của lần gộp này
    const pages = layoutStrips(blocks.map(b => ({ h: b.hMm })), STRIP_GAP_MM, STRIP_MAX_H_MM);
    pages.forEach(pg => {
      const page = out.addPage([stripWmm * PT_PER_MM, pg.height * PT_PER_MM]);
      pg.items.forEach((it, n) => {
        const b = blocks[it.index];
        page.drawPage(b.embedded, {
          x: 0,
          y: (pg.height - it.top - b.hMm) * PT_PER_MM,
          width: b.wMm * PT_PER_MM,
          height: b.hMm * PT_PER_MM,
        });
        if(n > 0){ // đường kẻ cắt nét đứt, nằm GIỮA khe giữa phiếu này và phiếu ngay trên
          const yLine = (pg.height - it.top + STRIP_GAP_MM / 2) * PT_PER_MM;
          page.drawLine({
            start: { x: 0, y: yLine },
            end: { x: stripWmm * PT_PER_MM, y: yLine },
            thickness: 0.6,
            color: rgb(0.25, 0.25, 0.25),
            dashArray: [4, 3],
          });
        }
      });
    });

    const bytes = await out.save();
    const blobUrl = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    const d = new Date(), pad2 = n => String(n).padStart(2, "0");
    const stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = `phieu-giao-gop-${stamp}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);

    let msg = `Đã gộp ${blocks.length} phiếu thành ${pages.length} trang, rộng ${Math.round(stripWmm)} mm, cao ${pages.map(p => Math.round(p.height)).join(" + ")} mm. Đường kẻ nét đứt giữa các phiếu là đường cắt.`;
    const nScaled = blocks.filter(b => b.scaled).length;
    if(nScaled){
      msg += ` Có ${nScaled} phiếu khổ A4 (thường là TikTok) đã tự thu về 50% = khổ A6 để cả dải cùng cỡ; in đúng kích thước thực (100%), không chọn "vừa trang".`;
    }
    if(failed.length) msg += ` Không ghép được: ${failed.join(", ")}.`;
    if(opts.skipNote) msg += ` ${opts.skipNote}`;
    showNotice(msg);
  }catch(e){
    showError("Không gộp được phiếu giao: " + e.message);
  }finally{
    labelBusy = false;
    setLabelButtonsDisabled(false);
    updateLabelButtons();
    updateBatchBar();
  }
}

// Nút trên thanh chọn: chỉ xử lý phiếu của các đơn đang tích.
function batchLabelJob(run){

  if(groups.length === 0){ showError("Các đơn đã chọn chưa có phiếu giao nào."); return; }

async function setOrderCarrier(orderId, carrier, customName){

const locNoteRef = doc(db, "meta", "locationNote");
const locNotePanel = document.getElementById("locNotePanel");
const locNoteBackdrop = document.getElementById("locNoteBackdrop");
const locNoteFab = document.getElementById("locNoteFab");
