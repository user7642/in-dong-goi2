// ---- Trích mã vận đơn từ PDF phiếu giao ----
// Có 2 cách, dùng kết hợp:
//  1) Đọc MÃ QR in trên phiếu (render trang PDF ra canvas rồi giải mã bằng
//     jsQR) — ĐÂY LÀ CÁCH CHÍNH. Mã QR trên các phiếu đã kiểm tra (J&T, SPX,
//     GHN) đều encode ĐÚNG mã vận đơn dạng chữ thuần, không kèm nhãn hay chữ
//     rác gì khác — nên không cần biết trước mẫu của từng hãng, không sợ hãng
//     đổi cách trình bày, và vẫn đọc được kể cả khi PDF là ảnh scan (miễn ảnh
//     đủ nét để thấy mã QR), vì làm việc trên ảnh render chứ không phụ thuộc
//     lớp text của PDF.
//  2) Đọc LỚP TEXT bằng pdf.js (cách cũ) — chỉ dùng làm DỰ PHÒNG khi trang
//     không có mã QR nào đọc được. Không còn dùng để suy ra tên hãng nữa —
//     kết quả trả về CHỈ LÀ chuỗi mã vận đơn (string), không kèm carrier.
async function renderPdfPageToCanvas(page, scale){
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

// "Mã ứng viên" là link (vd QR khuyến mãi "Quét QR mở shop TikTok" trên phiếu
// BEST) thì KHÔNG phải mã vận đơn — phải loại, nếu không sẽ lấy nhầm link làm
// mã đơn (đã gặp thật: jsQR đôi khi đọc QR khuyến mãi trước QR mã vận đơn).
function isUrlLike(str){
  return /^(https?:\/\/|www\.)/i.test(str) || /[\/\s]/.test(str);
}

// Đọc MÃ VẠCH 1D (Code128/39/93, ITF, EAN13) bằng ZXing. Trả về chuỗi hoặc null.
// Thư viện không tải được / không thấy mã vạch → null (không ném lỗi).
function readBarcode1D(imageData){
  try{
    const Z = window.ZXing;
    if(!Z) return null;
    const { width: w, height: h, data } = imageData;
    const lum = new Uint8ClampedArray(w * h);
    for(let i = 0; i < w * h; i++) lum[i] = (data[i*4] * 299 + data[i*4+1] * 587 + data[i*4+2] * 114) / 1000;
    const hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.CODE_93, Z.BarcodeFormat.ITF, Z.BarcodeFormat.EAN_13]);
    const reader = new Z.MultiFormatReader();
    reader.setHints(hints);
    const res = reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum, w, h))));
    const t = res && res.getText && res.getText();
    return t ? t.trim() : null;
  }catch(e){ return null; }
}

// Đọc TẤT CẢ mã QR trong ảnh: jsQR mỗi lần chỉ trả 1 mã, nên sau khi đọc được
// thì TÔ TRẮNG vùng mã đó rồi quét tiếp để lấy các mã còn lại (phiếu có ≥2 QR:
// QR mã vận đơn + QR khuyến mãi).
function readAllQr(imageData){
  const { width: w, height: h } = imageData;
  const d = new Uint8ClampedArray(imageData.data);
  const out = [];
  for(let k = 0; k < 6; k++){
    const qr = window.jsQR(d, w, h);
    if(!qr) break;
    if(qr.data && qr.data.trim()) out.push(qr.data.trim());
    const L = qr.location;
    const pts = [L.topLeftCorner, L.topRightCorner, L.bottomLeftCorner, L.bottomRightCorner];
    const x0 = Math.max(0, Math.floor(Math.min(...pts.map(q => q.x))) - 4);
    const x1 = Math.min(w - 1, Math.ceil(Math.max(...pts.map(q => q.x))) + 4);
    const y0 = Math.max(0, Math.floor(Math.min(...pts.map(q => q.y))) - 4);
    const y1 = Math.min(h - 1, Math.ceil(Math.max(...pts.map(q => q.y))) + 4);
    for(let y = y0; y <= y1; y++){
      for(let x = x0; x <= x1; x++){
        const i = (y * w + x) * 4;
        d[i] = d[i+1] = d[i+2] = 255; d[i+3] = 255;
      }
    }
  }
  return out;
}

// Trả về MẢNG mã ứng viên theo thứ tự ưu tiên: MÃ VẠCH 1D → QR.
// Mã vạch 1D có trên mọi phiếu (máy quét dùng nó để nhập đơn) nên là nguồn
// chính: đọc được mã vạch thì DỪNG NGAY, không trộn thêm QR (tránh lấy nhầm
// QR khuyến mãi/mã phân tuyến). QR chỉ được thử khi KHÔNG đọc được mã vạch
// ở mọi độ phân giải. Mã dạng link luôn bị loại.
async function extractCodeCandidatesFromPdf(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  // Thử nhiều độ phân giải (scale) tăng dần: chỉ tăng khi lần trước thất bại.
  const scales = [2, 3, 4];
  // Vòng 1: mã vạch 1D
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    for(const scale of scales){
      const canvas = await renderPdfPageToCanvas(page, scale);
      const imageData = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
      const bc = readBarcode1D(imageData);
      if(bc && !isUrlLike(bc)) return [bc];
    }
  }
  // Vòng 2 (dự phòng): QR
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    for(const scale of scales){
      const canvas = await renderPdfPageToCanvas(page, scale);
      const imageData = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
      const cands = [];
      readAllQr(imageData).forEach(c => { if(c && !isUrlLike(c) && !cands.includes(c)) cands.push(c); });
      if(cands.length) return cands;
    }
  }
  return [];
}

// Chọn mã vận đơn từ các ứng viên: ưu tiên mã xuất hiện NHIỀU NHẤT trong text
// layer (mã vận đơn thường lặp nhiều lần dọc lề phiếu); hòa/không có text thì
// giữ thứ tự ưu tiên (mã vạch 1D → QR). Loại mã trùng "Order ID" của sàn.
function pickTrackingCode(cands, text){
  const orderIds = new Set(Array.from((text || "").matchAll(/Order\s*ID\s*:?\s*(\d+)/gi)).map(m => m[1]));
  const list = cands.filter(c => !orderIds.has(c));
  if(!list.length) return null;
  let best = list[0], bestN = -1;
  list.forEach(c => {
    const n = (text || "").split(c).length - 1;
    if(n > bestN){ best = c; bestN = n; }
  });
  return best;
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = "";
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += " " + content.items.map(it => it.str).join(" ");
  }
  return text;
}

// Nhận diện hãng vận chuyển từ text layer của PDF. Dùng CHUNG text đã đọc
// sẵn cho detectTrackingFromText (không đọc thêm PDF/QR nào) — chạy độc lập
// với việc QR có đọc được mã vận đơn hay không, vì thông tin hãng nằm ở phần
// header/khuyến mãi của phiếu chứ không nằm trong mã QR. Trả về 1 trong các
// key của CARRIER_LABEL ("jt"/"spx"/"ghn"), hoặc null nếu không khớp mẫu nào
// (mẫu lạ hoặc PDF ảnh scan không có text layer) — null sẽ được coi là
// "unknown" ở nơi gọi.
function detectCarrierFromText(text){
  // BEST Express (phiếu TikTok Shop): logo là ảnh, nhưng dòng dịch vụ có chữ
  // "TT-VN-BEST-COD-STD" trong text layer. Dùng mẫu hẹp "TT-VN-BEST" thay vì
  // chữ "BEST" trơn để khỏi nhầm với tên sản phẩm kiểu "best seller".
  if(/TT-?\s*VN-?\s*BEST|BEST\s*EXPRESS/i.test(text)) return "best";
  if(/J\s*&\s*T/i.test(text)) return "jt";
  if(/SPX/i.test(text)) return "spx";
  if(/Giao\s*H[àa]ng\s*Nhanh|\bGHN\b/i.test(text)) return "ghn";
  return null;
}

// NHẬN DIỆN HÃNG TỪ MÃ VẬN ĐƠN (nguồn chính, chạy trước text layer). Quy luật
// rút ra từ các phiếu mẫu thật:
//  - SPX:  "SPXVN" + số                      (vd SPXVN066711019298)
//  - BEST: "TTVN" + số                       (vd TTVN1113547228)
//  - J&T:  "JNT..." (Lazada, vd JNTMP0042877234VNA) hoặc 12 chữ số bắt đầu
//          bằng 86 (TikTok, vd 862434050357)
//  - GHN:  "GY" + 6 ký tự chữ/số = 8 ký tự  (vd GYYHQPEF, GYRNKR37)
// Không khớp luật nào → null ("chưa rõ", để người dùng tự chọn), KHÔNG đoán.
// Nếu gặp hãng/mã mới thì thêm luật ở đây.
function detectCarrierFromCode(code){
  if(!code) return null;
  const c = String(code).trim();
  if(/^SPXVN\d+$/i.test(c)) return "spx";
  if(/^TTVN\d{6,}$/i.test(c)) return "best";
  if(/^JNT[A-Z0-9]{8,}$/i.test(c)) return "jt";
  if(/^86\d{10}$/.test(c)) return "jt";
  if(/^GY[A-Z0-9]{6}$/i.test(c)) return "ghn";
  return null;
}

// Phần tử xuất hiện nhiều nhất trong mảng (mã vận đơn lặp nhiều lần ở lề phiếu).
function mostFrequent(arr){
  const freq = new Map();
  arr.forEach(n => freq.set(n, (freq.get(n) || 0) + 1));
  let best = null, bestCount = 0;
  for(const [n, c] of freq){ if(c > bestCount){ best = n; bestCount = c; } }
  return best;
}

// Dự phòng cuối cùng khi không đọc được mã vạch lẫn QR — dò trong lớp text,
// theo đúng các dạng mã ở detectCarrierFromCode(). Loại "Order ID" của sàn.
function detectTrackingFromText(text){
  const cleaned = (text || "").replace(/Order\s*ID\s*:?\s*\d+/gi, "");
  let m;
  if((m = cleaned.match(/\bSPXVN\d{8,}\b/g))) return mostFrequent(m);
  if((m = cleaned.match(/\bTTVN\d{6,}\b/g))) return mostFrequent(m);
  if((m = cleaned.match(/\bJNT[A-Z0-9]{8,}\b/g))) return mostFrequent(m);
  if((m = cleaned.match(/\b86\d{10}\b/g))) return mostFrequent(m);
  // J&T phiếu lạ: dãy số dài lặp nhiều nhất (đã loại Order ID)
  if(/J\s*&\s*T/i.test(cleaned)){
    const nums = cleaned.match(/\d{9,15}/g) || [];
    const best = mostFrequent(nums);
    if(best) return best;
  }
  // GHN / họ Shopee: có nhãn "Mã vận đơn:" ngay trước mã
  const lab = cleaned.match(/Mã vận đơn:?\s*([A-Za-z0-9]{5,})/i);
  if(lab) return lab[1];
  if((m = cleaned.match(/\bGY[A-Z0-9]{6}\b/g))) return mostFrequent(m);
  return null;
}

// Trả về { trackingCode, carrier } — gộp chung 1 lượt đọc PDF cho cả 2 việc,
// vì text layer (dùng để suy ra carrier) vốn dĩ đã phải đọc song song với QR
// làm phương án dự phòng cho trackingCode; không tách thành 1 nút/1 lượt quét
// riêng để tránh đọc PDF 2 lần và tránh lệch dữ liệu giữa 2 lần quét.
async function extractShipLabelInfo(file){
  // Không "nuốt" lỗi hoàn toàn ở đây — chỉ ném lỗi ra ngoài cho nơi gọi (để
  // phân biệt "đọc PDF lỗi thật sự" vs "đọc được nhưng không khớp mẫu nào")
  // khi KHÔNG lấy được trackingCode từ bất kỳ nguồn nào cả (xem điều kiện ở
  // cuối hàm) — còn nếu QR đã đọc được mã vận đơn thì luôn coi là thành công,
  // dù việc đọc text layer (chỉ dùng suy carrier) có lỗi hay không.

  // Đọc song song; trackingCode ưu tiên mã vạch 1D → QR → text.
  // extractCodeCandidatesFromPdf tự bắt lỗi riêng (trả mảng rỗng nếu lỗi). Với extractPdfText,
  // GIỮ LẠI lỗi (textError) thay vì để nó làm Promise.all reject toàn bộ —
  // nếu không, lỗi đọc text layer sẽ "cuốn trôi" luôn kết quả QR đã đọc
  // thành công ở nhánh kia (bug cũ). textError chỉ được ném ra ở điều kiện
  // cuối hàm, khi thực sự không còn gì để dùng.
  let textError = null;
  const [candidates, text] = await Promise.all([
    extractCodeCandidatesFromPdf(file).catch(() => []),
    extractPdfText(file).catch(e => { textError = e; return ""; })
  ]);

  const trackingCode = pickTrackingCode(candidates, text) || detectTrackingFromText(text);
  // Ưu tiên nhận diện hãng từ chính MÃ VẬN ĐƠN (mã vạch); không khớp luật nào
  // thì mới thử text layer; vẫn không ra → null ("chưa rõ", người dùng tự chọn).
  const carrier = detectCarrierFromCode(trackingCode) || detectCarrierFromText(text) || null;

  // Chỉ coi là "lỗi đọc PDF thật sự" khi KHÔNG lấy được trackingCode từ bất kỳ
  // nguồn nào (kể cả QR) VÀ việc đọc text layer có lỗi thật.
  if(!trackingCode && textError) throw textError;

  return { trackingCode, carrier };
}

// Tải file PDF lên Cloudinary (unsigned upload preset) rồi ghi URL vào mọi
// item cùng orderId (giống cách renameOrder() đồng bộ tên đơn). Dùng chung
// 1 public_id cố định theo orderId nên lần tải lên sau tự ghi đè file cũ
// (cần bật "Overwrite" cho upload preset "ship-labels" trên Cloudinary).
async function uploadShipLabel(orderId, file){
  if(!file) return;
  if(file.type !== "application/pdf"){
    showError("Chỉ chấp nhận file PDF cho phiếu giao.");
    return;
  }
  uploadingShipLabelIds.add(orderId);
  render();
  try{
    // URL (public_id) LUÔN cố định theo orderId nội bộ — không đổi dù đọc
    // được mã vận đơn hay không, để link luôn "vô danh" với người ngoài và
    // luôn ghi đè đúng 1 file (không phát sinh file mồ côi khi mã vận đơn
    // đổi giữa các lần tải lên). Chỉ TÊN FILE GỐC (display name trên
    // Cloudinary) mới đổi theo mã vận đơn khi đọc được, để tiện tìm kiếm
    // trong Media Library — tách biệt hoàn toàn khỏi URL thật.
    // QUAN TRỌNG: public_id MỚI cho MỖI LẦN tải lên (orderId + dấu thời gian).
    // Trước đây dùng public_id cố định theo orderId để "ghi đè", nhưng ghi đè
    // trên unsigned upload phụ thuộc cài đặt Overwrite của preset — nếu tắt,
    // Cloudinary âm thầm trả về FILE CŨ (app vẫn báo thành công, nội dung tải
    // về vẫn là phiếu cũ — đã gặp thật). Public_id mới thì không bao giờ trùng
    // nên luôn lấy đúng file vừa chọn, không phụ thuộc cài đặt nào. Đổi lại
    // file cũ nằm lại trên Cloudinary (vô hại, không còn được tham chiếu).
    const publicId = `ship-labels/${orderId}-${Date.now().toString(36)}`;
    const currentItem = allTasks.find(t => t.orderId === orderId);
    const currentName = (currentItem && currentItem.orderName) || "";
    let uploadFile = file;
    let trackingCode = null;
    let carrier = null;
    let readErrorMsg = null;
    try{
      ({ trackingCode, carrier } = await extractShipLabelInfo(file));
    }catch(e){
      readErrorMsg = (e && e.message) ? e.message : String(e);
    }
    // Carrier ghi nhận độc lập với việc có đọc được trackingCode hay không —
    // 1 phiếu vẫn có thể nhận ra hãng (qua header/khuyến mãi trong text layer)
    // dù QR/mã vận đơn không đọc được. Chỉ bỏ qua khi đọc PDF LỖI THẬT SỰ
    // (readErrorMsg) — còn "đọc được nhưng không khớp mẫu nào" vẫn ghi nhận
    // là "unknown" (khác với "chưa từng thử đọc").
    // Tải lại phiếu (thay file): nhận diện được hãng thì ghi đè; KHÔNG nhận
    // diện được thì giữ nguyên hãng người dùng đã chọn tay trước đó (chỉ ghi
    // "unknown" nếu đơn chưa có hãng nào).
    if(!readErrorMsg){
      if(carrier) await setOrderCarrier(orderId, carrier);
      else if(!currentItem || carrierKeyOf(currentItem) === "unknown") await setOrderCarrier(orderId, "unknown");
    }
    if(trackingCode){
      const safeCode = trackingCode.replace(/[^A-Za-z0-9]/g, "");
      uploadFile = new File([file], `${safeCode}.pdf`, { type: file.type });
      const newTitle = trackingCode;
      // Tự đổi tên (không hỏi) khi: đơn chưa có tên; HOẶC tên hiện tại đã đúng
      // bằng mã mới (không có gì để đổi); HOẶC tên hiện tại đang TRÙNG với 1
      // đơn đang xử lý khác (tên đó đã bị nghi sai do tải nhầm phiếu — mã đọc
      // từ chính file PDF mới đáng tin hơn). Các trường hợp còn lại (tên do
      // người dùng đặt riêng, không trùng ai) vẫn hỏi lại cho chắc.
      const sameName = currentName.trim().toUpperCase() === newTitle.trim().toUpperCase();
      const shouldRename = isBlankOrderName(currentName) || sameName ||
        isOrderNameUsedByOtherActiveOrder(orderId, currentName) ||
        confirm(`Đơn đang có tên "${currentName}".\nĐổi tên đơn thành "${newTitle}"?`);
      if(shouldRename && !sameName) await renameOrder(orderId, newTitle);
      // Mã vừa đọc được đã thuộc về 1 đơn đang xử lý khác → nhắc ngay (dòng đỏ
      // cảnh báo trùng ở đầu danh sách cũng sẽ hiện).
      if(isOrderNameUsedByOtherActiveOrder(orderId, newTitle)){
        showError(`Mã "${newTitle}" đang trùng với 1 đơn khác — có thể đã tải nhầm phiếu giao, hãy kiểm tra lại.`);
      }
    } else {
      if(readErrorMsg){
        showError("Không đọc được file PDF này để tự nhận diện mã vận đơn — vẫn tải phiếu lên bình thường, bạn có thể tự đổi tên đơn nếu cần.");
      } else {
        showError("Không nhận diện được mã vận đơn từ file này (mẫu lạ hoặc PDF ảnh scan) — vẫn tải phiếu lên bình thường, bạn có thể tự đổi tên đơn nếu cần.");
      }
      // Không giữ tên gốc lộn xộn từ điện thoại — đổi theo tên đơn hiện tại
      // (giống cách downloadShipLabel() đặt tên lúc tải xuống).
      const safeName = (currentName || "don-hang").replace(/[^a-zA-Z0-9-_]+/g, "_");
      uploadFile = new File([file], `phieu-giao-${safeName}.pdf`, { type: file.type });
    }
    const formData = new FormData();
    formData.append("file", uploadFile);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("public_id", publicId);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload`, {
      method: "POST",
      body: formData
    });
    const data = await res.json();
    if(!res.ok) throw new Error((data && data.error && data.error.message) || ("HTTP " + res.status));
    if(data.existing) throw new Error("Cloudinary trả về file cũ thay vì file mới — thử tải lên lại.");
    // Kiểm tra chéo: dung lượng file Cloudinary báo lại phải bằng file vừa chọn.
    // Lệch = file lưu trên Cloudinary KHÔNG phải file vừa tải (như vụ trả về
    // phiếu cũ) → báo ngay thay vì để phát hiện muộn lúc tải xuống.
    if(typeof data.bytes === "number" && data.bytes !== uploadFile.size){
      showError("Cảnh báo: file lưu trên Cloudinary có dung lượng khác file bạn vừa chọn — hãy bấm tải xuống kiểm tra lại nội dung phiếu giao.");
    }
    const url = data.secure_url;
    const items = allTasks.filter(t => t.orderId === orderId);
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { shipLabelUrl: url, updatedAt: serverTimestamp() });
    }
  }catch(e){
    showError("Không tải lên được phiếu giao: " + e.message);
  }finally{
    uploadingShipLabelIds.delete(orderId);
    render();
  }
}

// Tải file về máy trực tiếp (không mở tab mới): fetch nguyên byte gốc thành
// blob rồi tự trigger tải — cách này bắt buộc phải dùng vì URL nằm khác domain
// (Cloudinary), thẻ <a download> trỏ thẳng URL cross-domain sẽ bị trình
// duyệt mở tab xem thay vì tải về.
async function downloadShipLabel(url, orderName){
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const safeName = (orderName || "don-hang").replace(/[^a-zA-Z0-9-_]+/g, "_");
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = `phieu-giao-${safeName}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
  }catch(e){
    showError("Không tải được phiếu giao (có thể do cấu hình CORS trên Cloudinary): " + e.message);
  }
}

// ---- Gộp phiếu giao thành MỘT DẢI DỌC để in 1 lần ----
// Mỗi phiếu được CẮT SÁT phần nội dung thật (bỏ phần giấy trắng — vd phiếu
// Shopee nằm gọn ở góc 1/4 trang A4), xếp nối tiếp thành 1 cột dọc, canh trái,
// giữ 100% kích thước gốc (mã vạch quét được) — NGOẠI LỆ DUY NHẤT: phiếu khổ A4
// (TikTok in A4 = đúng bản A6 phóng 200%) được THU VỀ 50% = khổ A6 thật, để cả
// dải luôn cùng 1 cỡ A6 (~104 mm) thay vì bị 1 phiếu A4 làm cả cột rộng gấp đôi.
// Chiều rộng cột = phiếu RỘNG NHẤT sau khi đã quy về A6 (tính lại mỗi lần).
// Giữa 2 phiếu có 1 đường kẻ nét đứt nằm giữa khe để cắt bằng kéo. Chiều cao
// để TỰ NHIÊN theo số phiếu (máy in dùng cuộn, không giới hạn chiều dài); chỉ
// khi chạm trần kỹ thuật STRIP_MAX_H_MM mới sang trang mới.
const STRIP_PAD_MM = 1.5;    // viền chừa quanh nội dung khi cắt sát
const STRIP_GAP_MM = 4;      // khe giữa 2 phiếu (đường kẻ cắt nằm chính giữa khe)
// Trần kỹ thuật của định dạng PDF: tối đa 14400 đơn vị = 200 inch ≈ 5080 mm mỗi
// cạnh trang (Acrobat và nhiều RIP/phần mềm xem không mở nổi trang dài hơn).
// Để 5000 mm cho an toàn — khoảng 35 phiếu khổ A6 mới chạm; đây KHÔNG phải giới
// hạn của máy in và không làm co dãn phiếu (phiếu luôn giữ 100%).
const STRIP_MAX_H_MM = 5000;
// Phiếu sau khi cắt sát mà rộng hơn ngưỡng này = khổ A4 (A6 chỉ ~102-105 mm,
// A4 ~205 mm) → thu về A4_TO_A6_SCALE. A4 → A6 đúng bằng 1/2 nên 0.5 là chính xác.
const A4_MIN_WIDTH_MM = 150;
const A4_TO_A6_SCALE = 0.5;
const STRIP_SCAN_SCALE = 2;  // độ phân giải khi dò vùng nội dung (2 = 144 dpi ≈ 0,18 mm/điểm ảnh)
const PT_PER_MM = 72 / 25.4;

// Vùng bao các điểm KHÔNG TRẮNG của 1 ảnh (px, x1/y1 loại trừ). null nếu trang trắng.
function contentBoxFromImageData(img){
  const w = img.width, h = img.height, d = img.data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for(let y = 0; y < h; y++){
    const row = y * w * 4;
    for(let x = 0; x < w; x++){
      const i = row + x * 4;
      if(d[i+3] > 0 && (d[i] < 235 || d[i+1] < 235 || d[i+2] < 235)){
        if(x < x0) x0 = x;
        if(x > x1) x1 = x;
        if(y < y0) y0 = y;
        y1 = y;
      }
    }
  }
  return x1 < 0 ? null : { x0, y0, x1: x1 + 1, y1: y1 + 1 };
}

// Chia các khối (mỗi khối cao sizes[i].h mm) vào các trang: mỗi khối nối tiếp
// khối trước cách GAP; vượt maxH thì sang trang mới. Trả về
// [{ items:[{index, top}], height }] — top = khoảng cách (mm) từ mép trên trang.
function layoutStrips(sizes, gapMm, maxHMm){
  const pages = [];
  let cur = { items: [], height: 0 };
  sizes.forEach((sz, index) => {
    const need = (cur.items.length ? gapMm : 0) + sz.h;
    if(cur.items.length && cur.height + need > maxHMm){
      pages.push(cur);
      cur = { items: [], height: 0 };
    }
    const top = cur.items.length ? cur.height + gapMm : 0;
    cur.items.push({ index, top });
    cur.height = top + sz.h;
  });
  if(cur.items.length) pages.push(cur);
  return pages;
}

// Đọc 1 file PDF phiếu: dò vùng nội dung của từng trang bằng pdf.js rồi nhúng
// đúng vùng đó vào outDoc (pdf-lib). Trả về các khối { embedded, wMm, hMm }.
async function extractLabelBlocks(arrayBuffer, outDoc, PDFDocument){
  const src = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer.slice(0)) }).promise;
  const blocks = [];
  try{
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const [vx0, vy0, vx1, vy1] = page.view; // khung trang (hệ tọa độ PDF, gốc dưới-trái)
      let left = vx0, right = vx1, top = vy1, bottom = vy0; // mặc định: cả trang
      if(!page.rotate){ // trang bị xoay thì giữ nguyên cả trang, không cắt (hiếm gặp)
        const canvas = await renderPdfPageToCanvas(page, STRIP_SCAN_SCALE);
        const box = contentBoxFromImageData(canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height));
        if(!box) continue; // trang trắng hoàn toàn → bỏ qua
        const pad = STRIP_PAD_MM * PT_PER_MM, S = STRIP_SCAN_SCALE;
        left = Math.max(vx0, vx0 + box.x0 / S - pad);
        right = Math.min(vx1, vx0 + box.x1 / S + pad);
        top = Math.min(vy1, vy1 - box.y0 / S + pad);
        bottom = Math.max(vy0, vy1 - box.y1 / S - pad);
      }
      const embedded = await outDoc.embedPage(src.getPage(i - 1), { left, right, top, bottom });
      const rawW = (right - left) / PT_PER_MM, rawH = (top - bottom) / PT_PER_MM;
      const k = rawW > A4_MIN_WIDTH_MM ? A4_TO_A6_SCALE : 1; // A4 → A6
      // wMm/hMm là kích thước SAU khi quy về A6; drawPage bên dưới tự co theo đó.
      blocks.push({ embedded, wMm: rawW * k, hMm: rawH * k, scaled: k !== 1 });
    }
  } finally {
    pdf.destroy();
  }
  return blocks;
}

// groups/opts giống downloadShipLabels (source "top" = mọi đơn đang xử lý,
// "batch" = chỉ các đơn đã tích).
async function mergeShipLabels(groups, opts = {}){
  const source = opts.source || "top";
  if(groups.length === 0){ showError("Không có phiếu giao nào để gộp."); return; }
  if(!window.PDFLib){
    showError("Chưa tải được thư viện ghép PDF (cần mạng) — hãy tải lại trang rồi thử lại.");
    return;
  }
  const { PDFDocument, rgb } = window.PDFLib;
  labelBusy = true;
  setLabelButtonsDisabled(true);
  const failed = [];
  try{
    const out = await PDFDocument.create();
    const blocks = [];
    for(let i = 0; i < groups.length; i++){
      setLabelProgress(source, "merge", i + 1, groups.length);
      try{
        const res = await fetch(groups[i].shipLabelUrl);
        if(!res.ok) throw new Error("HTTP " + res.status);
        blocks.push(...await extractLabelBlocks(await res.arrayBuffer(), out, PDFDocument));
      }catch(e){
        failed.push(groups[i].orderName || "(đơn chưa có mã)");
      }
    }
    if(blocks.length === 0) throw new Error("không ghép được phiếu nào");

    const stripWmm = Math.max(...blocks.map(b => b.wMm)); // rộng = phiếu rộng nhất của lần gộp này
    const pages = layoutStrips(blocks.map(b => ({ h: b.hMm })), STRIP_GAP_MM, STRIP_MAX_H_MM);
    pages.forEach(pg => {
      const page = out.addPage([stripWmm * PT_PER_MM, pg.height * PT_PER_MM]);
      pg.items.forEach((it, n) => {
        const b = blocks[it.index];
        page.drawPage(b.embedded, {
          x: 0,
          y: (pg.height - it.top - b.hMm) * PT_PER_MM,
          width: b.wMm * PT_PER_MM,
          height: b.hMm * PT_PER_MM,
        });
        if(n > 0){ // đường kẻ cắt nét đứt, nằm GIỮA khe giữa phiếu này và phiếu ngay trên
          const yLine = (pg.height - it.top + STRIP_GAP_MM / 2) * PT_PER_MM;
          page.drawLine({
            start: { x: 0, y: yLine },
            end: { x: stripWmm * PT_PER_MM, y: yLine },
            thickness: 0.6,
            color: rgb(0.25, 0.25, 0.25),
            dashArray: [4, 3],
          });
        }
      });
    });

    const bytes = await out.save();
    const blobUrl = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    const d = new Date(), pad2 = n => String(n).padStart(2, "0");
    const stamp = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = `phieu-giao-gop-${stamp}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);

    let msg = `Đã gộp ${blocks.length} phiếu thành ${pages.length} trang, rộng ${Math.round(stripWmm)} mm, cao ${pages.map(p => Math.round(p.height)).join(" + ")} mm. Đường kẻ nét đứt giữa các phiếu là đường cắt.`;
    const nScaled = blocks.filter(b => b.scaled).length;
    if(nScaled){
      msg += ` Có ${nScaled} phiếu khổ A4 (thường là TikTok) đã tự thu về 50% = khổ A6 để cả dải cùng cỡ; in đúng kích thước thực (100%), không chọn "vừa trang".`;
    }
    if(failed.length) msg += ` Không ghép được: ${failed.join(", ")}.`;
    if(opts.skipNote) msg += ` ${opts.skipNote}`;
    showNotice(msg);
  }catch(e){
    showError("Không gộp được phiếu giao: " + e.message);
  }finally{
    labelBusy = false;
    setLabelButtonsDisabled(false);
    updateLabelButtons();
    updateBatchBar();
  }
}
mergeLabelsBtn.addEventListener("click", () => mergeShipLabels(getActiveLabelGroups(), { source: "top" }));

// Nút trên thanh chọn: chỉ xử lý phiếu của các đơn đang tích.
function batchLabelJob(run){
  const { groups, missing } = getSelectedLabelGroups();
  const skipNote = missing ? `${missing} đơn đã chọn chưa có phiếu giao nên bị bỏ qua.` : "";
  if(groups.length === 0){ showError("Các đơn đã chọn chưa có phiếu giao nào."); return; }
  run(groups, { source: "batch", skipNote });
}
batchDownloadPdfBtn.addEventListener("click", () => batchLabelJob(downloadShipLabels));
batchMergePdfBtn.addEventListener("click", () => batchLabelJob(mergeShipLabels));

async function renameOrder(orderId, newName){
  // Để trống là hợp lệ — không còn ép về mã tự sinh nữa, đơn trống tên sẽ
  // hiện placeholder "┈┈┈┈┈┈┈┈┈" (xem renderOrderName()).
  const n = (newName || "").trim() || null;
  const items = allTasks.filter(t => t.orderId === orderId);
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { orderName: n, updatedAt: serverTimestamp() });
    }
    editingOrderIds.delete(orderId);
    render();
  }catch(e){ showError("Không đổi được tên đơn: " + e.message); }
}

// Ghi carrier lên mọi item cùng orderId — cùng cơ chế denormalized với
// renameOrder() ở trên. Dùng khi tự nhận diện được hãng lúc tải phiếu giao
// lên (uploadShipLabel), và có thể tái dùng sau này nếu cần sửa tay khi
// nhận sai hãng.
async function setOrderCarrier(orderId, carrier, customName){
  const items = allTasks.filter(t => t.orderId === orderId);
  // carrierName chỉ có nghĩa khi carrier === "custom" — các trường hợp khác xóa đi.
  const carrierName = carrier === CARRIER_CUSTOM ? ((customName || "").trim() || null) : null;
  if(carrier === CARRIER_CUSTOM && !carrierName) carrier = "unknown";
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { carrier: carrier || null, carrierName, updatedAt: serverTimestamp() });
    }
    render();
  }catch(e){ showError("Không ghi được đơn vị vận chuyển: " + e.message); }
}

// ---- Batch actions ----
function updateBatchBar(){
  const n = selected.size;
  if(!labelBusy) batchCountEl.textContent = n + " đã chọn"; // đang tải/gộp thì ô này đang hiện tiến độ
  const doneBtn = document.getElementById("batchDone");
  // Tab "Đã bàn giao" là bước cuối nên không có thao tác chuyển tiếp hàng loạt.
  if(currentTab === "xong"){
    doneBtn.style.display = "none";
  } else {
    doneBtn.style.display = "inline-flex";
    doneBtn.textContent = currentTab === "in" ? "Đã in xong" : "Đã bàn giao";
  }
  // 2 nút PDF: chỉ ở 2 tab đang xử lý (giống 2 nút đầu danh sách), mờ đi khi
  // các đơn đã chọn chưa có phiếu giao nào.
  const pdfGroup = document.getElementById("batchPdfGroup");
  pdfGroup.style.display = currentTab === "xong" ? "none" : "flex";
  if(currentTab !== "xong" && n > 0){
    const { groups } = getSelectedLabelGroups();
    const has = groups.length > 0;
    if(!labelBusy){ batchDownloadPdfBtn.disabled = !has; batchMergePdfBtn.disabled = !has; }
    batchDownloadPdfBtn.title = has ? `Tải ${groups.length} phiếu giao đã chọn` : "Các đơn đã chọn chưa có phiếu giao";
    batchMergePdfBtn.title = has ? `Gộp ${groups.length} phiếu giao đã chọn thành 1 file` : "Các đơn đã chọn chưa có phiếu giao";
  }
  batchbar.classList.toggle("show", n > 0);
}

document.getElementById("batchDone").addEventListener("click", async () => {
  const ids = Array.from(selected);
  try{
    for(const id of ids){
      const t = allTasks.find(x => x.id === id);
      if(t) await advanceStatus(t);
    }
  }catch(e){ showError("Lỗi khi xử lý theo lô: " + e.message); }
  selected.clear();
  updateBatchBar();
});

document.getElementById("batchDel").addEventListener("click", async () => {
  if(!confirm("Xóa " + selected.size + " mục đã chọn?")) return;
  const ids = Array.from(selected);
  const emptiedOrders = orderIdsBecomingEmpty(ids);
  try{
    for(const id of ids){
      await deleteDoc(doc(db, "tasks", id));
    }
    for(const oid of emptiedOrders) await deleteShipLabelFileIfExists(oid);
  }catch(e){ showError("Không xóa được các mục đã chọn: " + e.message); }
  selected.clear();
  updateBatchBar();
});
</script>
