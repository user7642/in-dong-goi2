<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quản lý In & Đóng gói</title>
<!-- BUILD MARKER: best-carrier-custom-v1 — 2026-10-02
     Dùng để xác nhận bản deploy trên GitHub Pages đã cập nhật code lightbox
     mới nhất hay chưa: mở "View Page Source" (Ctrl+U) trên trang thật, tìm
     chuỗi "BUILD MARKER" — nếu thấy đúng nhãn này (best-carrier-custom-v1)
     nghĩa là bản mới đã lên; nếu thấy nhãn khác/không thấy dòng này nghĩa
     là GitHub Pages / trình duyệt vẫn đang phục vụ bản cache cũ. Mỗi lần
     đẩy thay đổi thật sự lên, đổi số hiệu (v1 -> v2...) để so sánh nhanh. -->
<style>
  /* ---- Hệ thống theme (giống catalog.html): DARK MODE là mặc định khai báo
     trong :root, LIGHT MODE chỉ bật khi <body> có class .light-theme (nút tròn
     góc trên-phải gắn/gỡ class này; lựa chọn lưu localStorage, dùng CHUNG khóa
     'theme-preference' với catalog.html nên 2 trang luôn cùng chế độ). Mọi rule
     bên dưới dùng var(--...) nên đổi biến ở 2 khối này là đổi cả trang. ---- */
  :root{
    --bg:#0f1115; --card:#1a1d23; --border:#2d3138; --text:#e8eaed; --muted:#9aa3af;
    --blue:#3b82f6; --blue-bg:#1e3a5f; --green:#34d399; --green-bg:#123524; --red:#f87171; --red-bg:#3a1a1a; --gray-bg:#262a32;
    --amber:#fbbf24; --amber-bg:#3a2f14;
    --input-bg:#20242b; --row-bg:#171a20; --notice-border:#2f5a94; --err-border:#6b2b2b;
    --bar-bg:#262b34; --bar-border:rgba(255,255,255,.1); --warn:#f87171;
    --green-solid:#15803d; --red-solid:#dc2626;
    --shadow:rgba(0,0,0,.45);
    --maxw:680px;
  }
  body.light-theme{
    --bg:#f5f6f7; --card:#ffffff; --border:#e2e4e7; --text:#1a1d21; --muted:#6b7280;
    --blue:#2563eb; --blue-bg:#eaf1ff; --green:#15803d; --green-bg:#e8f7ec; --red:#dc2626; --red-bg:#fde8e8; --gray-bg:#eceef0;
    --amber:#b45309; --amber-bg:#fef3e0;
    --input-bg:#ffffff; --row-bg:#fafbfc; --notice-border:#bcd0f7; --err-border:#f5b8b8;
    --bar-bg:#1a1d21; --bar-border:transparent; --warn:#d92d20;
    --green-solid:#15803d; --red-solid:#dc2626;
    --shadow:rgba(0,0,0,.12);
  }
  /* Nút tròn chuyển chế độ sáng/tối — cố định góc trên-phải màn hình. */
  .theme-toggle{
    position:fixed;top:14px;right:14px;z-index:40;
    width:40px;height:40px;border-radius:50%;
    background:var(--card);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;line-height:1;cursor:pointer;padding:0;
    box-shadow:0 2px 10px var(--shadow);
    transition:transform .2s ease,background-color .2s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .theme-toggle:hover{transform:scale(1.08) rotate(8deg);}
  }
  @media (max-width:420px){
    .theme-toggle{width:34px;height:34px;font-size:15px;top:10px;right:10px;}
  }
  /* Ô nhập liệu theo theme (trước đây dùng nền trắng mặc định của trình duyệt) */
  input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select{
    background:var(--input-bg);color:var(--text);
  }
  ::placeholder{color:var(--muted);opacity:.8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:90px;
  }
  /* header, thanh addbar/searchbar sticky, main, footer-style bars đều dùng
     chung 1 độ rộng tối đa (--maxw), canh giữa — để trên desktop các khối
     thẳng hàng nhau thay vì header/thanh công cụ chạy full-width còn danh
     sách bên dưới bị bó hẹp lại trông lệch. */
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 16px 0 16px;
    position:sticky;
    top:0;
    z-index:20;
    max-width:var(--maxw);
    margin:0 auto;
  }
  h1{font-size:18px;margin:0 0 12px 0;font-weight:600;}
  .tabs{display:flex;gap:6px;}
  .tab{
    flex:1;
    text-align:center;
    padding:12px 4px;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    border-bottom:3px solid transparent;
    cursor:pointer;
    user-select:none;
  }
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .count-badge{
    display:inline-block;
    background:var(--border);
    color:var(--text);
    border-radius:10px;
    font-size:12px;
    padding:1px 7px;
    margin-left:5px;
  }
  .tab.active .count-badge{background:var(--blue);color:#fff;}

  .addbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    gap:8px;
    position:sticky;
    top:53px;
    z-index:19;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .addbar input[type=text]{
    flex:1;
    min-width:0;
    font-size:16px;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }
  .addbar input[type=number]{
    width:64px;
    font-size:16px;
    padding:11px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    text-align:center;
  }
  .addbar button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
  }

  .searchbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:8px 16px;
    position:sticky;
    top:106px;
    z-index:18;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .searchbar input{
    width:100%;
    font-size:15px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }

  .quicklink{padding:10px 12px 0 12px;}
  .quicklink a{
    display:block;
    text-align:center;
    background:var(--blue-bg);
    color:var(--blue);
    font-weight:600;
    font-size:14px;
    padding:11px 12px;
    border-radius:8px;
    text-decoration:none;
  }

  main{padding:12px 12px 0 12px;max-width:var(--maxw);margin:0 auto;}
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }

  .noticebox{
    background:var(--blue-bg);
    color:var(--text);
    border:1px solid var(--notice-border);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    line-height:1.45;
    margin-bottom:10px;
  }
  .errbox{
    background:var(--red-bg);
    color:var(--red);
    border:1px solid var(--err-border);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    margin-bottom:10px;
  }

  /* ---- Order box (grouping) — thẻ tóm tắt kiểu Shopee ---- */
  .order-box{
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
    background:var(--card);
    cursor:pointer;
  }
  .order-box.warn{border-color:var(--amber);}
  .order-box.ready{border-color:var(--green);}

  .order-summary-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;background:var(--row-bg);border-bottom:1px solid var(--border);
    font-size:12.5px;
  }
  .order-time{color:var(--muted);}
  .order-status-badge{font-weight:700;}
  .order-status-badge.st-warn{color:var(--amber);}
  .order-status-badge.st-info{color:var(--blue);}
  .order-status-badge.st-ready{color:var(--green);}

  .thumb-placeholder{
    width:72px;height:72px;flex-shrink:0;border-radius:8px;
    background:var(--gray-bg);display:flex;align-items:center;justify-content:center;
    font-size:26px;color:var(--muted);overflow:hidden;
    cursor:pointer;transition:opacity .12s;
  }
  .thumb-placeholder:active{opacity:.7;}
  .thumb-placeholder img{width:100%;height:100%;object-fit:cover;display:block;}

  /* Lightbox — bấm vào ảnh phân loại trong danh sách để phóng to, tránh
     nhầm giữa các phân loại có tông màu giống nhau khi nhìn ở ảnh tí hon. */
  .thumb-lightbox-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:tlbFadeIn .12s ease-out;
  }
  @keyframes tlbFadeIn{from{opacity:0;}to{opacity:1;}}
  .thumb-lightbox-box{
    position:relative;background:var(--card);border-radius:12px;max-width:min(1100px,94vw);max-height:94vh;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .thumb-lightbox-imgwrap{
    background:var(--gray-bg);display:flex;align-items:center;justify-content:center;
    max-height:82vh;overflow:hidden;
  }
  .thumb-lightbox-imgwrap img{max-width:100%;max-height:82vh;display:block;object-fit:contain;}
  .thumb-lightbox-imgwrap .thumb-lightbox-noimg{font-size:48px;color:var(--muted);padding:60px;}
  .thumb-lightbox-info{padding:12px 14px;border-top:1px solid var(--border);}
  .thumb-lightbox-title{font-weight:700;font-size:15px;color:var(--text);}
  .thumb-lightbox-classification{font-size:13px;color:var(--muted);margin-top:2px;}
  .thumb-lightbox-close{
    position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;border:none;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
    -webkit-tap-highlight-color:transparent;
  }
  .thumb-lightbox-close:active{background:rgba(0,0,0,.75);}

  /* Preview khi rê chuột (chỉ desktop/thiết bị có hover thật — xem
     supportsHoverPreview trong JS) — hiện ảnh to ngay cạnh con trỏ mà
     KHÔNG cần bấm, nhanh hơn lightbox khi chỉ muốn liếc qua nhiều dòng
     liên tiếp. Bấm vẫn mở lightbox đầy đủ như cũ (hữu ích trên mobile). */
  .thumb-hover-preview{
    position:fixed;z-index:1001;pointer-events:none;
    background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 36px rgba(0,0,0,.32);
    overflow:hidden;width:420px;opacity:0;transform:translateY(4px);
    transition:opacity .1s,transform .1s;
  }
  .thumb-hover-preview.show{opacity:1;transform:translateY(0);}
  .thumb-hover-preview img{width:100%;height:420px;object-fit:cover;display:block;background:var(--gray-bg);}
  .thumb-hover-preview .thumb-hover-info{padding:10px 12px;border-top:1px solid var(--border);}
  .thumb-hover-preview .thumb-hover-title{font-weight:700;font-size:14px;color:var(--text);}
  .thumb-hover-preview .thumb-hover-classification{font-size:12.5px;color:var(--muted);margin-top:2px;}

  .order-item-summary{
    display:flex;gap:10px;align-items:flex-start;
    padding:10px 12px;border-bottom:1px solid var(--border);
  }
  .order-item-summary:last-of-type{border-bottom:none;}
  .order-item-summary input[type=checkbox]{width:20px;height:20px;flex-shrink:0;margin-top:4px;accent-color:var(--blue);}
  .info-summary{flex:1;min-width:0;}
  /* Tiêu đề: 1 dòng, dài quá thì ẩn bớt (ellipsis) — giống kiểu Shopee. */
  /* Tiêu đề + chip "File in" nằm chung 1 hàng flex: chữ tiêu đề (.name-text)
     co lại và hiện "…" khi dài, còn chip flex:none nên LUÔN còn chỗ. Trước đây
     chip nằm lẫn trong dòng chữ có overflow:hidden → màn hình hẹp bị cắt mất. */
  .name-summary{
    display:flex;align-items:center;gap:6px;
    font-size:14px;font-weight:600;line-height:1.35;
  }
  .name-summary .name-text{
    flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* Dòng dưới: phân loại bên trái (ẩn bớt nếu dài) + số lượng bên phải,
     luôn giữ chỗ cố định cho SL để không bao giờ bị đẩy mất. */
  .meta-row-summary{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:3px;
  }
  .classification-summary{
    flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:12.5px;color:var(--muted);
  }
  .qty-summary{
    flex-shrink:0;font-size:12.5px;color:var(--muted);
  }

  .order-summary-footer{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 12px;border-bottom:1px solid var(--border);
    font-size:12.5px;color:var(--muted);background:var(--row-bg);
  }
  .order-summary-footer b{color:var(--text);}

  .order-code-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 12px;border-bottom:1px solid var(--border);font-size:12.5px;
  }
  .order-code-row .code-label{color:var(--muted);}
  /* Nhãn + nút tải phiếu giao nằm cạnh nhau ở bên trái dòng "Mã đơn hàng". */
  .order-code-row .code-label-wrap{display:flex;align-items:center;gap:4px;}
  .code-dl-btn{
    border:none;background:none;color:var(--blue);cursor:pointer;padding:2px 4px;
    display:inline-flex;align-items:center;line-height:0;border-radius:6px;
  }
  .code-dl-btn:hover{background:var(--blue-bg);}
  .code-dl-btn svg{width:16px;height:16px;}
  .order-code-row .code-value{font-weight:600;display:flex;align-items:center;gap:6px;}
  .ship-label-chip{font-size:12px;margin-left:2px;}
  /* Placeholder cho đơn chưa có mã vận đơn thật — cố tình KHÔNG dùng chuỗi
     ký tự giả nữa (xem renderOrderName() trong script). Độ rộng cân đối do
     CSS quyết định, không phụ thuộc số ký tự của mã thật (mỗi hãng dài ngắn
     khác nhau: GHN ~8 ký tự, SPX ~18 ký tự...). */
  .order-name-placeholder{color:var(--border);font-weight:400;letter-spacing:1px;}

  .order-status-line{font-size:11.5px;text-align:center;padding:6px 12px;color:var(--muted);border-bottom:1px solid var(--border);}
  .order-status-line.warn{color:var(--amber);font-weight:600;}
  .order-status-line.ready{color:var(--green);font-weight:600;}

  .order-summary-actions{display:flex;gap:8px;padding:10px 12px;}
  .order-summary-actions button{
    flex:1;border:none;border-radius:8px;padding:10px 8px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .order-summary-actions .ship-quick-btn{background:var(--gray-bg);color:var(--text);}
  /* Đơn chưa có phiếu giao: nút xám nhạt để người in biết chưa in được (vẫn bấm
     được để quản lý mở khu vực tải phiếu lên). */
  .order-summary-actions .ship-quick-btn.no-label{background:var(--gray-bg);color:var(--muted);font-weight:500;}
  .order-summary-actions .order-primary-btn{background:var(--blue);color:#fff;}
  .order-summary-actions .order-primary-btn.green{background:var(--green-solid);}

  /* Header đơn hàng: bấm vào để mở/đóng khu vực phiếu giao + ghi chú (thay
     cho việc mở trang chi tiết toàn màn hình như trước). */
  .order-summary-header{cursor:pointer;user-select:none;}
  .order-header-right{display:flex;align-items:center;gap:6px;}
  .header-dot{font-size:12px;line-height:1;}
  .expand-arrow{font-size:10px;color:var(--muted);margin-left:2px;}

  /* ---- Tab "Chờ bàn giao" + "Đã bàn giao": thanh chuyển chế độ xem + chip lọc theo hãng ---- */
  .carrierBar{
    display:none;flex-direction:column;gap:8px;
    padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);
    max-width:var(--maxw);margin:0 auto;
  }
  .carrierViewToggle{
    align-self:flex-start;border:1px solid var(--border);background:var(--gray-bg);
    color:var(--text);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;
    cursor:pointer;
  }
  .carrierChips{display:flex;gap:6px;flex-wrap:wrap;}
  .carrierChip{
    border:1px solid var(--border);background:var(--card);color:var(--text);
    border-radius:14px;padding:5px 10px;font-size:12.5px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;gap:5px;
  }
  .carrierChip .n{color:var(--muted);font-weight:400;}
  .carrierChip.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .carrierChip.active .n{color:#dbe8ff;}

  /* ---- Accordion nhóm theo hãng (chế độ xem "Nhóm theo hãng") ---- */
  .carrierGroup{margin-bottom:12px;}
  .carrierGroupHead{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--gray-bg);border-radius:10px;padding:12px 14px;
    cursor:pointer;user-select:none;font-weight:600;font-size:14px;
  }
  .carrierGroupHeadRight{display:flex;align-items:center;gap:8px;}
  .carrierGroupHead .carrierGroupCount{color:var(--muted);font-weight:400;font-size:12.5px;}
  .carrierGroupHead .expand-arrow{margin-left:2px;}
  .carrierGroupBody{padding-top:10px;}

  /* Dòng xem trước ghi chú chung của cả đơn — luôn hiện ngay dưới header,
     không cần mở khu vực mở rộng mới thấy. */
  .order-note-preview{
    font-size:12.5px;color:var(--blue);background:var(--blue-bg);
    padding:7px 12px;word-break:break-word;border-bottom:1px solid var(--border);
  }

  /* Khu vực mở rộng: phiếu giao (đính kèm PDF, dùng chung cho cả đơn, không
     theo từng sản phẩm) + ghi chú chung của đơn — chỉ hiện khi bấm header. */
  .order-expand-panel{border-bottom:1px solid var(--border);background:var(--row-bg);}
  .ship-label-row{
    padding:9px 12px;
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  }
  /* Icon-only, gọn gàng: mọi nút trong khu vực mở rộng chỉ có icon, không chữ. */
  .icon-btn{
    border:none;border-radius:8px;width:40px;height:40px;font-size:17px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;
  }
  .icon-btn.attach-btn{background:var(--blue-bg);color:var(--blue);}
  .icon-btn.view-btn{background:var(--gray-bg);color:var(--text);}
  .icon-btn.download-btn{background:var(--green-bg);color:var(--green);}
  .icon-btn.remove-btn{background:var(--red-bg);color:var(--red);}
  .icon-btn.note-btn{background:var(--gray-bg);color:var(--text);}
  .icon-btn.note-btn.has-note{background:var(--blue-bg);color:var(--blue);}
  .icon-btn[disabled]{opacity:.6;cursor:default;}

  .edit-icon-btn{
    border:none;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 4px;
  }
  input.order-title-input{
    font-size:13px;font-weight:700;border:1px solid var(--blue);border-radius:6px;
    padding:6px 8px;flex:1;min-width:0;
  }
  .save-icon{
    border:none;background:var(--blue);color:#fff;border-radius:6px;
    padding:6px 9px;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;
  }
  select.order-carrier-select{
    font-size:13px;font-weight:700;border:1px solid var(--blue);border-radius:6px;
    padding:6px 8px;flex:1;min-width:0;background:var(--input-bg);color:var(--text);
  }

  .note-box{padding:0 12px 10px;}
  .note-box textarea{
    width:100%;font-size:13px;padding:8px 9px;border:1px solid var(--border);
    border-radius:8px;min-height:54px;font-family:inherit;
  }
  .note-box .note-save{
    margin-top:5px;font-size:12px;padding:6px 11px;border:none;border-radius:6px;

<script>
// ---- Chuyển chế độ sáng/tối (giống catalog.html) ----
// Mặc định DARK; bấm nút gắn/gỡ class "light-theme" trên <body>. Lựa chọn lưu
// localStorage khóa 'theme-preference' (chung với catalog.html) và được áp lại
// ngay khi script chạy, trước khi trang hiện ra → không chớp sai theme. Nếu môi
// trường chặn localStorage thì bỏ qua việc lưu, trang vẫn chạy bình thường.
(function(){
  var STORAGE_KEY = 'theme-preference';
  var body = document.body;
  var btn = document.getElementById('themeToggleBtn');
  function readStored(){ try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; } }
  function writeStored(v){ try{ localStorage.setItem(STORAGE_KEY, v); }catch(e){} }
  var stored = readStored();
  if(stored === 'light') body.classList.add('light-theme');
  else if(stored === 'dark') body.classList.remove('light-theme');
  function render(){
    var isLight = body.classList.contains('light-theme');
    btn.textContent = isLight ? '☀️' : '🌙';
    btn.title = isLight ? 'Chuyển sang chế độ tối' : 'Chuyển sang chế độ sáng';
  }
  btn.addEventListener('click', function(){
    body.classList.toggle('light-theme');
    writeStored(body.classList.contains('light-theme') ? 'light' : 'dark');
    render();
  });
  render();
})();
</script>

<script type="module">

// Cloud Storage for Firebase hiện bắt buộc gói Blaze (cần khai thẻ). Cloudinary

// MẶC ĐỊNH (lần đầu, chưa từng bấm nút chuyển) là "time" = xem theo thời gian.
let carrierViewMode = localStorage.getItem("carrierViewMode") || "time";
// Tab nào có thanh nhóm/lọc theo hãng.
function hasCarrierView(){ return currentTab === "dong_goi" || currentTab === "xong"; }
// Lọc nhanh theo 1 hãng cụ thể (áp dụng ở cả 2 chế độ xem) — "all" = không lọc.
let carrierFilter = "all";
// Các nhóm hãng đang mở (accordion) — mặc định TẤT CẢ đều gập.
let expandedCarrierGroups = new Set();

// UI-only ephemeral state (reset on re-render is fine; kept across snapshots via Sets keyed by id)
let editingOrderIds = new Set();
// orderId đang mở ô chỉnh sửa hãng vận chuyển (dòng "Đơn vị VC:") — tách
// riêng Set với editingOrderIds vì đây là 1 dòng khác (select thay vì input text).
let editingCarrierIds = new Set();
// orderId đang trong lúc tải lên phiếu giao (để hiện trạng thái "Đang tải lên...")
let uploadingShipLabelIds = new Set();
// orderId đang mở khu vực mở rộng (phiếu giao + ghi chú) ngay trên thẻ tóm tắt
// — thay cho việc mở trang "Chi tiết đơn hàng" toàn màn hình như trước.
let expandedOrderIds = new Set();
// orderId đang mở ô nhập ghi chú (nằm trong khu vực mở rộng ở trên).

const batchMergePdfBtn = document.getElementById("batchMergePdf");

// Thông báo thông tin (không phải lỗi), hiện lâu hơn để kịp đọc.
function showNotice(msg){

// ---- Helper: commit an edit (save) either on explicit click or on click-away ----
// Attaches a "focusout" listener to containerEl; if focus moves to something
// outside containerEl, commitFn() runs automatically (click ra ngoài = lưu & đóng).
// The returned function can be wired to a "Lưu" button so both paths share
// the same one-shot commit (no double-submit).
function attachClickAwayCommit(containerEl, commitFn){
  let committed = false;
  const commit = () => {
    if(committed) return;
    committed = true;
    commitFn();
  };
  containerEl.addEventListener("focusout", () => {
    setTimeout(() => {
      if(!containerEl.isConnected) return; // already closed/removed (e.g. Hủy)
      if(!containerEl.contains(document.activeElement)) commit();
    }, 0);
  });
  return commit;
}

// ---- Helpers: id generation for orders ----
function newOrderId(){ return "o_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
// Không còn sinh "tên tự động" giả (kiểu "#ABC123XYZ") cho đơn chưa đặt tên

// orderName trống được render bằng placeholder CSS "┈┈┈┈┈┈┈┈┈" (class

// tự giả — tránh gây hiểu lầm với mã vận đơn thật, và không phụ thuộc vào
// việc "đoán" độ dài mã thật (mã thật của mỗi hãng dài ngắn khác nhau).
function renderOrderName(name){
  const n = (name || "").trim();
  return n ? escapeHtml(n) : '<span class="order-name-placeholder">┈┈┈┈┈┈┈┈┈</span>';
}
function isBlankOrderName(name){ return !((name || "").trim()); }

// ---- Tabs ----
document.querySelectorAll(".tab").forEach(t => {

    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));

    clearAllBtn.style.display = currentTab === "xong" ? "inline-block" : "none";

});
addbar.style.display = "flex";

// ---- Chọn tất cả ----
selectAllBox.addEventListener("change", () => {
  const shown = getShown();
  if(selectAllBox.checked) shown.forEach(t => selected.add(t.id));
  else shown.forEach(t => selected.delete(t.id));
  updateBatchBar();
  render();
});

// ---- Làm sạch (xóa toàn bộ sản phẩm đã bàn giao) ----
clearAllBtn.addEventListener("click", async () => {
  const items = allTasks.filter(t => t.status === "xong");
  if(items.length === 0) return;
  if(!confirm(`Xóa toàn bộ ${items.length} sản phẩm đã bàn giao? Không thể hoàn tác.`)) return;
  try{
    for(const it of items){
      await deleteDoc(doc(db, "tasks", it.id));
    }
    selected.clear();
    updateBatchBar();
  }catch(e){ showError("Không làm sạch được danh sách: " + e.message); }
});

// ---- Search ----
document.getElementById("searchTask").addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();

});

// ---- Add task ----
document.getElementById("addBtn").addEventListener("click", addTask);
document.getElementById("newName").addEventListener("keydown", e => { if(e.key === "Enter") addTask(); });

async function addTask(){
  const nameEl = document.getElementById("newName");
  const qtyEl = document.getElementById("newQty");
  const name = nameEl.value.trim();
  // Chặn số lượng âm/0/thập phân gõ tay (thuộc tính min="1" trên input chỉ
  // là gợi ý UI, không chặn được người dùng gõ số âm bằng bàn phím) — ép về
  // tối thiểu 1 nếu giá trị không hợp lệ hoặc nhỏ hơn 1.
  const qty = Math.max(1, parseInt(qtyEl.value) || 1);
  if(!name) return;
  try{
    await addDoc(tasksCol, {
      name, qty,
      status: "cho_in",
      note: "",
      orderId: newOrderId(),
      orderName: null,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    nameEl.value = "";
    qtyEl.value = "1";
    nameEl.focus();
  }catch(e){
    showError("Không thêm được việc mới: " + e.message);
  }
}

onSnapshot(q, snap => {

}, err => {

// không còn thực hiện được an toàn từ trình duyệt nữa (Cloudinary yêu cầu ký

// file PDF cũ trên Cloudinary sẽ "mồ côi" (không tự dọn). Vì file phiếu giao
// rất nhẹ và gói free Cloudinary có 25GB/tháng, việc này không đáng ngại —
// đây là đánh đổi đã thống nhất để tránh phải khai thẻ cho Firebase Blaze.

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Định dạng thời gian tạo đơn kiểu "14:32, 26/07" — thay cho tên người mua
// (dữ liệu không có) trên thẻ tóm tắt, giống vị trí đó ở giao diện Shopee.
function formatDT(ts){
  if(!ts || typeof ts.toDate !== "function") return "";
  const d = ts.toDate();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  const mo = String(d.getMonth() + 1).padStart(2, "0");
  return `${hh}:${mm}, ${dd}/${mo}`;
}

const STATUS_COLOR_CLASS = { in: "st-warn", dong_goi: "st-info", xong: "st-ready" };

// ---- Đơn vị vận chuyển ----
// Danh sách hãng đã nhận diện được từ mẫu phiếu thật (xem detectCarrierFromText).
// "unknown" đại diện cho các đơn chưa nhận diện được hãng (mẫu lạ, PDF ảnh
// scan không đọc được text, hoặc chưa đính phiếu giao) — vẫn xử lý như 1
// nhóm/carrier bình thường trong UI, chỉ khác là luôn xếp cuối danh sách.
// MUỐN THÊM HÃNG MỚI NHANH (không cần viết thêm logic): thêm 1 dòng vào
// CARRIER_LABEL + 1 key vào CARRIER_ORDER (trước "unknown"). Còn nếu chưa kịp
// sửa code thì người dùng vẫn tự ghi tên hãng bất kỳ qua tùy chọn "✏️ Khác
// (tự nhập)" ở ô Đơn vị VC — xem carrierKeyOf() bên dưới.
const CARRIER_LABEL = { "jt": "J&T Express", "spx": "SPX Express", "ghn": "Giao Hàng Nhanh", "best": "BEST Express", "unknown": "Chưa rõ hãng" };
const CARRIER_ORDER = ["jt", "spx", "ghn", "best", "unknown"]; // thứ tự cố định khi hiển thị nhóm — "unknown" luôn ở cuối
// Hãng do người dùng TỰ GÕ: lưu carrier = "custom" + carrierName = chữ tự gõ.
// Mỗi tên (không phân biệt hoa/thường) là 1 nhóm riêng, xếp sau các hãng đã
// biết và trước "unknown".
const CARRIER_CUSTOM = "custom";
const customCarrierNames = new Map(); // key "custom:<tên viết thường>" -> tên hiển thị (giữ nguyên hoa/thường)
// Khóa nhóm hãng của 1 {carrier, carrierName}: key đã biết | "custom:..." | "unknown".
function carrierKeyOf(c){
  const carrier = c && c.carrier, name = ((c && c.carrierName) || "").trim();
  if(carrier === CARRIER_CUSTOM && name){
    const key = CARRIER_CUSTOM + ":" + name.toLowerCase();
    if(!customCarrierNames.has(key)) customCarrierNames.set(key, name);
    return key;
  }
  return (carrier && CARRIER_LABEL[carrier]) ? carrier : "unknown";
}
function carrierLabelOf(key){
  if(CARRIER_LABEL[key]) return CARRIER_LABEL[key];
  return customCarrierNames.get(key) || CARRIER_LABEL.unknown;
}
// Sắp các key hiện có: hãng đã biết (theo CARRIER_ORDER) -> hãng tự nhập (A-Z) -> unknown.
function sortCarrierKeys(keys){
  const set = new Set(keys);
  const known = CARRIER_ORDER.filter(k => k !== "unknown" && set.has(k));
  const custom = keys.filter(k => !CARRIER_LABEL[k]).sort((a, b) => carrierLabelOf(a).localeCompare(carrierLabelOf(b), "vi"));
  return known.concat(custom, set.has("unknown") ? ["unknown"] : []);
}

// Chỉ bật preview-khi-rê-chuột trên thiết bị có hover thật + con trỏ chính
// xác (chuột desktop) — tránh tình trạng lag/kẹt overlay trên cảm ứng, nơi
// "hover" có thể bị trình duyệt giả lập khi chạm.
const supportsHoverPreview = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
let hoverPreviewEl = null;

function getHoverPreviewEl(){
  if(hoverPreviewEl) return hoverPreviewEl;
  hoverPreviewEl = document.createElement("div");
  hoverPreviewEl.className = "thumb-hover-preview";
  document.body.appendChild(hoverPreviewEl);
  return hoverPreviewEl;
}

function showHoverPreview(t, anchorEl){
  const { title, classification } = splitProductName(t.name);
  const el = getHoverPreviewEl();
  el.innerHTML = t.image
    ? `<img src="${t.image}" alt="">`
    : `<div class="thumb-lightbox-noimg" style="padding:80px 0;text-align:center;">🖼</div>`;
  el.innerHTML += `<div class="thumb-hover-info">
      <div class="thumb-hover-title"></div>
      <div class="thumb-hover-classification"></div>
    </div>`;
  el.querySelector(".thumb-hover-title").textContent = title;
  el.querySelector(".thumb-hover-classification").textContent = classification;

  // Đặt preview cạnh bên phải thumbnail; nếu không đủ chỗ (gần mép phải
  // màn hình) thì lật sang trái. Kẹp trong khung nhìn theo chiều dọc.
  const rect = anchorEl.getBoundingClientRect();
  const previewW = 420, previewH = 480, gap = 12;
  let left = rect.right + gap;
  if(left + previewW > window.innerWidth) left = rect.left - previewW - gap;
  left = Math.max(8, Math.min(left, window.innerWidth - previewW - 8));
  let top = rect.top;
  top = Math.max(8, Math.min(top, window.innerHeight - previewH - 8));
  el.style.left = left + "px";
  el.style.top = top + "px";
  el.classList.add("show");
}

function hideHoverPreview(){
  if(hoverPreviewEl) hoverPreviewEl.classList.remove("show");
}
// An toàn: nếu cuộn trang hoặc đổi tab trong lúc đang hover (element bị gỡ
// khỏi DOM giữa chừng khiến mouseleave không kịp bắn), ẩn preview theo để
// tránh ô nổi bị "kẹt" sai vị trí trên màn hình.
window.addEventListener("scroll", hideHoverPreview, true);
window.addEventListener("resize", hideHoverPreview);

// Khung ảnh sản phẩm — hiện ảnh thật nếu task có field "image" (URL, gán từ
// catalog.html), ảnh lỗi tự rơi về icon 🖼 mặc định thay vì để ô vỡ hình.
// Bấm vào ảnh sẽ mở lightbox phóng to (xem openThumbLightbox); trên desktop
// rê chuột qua cũng hiện preview to ngay lập tức (xem showHoverPreview) —
// các phân loại cùng sản phẩm (vd MS1/MS2/MS3) thường có tông màu giống
// nhau, ảnh tí hon 56-72px rất dễ nhìn nhầm, cần phóng to để người in xác
// nhận đúng mẫu trước khi in.
function renderThumb(t){
  const thumb = document.createElement("div");
  thumb.className = "thumb-placeholder";
  thumb.title = "Bấm để xem ảnh lớn";
  if(t.image){
    const img = document.createElement("img");
    img.src = t.image;
    img.alt = t.name || "";
    img.addEventListener("error", () => { thumb.innerHTML = ""; thumb.textContent = "🖼"; });
    thumb.appendChild(img);
  } else {
    thumb.textContent = "🖼";
  }
  thumb.addEventListener("click", e => {
    e.stopPropagation();
    hideHoverPreview();
    openThumbLightbox(t);
  });
  if(supportsHoverPreview){
    thumb.addEventListener("mouseenter", () => showHoverPreview(t, thumb));
    thumb.addEventListener("mouseleave", hideHoverPreview);
  }
  return thumb;
}

// Overlay phóng to ảnh phân loại — đóng bằng nút X, bấm ra ngoài, hoặc phím Esc.
function openThumbLightbox(t){
  const { title, classification } = splitProductName(t.name);
  const overlay = document.createElement("div");
  overlay.className = "thumb-lightbox-overlay";

  const box = document.createElement("div");
  box.className = "thumb-lightbox-box";

  const closeBtn = document.createElement("button");
  closeBtn.className = "thumb-lightbox-close";
  closeBtn.textContent = "✕";
  closeBtn.addEventListener("click", close);
  box.appendChild(closeBtn);

  const imgWrap = document.createElement("div");
  imgWrap.className = "thumb-lightbox-imgwrap";
  if(t.image){
    const img = document.createElement("img");
    img.src = t.image;
    img.alt = t.name || "";
    img.addEventListener("error", () => {
      imgWrap.innerHTML = `<div class="thumb-lightbox-noimg">🖼</div>`;
    });
    imgWrap.appendChild(img);
  } else {
    imgWrap.innerHTML = `<div class="thumb-lightbox-noimg">🖼</div>`;
  }
  box.appendChild(imgWrap);

  const info = document.createElement("div");
  info.className = "thumb-lightbox-info";
  info.innerHTML = `<div class="thumb-lightbox-title"></div><div class="thumb-lightbox-classification"></div>`;
  info.querySelector(".thumb-lightbox-title").textContent = title;
  info.querySelector(".thumb-lightbox-classification").textContent = classification;
  box.appendChild(info);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  // Khoá cuộn nền trong lúc lightbox mở — quan trọng trên mobile/tablet để
  // tránh trang phía sau trôi/nảy theo khi vuốt trong vùng overlay.
  const prevBodyOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";

  function close(){
    overlay.remove();
    document.body.style.overflow = prevBodyOverflow;
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e){ if(e.key === "Escape") close(); }
  overlay.addEventListener("click", e => { if(e.target === overlay) close(); });
  document.addEventListener("keydown", onKey);
}

// ---- Grouping helpers ----
function orderPackInfo(orderId){
  const items = allTasks.filter(t => t.orderId === orderId);
  const pending = items.filter(t => t.status === "cho_in").length;
  const readyToPack = items.filter(t => t.status === "cho_dong_goi").length;
  return {
    total: items.length,
    pending, readyToPack,
    eligible: pending === 0 && readyToPack > 0
  };
}

function groupShown(shown){
  const order = [];
  const map = new Map();
  shown.forEach(t => {
    const oid = t.orderId || t.id;
    if(!map.has(oid)){
      // Không còn fallback về t.name nữa: orderName rỗng phải hiện placeholder
      // "┈┈┈┈┈┈┈┈┈" (renderOrderName()) chứ không phải tên sản phẩm — trước
      // đây fallback này vô hại vì orderName luôn có giá trị (mã "#..." tự
      // sinh), giờ orderName có thể thật sự rỗng nên phải bỏ fallback.
      map.set(oid, { orderId: oid, orderName: t.orderName || null, carrier: null, carrierName: "", shipLabelUrl: "", note: "", items: [] });
      order.push(oid);
    }
    const g = map.get(oid);
    // shipLabelUrl/note/carrier được ghi lặp lên mọi item cùng orderId (giống
    // orderName) — chỉ cần lấy giá trị đầu tiên tìm thấy trong cả nhóm.
    if(!g.shipLabelUrl && t.shipLabelUrl) g.shipLabelUrl = t.shipLabelUrl;
    if(!g.note && t.note) g.note = t.note;
    if(!g.carrier && t.carrier) g.carrier = t.carrier;
    if(!g.carrierName && t.carrierName) g.carrierName = t.carrierName;
    g.items.push(t);
  });
  return order.map(oid => map.get(oid));
}

// Cho biết những orderId nào sẽ KHÔNG còn item nào sau khi xóa các id trong
// deletedIds — dùng để biết đơn nào "trống hẳn" (từ đó dọn phiếu giao đính
// kèm nếu cần). So sánh trên allTasks HIỆN TẠI (trước khi xóa thật sự), nên
// phải gọi hàm này trước khi deleteDoc(), không phải sau.
function orderIdsBecomingEmpty(deletedIds){
  const deletedSet = new Set(deletedIds);
  const affectedOrderIds = new Set(
    allTasks
      .filter(t => deletedSet.has(t.id))
      .map(t => t.orderId || t.id)
  );
  const result = [];
  affectedOrderIds.forEach(oid => {
    const remaining = allTasks.some(t => t.orderId === oid && !deletedSet.has(t.id));
    if(!remaining) result.push(oid);
  });
  return result;
}

// ---- Render ----
// Trả về danh sách task theo TAB + TỪ KHÓA TÌM KIẾM — CHƯA áp dụng lọc theo
// hãng vận chuyển (xem applyCarrierFilter()). Tách riêng để carrierBar luôn
// tính được tổng số đúng của từng hãng, không bị chính bộ lọc của nó che mất.
function getShown(){
  let shown;
  if(currentTab === "in") shown = allTasks.filter(t => t.status === "cho_in");
  else if(currentTab === "dong_goi") shown = allTasks.filter(t => t.status === "cho_dong_goi");
  // Không giới hạn số mục ở client: tập dữ liệu status=xong không còn tự dọn
  // theo thời gian nữa (đã bỏ cơ chế hết hạn 7 ngày) — người dùng tự xóa thủ
  // công qua nút "Dọn dẹp" khi cần.
  else shown = allTasks.filter(t => t.status === "xong").slice().reverse(); // mới bàn giao xếp trước

  if(searchTerm) shown = shown.filter(matchesSearch);
  return shown;
}

// 1 task có khớp từ khóa tìm kiếm hiện tại không (tên, mã đơn hoặc ghi chú).
function matchesSearch(t){
  return (t.name || "").toLowerCase().includes(searchTerm) ||
    (t.orderName || "").toLowerCase().includes(searchTerm) ||
    (t.note || "").toLowerCase().includes(searchTerm);
}

// Các đơn ĐANG XỬ LÝ có phiếu giao = tab "Chờ xử lý" + tab "Chờ bàn giao" gộp
// chung (mỗi đơn 1 lần, đơn ở tab 1 xếp trước), có áp từ khóa tìm kiếm. Dùng
// chung cho nút "Tải tất cả phiếu giao" và "Gộp 1 file PDF". Không áp bộ lọc
// hãng. Tab "Đã bàn giao" không dùng 2 nút này.
function getActiveLabelGroups(){
  let tasks = allTasks.filter(t => t.status === "cho_in" || t.status === "cho_dong_goi");
  tasks.sort((a, b) => (a.status === "cho_in" ? 0 : 1) - (b.status === "cho_in" ? 0 : 1)); // sort ổn định: giữ thứ tự cũ trong từng tab
  if(searchTerm) tasks = tasks.filter(matchesSearch);
  return groupShown(tasks).filter(g => g.shipLabelUrl);
}

// Phiếu giao của các đơn đang được TÍCH CHỌN (thanh thao tác hàng loạt). Selected
// chứa id từng sản phẩm; groupShown gộp theo orderId nên 1 đơn nhiều sản phẩm
// chỉ cho ra 1 phiếu (không bị tải/gộp trùng). Cùng thứ tự với
// getActiveLabelGroups (đơn "Chờ xử lý" trước, "Chờ bàn giao" sau).
// Trả { groups: các đơn CÓ phiếu, missing: số đơn đã chọn nhưng chưa có phiếu }.
function getSelectedLabelGroups(){
  const tasks = allTasks.filter(t => selected.has(t.id));
  tasks.sort((a, b) => (a.status === "cho_in" ? 0 : 1) - (b.status === "cho_in" ? 0 : 1));
  const all = groupShown(tasks);
  const groups = all.filter(g => g.shipLabelUrl);
  return { groups, missing: all.length - groups.length };
}

// tải/gộp; chữ tiến độ hiện ở nơi người dùng vừa bấm (source = "top" | "batch").

// Cập nhật 2 nút phiếu giao (hiện ở tab 1 và tab 2, ẩn ở tab 3) + số lượng.
function updateLabelButtons(){

// Carrier hiệu lực của 1 task — "unknown" cho mọi giá trị lạ/rỗng, để luôn
// khớp với 1 trong các key của CARRIER_LABEL (tránh sinh nhóm rác nếu dữ
// liệu cũ/lỗi có carrier không nằm trong danh sách đã biết).
function effectiveCarrier(t){
  return carrierKeyOf(t);
}

// Áp dụng lọc theo hãng (carrierFilter) — chỉ có tác dụng ở tab "Chờ bàn giao"
// và "Đã bàn giao".
function applyCarrierFilter(tasks){
  if(!hasCarrierView() || carrierFilter === "all") return tasks;
  return tasks.filter(t => effectiveCarrier(t) === carrierFilter);
}

// Vẽ thanh chuyển chế độ xem + chip lọc theo hãng (tab "Chờ bàn giao" + "Đã bàn giao").
// baseShown = tasks theo tab+tìm kiếm, TRƯỚC khi lọc theo hãng, để đếm số
// lượng đúng cho từng chip.
function renderCarrierBar(baseShown){
  const toggleBtn = document.getElementById("carrierViewToggle");
  toggleBtn.textContent = carrierViewMode === "carrier" ? "🔀 Xem theo thời gian" : "🗂 Xem nhóm theo hãng";
  toggleBtn.onclick = () => {
    carrierViewMode = carrierViewMode === "carrier" ? "time" : "carrier";
    localStorage.setItem("carrierViewMode", carrierViewMode);
    render();
  };

  const counts = new Map();
  baseShown.forEach(t => {
    const key = effectiveCarrier(t);
    counts.set(key, (counts.get(key) || 0) + 1);
  });

  const chipsEl = document.getElementById("carrierChips");
  chipsEl.innerHTML = "";

  const allChip = document.createElement("button");
  allChip.type = "button";
  allChip.className = "carrierChip" + (carrierFilter === "all" ? " active" : "");
  allChip.innerHTML = `Tất cả <span class="n">${baseShown.length}</span>`;
  allChip.addEventListener("click", () => { carrierFilter = "all"; render(); });
  chipsEl.appendChild(allChip);

  sortCarrierKeys(Array.from(counts.keys())).forEach(key => {
    const n = counts.get(key) || 0;
    if(n === 0) return; // ẩn hãng hiện không có đơn nào để đỡ rối chip
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "carrierChip" + (carrierFilter === key ? " active" : "");
    chip.textContent = carrierLabelOf(key) + " ";
    { const nSpan = document.createElement("span"); nSpan.className = "n"; nSpan.textContent = n; chip.appendChild(nSpan); }
    chip.addEventListener("click", () => { carrierFilter = (carrierFilter === key ? "all" : key); render(); });
    chipsEl.appendChild(chip);
  });
}

// Vẽ danh sách đơn (tab "Chờ bàn giao" / "Đã bàn giao") theo accordion nhóm
// hãng — mỗi nhóm gập mặc định, bấm head mới xổ ra. Thứ tự các hãng theo
// sortCarrierKeys() (hãng đã biết → hãng tự nhập → "chưa rõ hãng" ở cuối).
// Trả về mảng group (đơn) đã render, để render() dùng tính nút "Tải tất cả
// phiếu giao".
function renderOrdersByCarrier(shownTasks){
  const buckets = new Map();
  shownTasks.forEach(t => {
    const key = effectiveCarrier(t);
    if(!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(t);
  });
  const orderedKeys = sortCarrierKeys(Array.from(buckets.keys()));

  let allGroups = [];
  orderedKeys.forEach(key => {
    const tasks = buckets.get(key);
    const groups = groupShown(tasks);
    allGroups = allGroups.concat(groups);

    const isExpanded = expandedCarrierGroups.has(key);
    const wrap = document.createElement("div");
    wrap.className = "carrierGroup";

    const head = document.createElement("div");
    head.className = "carrierGroupHead";
    head.addEventListener("click", () => {
      if(isExpanded) expandedCarrierGroups.delete(key); else expandedCarrierGroups.add(key);
      render();
    });
    const left = document.createElement("span");
    left.textContent = carrierLabelOf(key);

    const right = document.createElement("span");
    right.className = "carrierGroupHeadRight";
    const countSpan = document.createElement("span");
    countSpan.className = "carrierGroupCount";
    countSpan.textContent = `${groups.length} đơn`;
    right.appendChild(countSpan);
    const arrowSpan = document.createElement("span");
    arrowSpan.className = "expand-arrow";
    arrowSpan.textContent = isExpanded ? "▾" : "▸";
    right.appendChild(arrowSpan);
    head.appendChild(left);
    head.appendChild(right);
    wrap.appendChild(head);

    if(isExpanded){
      const body = document.createElement("div");
      body.className = "carrierGroupBody";

      groups.forEach(g => body.appendChild(renderOrderBox(g)));
      wrap.appendChild(body);
    }
    list.appendChild(wrap);
  });
  return allGroups;
}

function updateSelectAllBox(shown){
  const n = shown.length;
  const nSel = shown.filter(t => selected.has(t.id)).length;
  selectAllBox.checked = n > 0 && nSel === n;
  selectAllBox.indeterminate = nSel > 0 && nSel < n;
}

// Đếm SỐ KIỆN HÀNG (số đơn/orderId khác nhau) đang ở 1 trạng thái — dùng cho
// badge số trên tab (thay vì đếm số dòng sản phẩm/task như trước). Nhiều sản
// phẩm cùng orderId chỉ tính là 1 kiện. Không phụ thuộc từ khóa tìm kiếm,
// giống cách badge cũ luôn phản ánh TOÀN BỘ dữ liệu chứ không theo bộ lọc.
function countOrdersByStatus(status){
  const ids = new Set();
  allTasks.forEach(t => { if(t.status === status) ids.add(t.orderId || t.id); });
  return ids.size;
}

// Cảnh báo TRÙNG MÃ ĐƠN HÀNG (orderName) — dấu hiệu điển hình của việc tải nhầm
// cùng 1 phiếu giao cho 2 đơn khác nhau. Chỉ so sánh trong tập đơn ĐANG XỬ LÝ
// (tab Chờ xử lý + tab Chờ bàn giao gộp chung, nên bắt được cả trường hợp 1
// đơn ở tab 1 trùng với 1 đơn ở tab 2). KHÔNG so với tab "Đã bàn giao": tab đó dữ liệu
// lớn, đã xử lý xong, và mã cũ có thể tái xuất hợp lệ (giao lại...) → dễ báo
// động giả. Tính hoàn toàn trên allTasks có sẵn trong bộ nhớ (1 lượt duyệt,
// không gọi mạng) nên rất nhanh. So sánh không phân biệt hoa/thường, bỏ qua
// đơn chưa có mã (tên trống).
function findDuplicateOrderCodes(){
  const byKey = new Map(); // KEY -> { label, orderIds:Set }
  allTasks.forEach(t => {
    if(t.status !== "cho_in" && t.status !== "cho_dong_goi") return;
    const name = (t.orderName || "").trim();
    if(!name || isBlankOrderName(name)) return;
    const key = name.toUpperCase();
    if(!byKey.has(key)) byKey.set(key, { label: name, orderIds: new Set() });
    byKey.get(key).orderIds.add(t.orderId || t.id);
  });
  const dups = [];
  byKey.forEach(v => { if(v.orderIds.size >= 2) dups.push(v.label); });
  return dups;
}

// Có đơn ĐANG XỬ LÝ khác (khác orderId, trạng thái Chờ xử lý/Chờ bàn giao) đang mang cùng
// mã đơn hàng này không? (không phân biệt hoa/thường, bỏ qua mã trống)
function isOrderNameUsedByOtherActiveOrder(orderId, name){
  const key = (name || "").trim().toUpperCase();
  if(!key) return false;
  return allTasks.some(t =>
    (t.status === "cho_in" || t.status === "cho_dong_goi") &&
    (t.orderId || t.id) !== orderId &&
    (t.orderName || "").trim().toUpperCase() === key);
}

function updateDupWarning(){
  const el = document.getElementById("dupWarn");
  const dups = (currentTab === "in" || currentTab === "dong_goi") ? findDuplicateOrderCodes() : [];
  if(dups.length === 0){ el.style.display = "none"; el.textContent = ""; return; }
  const MAX = 3;
  const shownCodes = dups.slice(0, MAX).join(", ");
  const more = dups.length > MAX ? ` và ${dups.length - MAX} mã khác` : "";
  el.textContent = `⚠️ Trùng mã đơn hàng: ${shownCodes}${more} — kiểm tra lại phiếu giao`;
  el.style.display = "block";
}

function render(){
  updateDupWarning();
  updateLabelButtons();
  updateBatchBar();
  const badgeIn = countOrdersByStatus("cho_in");
  const badgeDG = countOrdersByStatus("cho_dong_goi");
  const badgeXong = countOrdersByStatus("xong");
  document.getElementById("badge-in").textContent = badgeIn;
  document.getElementById("badge-dong_goi").textContent = badgeDG;
  document.getElementById("badge-xong").textContent = badgeXong;

  const baseShown = getShown(); // theo tab + tìm kiếm, CHƯA lọc theo hãng
  const shown = applyCarrierFilter(baseShown);
  updateSelectAllBox(shown);

  // Tổng số lượng (cộng dồn field qty của từng sản phẩm) của danh sách ĐANG
  // HIỂN THỊ — theo đúng tab + tìm kiếm + lọc hãng hiện tại, nằm cùng hàng với
  // "Chọn tất cả" (căn phải) — đây là con số "số lượng" cũ từng nằm cạnh tên
  // tab, giờ chuyển xuống đây; số cạnh tên tab đổi thành số kiện hàng.
  const totalQtyShown = shown.reduce((s, t) => s + (t.qty || 1), 0);
  totalQtyInfo.innerHTML = `Số lượng: <b>${totalQtyShown}</b>`;
  // Ẩn hẳn hàng "Chọn tất cả" + "Số lượng" khi danh sách đang hiển thị rỗng —
  // đỡ rối vì lúc đó chọn/số lượng đều vô nghĩa (0).
  listToolbar.style.display = shown.length === 0 ? "none" : "flex";

  list.innerHTML = "";

  const carrierBar = document.getElementById("carrierBar");
  if(hasCarrierView() && baseShown.length > 0){
    carrierBar.style.display = "flex";
    renderCarrierBar(baseShown);
  } else {
    carrierBar.style.display = "none";
  }

  if(shown.length === 0){
    const emptyMsg = searchTerm ? "Không tìm thấy việc nào khớp."
      : currentTab === "in" ? "Chưa có việc nào. Thêm sản phẩm ở ô trên."
      : carrierFilter !== "all" ? "Không có đơn nào thuộc hãng này."
      : currentTab === "dong_goi" ? "Chưa có đơn nào chờ bàn giao."
      : "Chưa có đơn nào đã bàn giao.";
    list.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  const byCarrier = hasCarrierView() && carrierViewMode === "carrier";
  const groups = byCarrier ? renderOrdersByCarrier(shown) : groupShown(shown);
  if(!byCarrier){
    groups.forEach(g => list.appendChild(renderOrderBox(g)));
  }
}

// Thẻ tóm tắt 1 đơn hàng trong danh sách — kiểu Shopee, giờ là TẦNG DUY NHẤT
// (không còn trang "Chi tiết đơn hàng" toàn màn hình). Bấm vào header (giờ

function renderOrderBox(g){

  box.className = "order-box";

  if(currentTab === "dong_goi"){
    info = orderPackInfo(g.orderId);
    box.classList.add(info.eligible ? "ready" : "warn");
  }

  const isExpanded = expandedOrderIds.has(g.orderId);

  // Dòng đầu: thời gian tạo đơn (thay cho tên người mua — không có dữ liệu

  // tên ▾/▸. Bấm vào bất kỳ đâu trên header sẽ mở/đóng khu vực mở rộng.
  const header = document.createElement("div");
  header.className = "order-summary-header";

  rightWrap.className = "order-header-right";
  const statusSpan = document.createElement("span");
  statusSpan.className = "order-status-badge " + STATUS_COLOR_CLASS[currentTab];
  statusSpan.textContent = STATUS_LABEL[currentTab];
  rightWrap.appendChild(statusSpan);
  if(g.shipLabelUrl){
    const dot = document.createElement("span");
    dot.className = "header-dot";
    dot.title = "Đã đính kèm phiếu giao";
    dot.textContent = "📎";
    rightWrap.appendChild(dot);
  }
  // Chip hãng vận chuyển ở header đã được thay bằng dòng "Đơn vị VC:" riêng

  arrow.className = "expand-arrow";
  arrow.textContent = isExpanded ? "▾" : "▸";
  rightWrap.appendChild(arrow);

  header.appendChild(timeSpan);
  header.appendChild(rightWrap);
  box.appendChild(header);

  // Xem trước ghi chú chung của đơn — luôn hiện nếu có, không cần mở rộng.

  const carrierRow = document.createElement("div");
  carrierRow.className = "order-code-row";
  if(editingCarrierIds.has(g.orderId)){
    const curKey = carrierKeyOf(g);
    const select = document.createElement("select");
    select.className = "order-carrier-select";
    Object.keys(CARRIER_LABEL).forEach(key => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = CARRIER_LABEL[key];

      select.appendChild(opt);
    });
    // Tùy chọn tự nhập: chọn xong hiện ô gõ chữ — dùng khi nhận diện sai /
    // "Chưa rõ hãng" / hãng mới chưa có trong danh sách và chưa kịp sửa code.
    const customOpt = document.createElement("option");
    customOpt.value = CARRIER_CUSTOM;
    customOpt.textContent = "✏️ Khác (tự nhập)…";
    if(curKey.startsWith(CARRIER_CUSTOM + ":")) customOpt.selected = true;
    select.appendChild(customOpt);

    const customInput = document.createElement("input");
    customInput.type = "text";
    customInput.className = "order-title-input";
    customInput.placeholder = "Gõ tên hãng bất kỳ…";
    customInput.maxLength = 60;
    customInput.value = curKey.startsWith(CARRIER_CUSTOM + ":") ? carrierLabelOf(curKey) : "";
    const syncCustomVisible = () => { customInput.style.display = select.value === CARRIER_CUSTOM ? "" : "none"; };
    syncCustomVisible();

    const saveBtn = document.createElement("button");
    saveBtn.className = "save-icon";
    saveBtn.textContent = "Lưu";
    const commit = attachClickAwayCommit(carrierRow, () => {
      editingCarrierIds.delete(g.orderId);
      if(select.value === CARRIER_CUSTOM){
        const name = customInput.value.trim();
        // Để trống = coi như chưa rõ hãng (không lưu chuỗi rỗng).
        if(name) setOrderCarrier(g.orderId, CARRIER_CUSTOM, name);
        else setOrderCarrier(g.orderId, "unknown");
      } else {
        setOrderCarrier(g.orderId, select.value);
      }
    });
    saveBtn.addEventListener("click", commit);
    select.addEventListener("change", () => {
      syncCustomVisible();
      if(select.value === CARRIER_CUSTOM){ customInput.focus(); return; } // chờ người dùng gõ rồi bấm Lưu
      commit();
    });
    customInput.addEventListener("keydown", e => { if(e.key === "Enter") commit(); });
    carrierRow.appendChild(select);
    carrierRow.appendChild(customInput);
    carrierRow.appendChild(saveBtn);
    setTimeout(() => (select.value === CARRIER_CUSTOM ? customInput : select).focus(), 0);
  } else {
    const carrierLabelSpan = document.createElement("span");
    carrierLabelSpan.className = "code-label";
    carrierLabelSpan.textContent = "Đơn vị VC";
    const carrierValueWrap = document.createElement("span");
    carrierValueWrap.className = "code-value";
    const carrierValueText = document.createElement("span");

    carrierEditBtn.className = "edit-icon-btn";
    carrierEditBtn.textContent = "✏️";
    carrierEditBtn.title = "Đổi hãng vận chuyển";
    carrierEditBtn.addEventListener("click", () => { editingCarrierIds.add(g.orderId); render(); });
    carrierValueWrap.appendChild(carrierValueText);
    carrierValueWrap.appendChild(carrierEditBtn);
    carrierRow.appendChild(carrierLabelSpan);

  // Mã đơn hàng — không còn nút "Sao chép"; mã dịch sang phải lấp chỗ trống,

  const codeRow = document.createElement("div");
  codeRow.className = "order-code-row";
  if(editingOrderIds.has(g.orderId)){
    const input = document.createElement("input");
    input.type = "text";
    input.className = "order-title-input";
    input.value = g.orderName || "";
    const saveBtn = document.createElement("button");
    saveBtn.className = "save-icon";
    saveBtn.textContent = "Lưu";
    const commit = attachClickAwayCommit(codeRow, () => renameOrder(g.orderId, input.value));
    saveBtn.addEventListener("click", commit);
    input.addEventListener("keydown", e => { if(e.key === "Enter") commit(); });
    codeRow.appendChild(input);
    codeRow.appendChild(saveBtn);
    setTimeout(() => input.focus(), 0);
  } else {
    const labelSpan = document.createElement("span");
    labelSpan.className = "code-label";
    labelSpan.textContent = "Mã đơn hàng";
    // Nút ⬇ tải phiếu giao ngay sau chữ "Mã đơn hàng" — có ở MỌI tab (In /
    // Chờ bàn giao / Đã bàn giao) để người dùng không phải tìm trong header. Chỉ
    // hiện khi đơn ĐÃ có phiếu giao đính kèm.
    const labelWrap = document.createElement("span");
    labelWrap.className = "code-label-wrap";
    labelWrap.appendChild(labelSpan);
    if(g.shipLabelUrl){
      const dlBtn = document.createElement("button");
      dlBtn.type = "button";
      dlBtn.className = "code-dl-btn";
      dlBtn.title = "Tải phiếu giao";
      dlBtn.setAttribute("aria-label", "Tải phiếu giao");
      dlBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>';
      dlBtn.addEventListener("click", () => downloadShipLabel(g.shipLabelUrl, g.orderName));
      labelWrap.appendChild(dlBtn);
    }
    const valueWrap = document.createElement("span");
    valueWrap.className = "code-value";
    const valueText = document.createElement("span");
    valueText.innerHTML = renderOrderName(g.orderName);
    const editBtn = document.createElement("button");
    editBtn.className = "edit-icon-btn";
    editBtn.textContent = "✏️";
    editBtn.title = "Đổi tên đơn";
    editBtn.addEventListener("click", () => { editingOrderIds.add(g.orderId); render(); });
    valueWrap.appendChild(valueText);
    valueWrap.appendChild(editBtn);
    codeRow.appendChild(labelWrap);
    codeRow.appendChild(valueWrap);
  }
  box.appendChild(codeRow);

  if(currentTab === "dong_goi" && info){
    const line = document.createElement("div");
    line.className = "order-status-line " + (info.eligible ? "ready" : "warn");
    line.textContent = info.eligible
      ? "Đủ hàng — sẵn sàng bàn giao"
      : `Đơn chưa đủ — còn ${info.pending} sản phẩm đang in`;
    box.appendChild(line);
  }

  const actionsRow = document.createElement("div");
  actionsRow.className = "order-summary-actions";

  if(currentTab === "in"){
    const shipBtn = document.createElement("button");
    shipBtn.className = "ship-quick-btn" + (g.shipLabelUrl ? "" : " no-label");
    shipBtn.textContent = g.shipLabelUrl ? "📦 In phiếu giao" : "⚠️ Chưa có phiếu giao";
    shipBtn.title = g.shipLabelUrl ? "Tải phiếu giao để in" : "Chưa có phiếu giao — chờ quản lý tải lên";
    shipBtn.addEventListener("click", () => {

    });
    actionsRow.appendChild(shipBtn);

    const btn = document.createElement("button");
    btn.className = "order-primary-btn";

  } else if(currentTab === "dong_goi"){
    const revBtn = document.createElement("button");

    revBtn.addEventListener("click", () => revertOrderItems(g.items));
    actionsRow.appendChild(revBtn);
  }
  box.appendChild(actionsRow);

  return box;
}

// Tên sản phẩm thường được gõ theo dạng "Tên gốc — Phân loại" (dấu gạch
// ngang dài "—"). Hàm này tách ra 2 phần để hiển thị tiêu đề và phân loại
// trên 2 dòng riêng thay vì dính liền — nếu không có "—" thì coi cả chuỗi
// là tiêu đề, không có phân loại.
function splitProductName(name){
  name = name || "";
  const idx = name.indexOf("—");
  if(idx === -1) return { title: name, classification: "" };
  const title = name.slice(0, idx).trim();
  const classification = name.slice(idx + 1).trim();
  return title ? { title, classification } : { title: classification, classification: "" };
}

// Dòng 1 sản phẩm trong thẻ tóm tắt — chỉ ảnh/tiêu đề/SL + checkbox (dùng
// cho chọn hàng loạt), KHÔNG có nút thao tác (những nút đó chuyển hết vào
// trang chi tiết vì ít khi dùng tới).
function renderItemSummary(t){
  const row = document.createElement("div");
  row.className = "order-item-summary";

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = selected.has(t.id);

  cb.addEventListener("change", () => {
    if(cb.checked) selected.add(t.id); else selected.delete(t.id);
    updateBatchBar();
  });
  row.appendChild(cb);

  row.appendChild(renderThumb(t));

  const info = document.createElement("div");
  info.className = "info-summary";
  const { title, classification } = splitProductName(t.name);
  const nameDiv = document.createElement("div");
  nameDiv.className = "name-summary";
  nameDiv.title = t.name;
  const nameText = document.createElement("span");
  nameText.className = "name-text";
  nameText.textContent = title;
  nameDiv.appendChild(nameText);
  if(t.link){
    const linkA = document.createElement("a");
    linkA.className = "task-linkchip";
    linkA.href = t.link;
    linkA.target = "_blank";
    linkA.rel = "noopener";
    linkA.title = "Mở file in";
    linkA.setAttribute("aria-label", "Mở file in");
    const icon = document.createElement("span");
    icon.textContent = "🔗";
    const label = document.createElement("span");
    label.className = "chip-label";
    label.textContent = "File in";
    linkA.appendChild(icon);
    linkA.appendChild(label);
    linkA.addEventListener("click", e => e.stopPropagation());
    nameDiv.appendChild(linkA);
  }
  const metaDiv = document.createElement("div");
  metaDiv.className = "meta-row-summary";
  const classDiv = document.createElement("span");
  classDiv.className = "classification-summary";
  classDiv.title = classification;
  classDiv.textContent = classification;
  const qtyDiv = document.createElement("span");
  qtyDiv.className = "qty-summary";
  qtyDiv.textContent = "SL: " + (t.qty || 1);
  metaDiv.appendChild(classDiv);
  metaDiv.appendChild(qtyDiv);
  info.appendChild(nameDiv);
  info.appendChild(metaDiv);
  row.appendChild(info);

  return row;
}

// Đưa cả đơn (mọi sản phẩm đang hiện ở tab hiện tại) tiến 1 bước trạng thái —
// dùng cho nút hành động chính trên thẻ tóm tắt ở tab "In".
async function advanceOrderItems(items){
  for(const t of items) await advanceStatus(t);
}

// Lùi cả đơn (mọi sản phẩm đang hiện ở tab hiện tại) về 1 bước trước — dùng
// cho nút "↩ Lùi lại" trên thẻ tóm tắt ở tab "Chờ bàn giao" / "Đã bàn giao".
async function revertOrderItems(items){
  for(const t of items) await revertStatus(t);
}

// Nút icon-only dùng chung cho khu vực mở rộng (phiếu giao + ghi chú) — gọn
// gàng, không chữ, chỉ 1 icon + tooltip (title) khi hover/giữ.
function mkIconBtn(icon, cls, title, onClick){
  const b = document.createElement("button");
  b.className = "icon-btn " + cls;
  b.textContent = icon;
  b.title = title;
  b.addEventListener("click", onClick);
  return b;
}

// Khu vực mở rộng của 1 đơn hàng — hiện khi bấm vào header. Gồm 1 hàng icon:
// phiếu giao (đính kèm PDF, dùng chung cho cả đơn — khác "🔗 File in" ở từng
// sản phẩm) rồi tới nút 📝 Ghi chú ở CUỐI CÙNG (sau nút Xóa/Tải lên). Bấm 📝
// lần nữa mới mở ô nhập để gõ ghi chú.
function renderOrderExpandPanel(g){
  const wrap = document.createElement("div");
  wrap.className = "order-expand-panel";

  const rowEl = document.createElement("div");
  rowEl.className = "ship-label-row";

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "application/pdf";
  fileInput.style.display = "none";
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if(f) uploadShipLabel(g.orderId, f);
    fileInput.value = "";
  });
  rowEl.appendChild(fileInput);

  if(uploadingShipLabelIds.has(g.orderId)){
    const busyBtn = mkIconBtn("⏳", "attach-btn", "Đang tải lên...", () => {});
    busyBtn.disabled = true;
    rowEl.appendChild(busyBtn);
  } else if(g.shipLabelUrl){
    // target="_blank" qua window.open — chỉ mở tab mới hiển thị PDF (trình
    // duyệt tự render), không tải file về máy như nút tải xuống.
    rowEl.appendChild(mkIconBtn("👁", "view-btn", "Xem phiếu giao", () => window.open(g.shipLabelUrl, "_blank", "noopener")));
    rowEl.appendChild(mkIconBtn("⬇️", "download-btn", "Tải phiếu giao", () => downloadShipLabel(g.shipLabelUrl, g.orderName)));
    // Không còn nút "Thay file" riêng: tải lên lần nữa = thay phiếu hiện tại.
    rowEl.appendChild(mkIconBtn("⬆️", "attach-btn", "Tải lên phiếu mới (thay phiếu hiện tại)", () => fileInput.click()));
    rowEl.appendChild(mkIconBtn("🗑", "remove-btn", "Xóa phiếu giao", () => removeShipLabel(g.orderId)));
  } else {
    rowEl.appendChild(mkIconBtn("⬆️", "attach-btn", "Tải lên phiếu giao", () => fileInput.click()));
  }

  // Nút ghi chú — luôn đặt cuối cùng trong hàng icon.
  const noteBtn = mkIconBtn("📝", "note-btn" + (g.note ? " has-note" : ""), "Ghi chú đơn hàng", () => {
    if(openOrderNoteIds.has(g.orderId)) openOrderNoteIds.delete(g.orderId);
    else openOrderNoteIds.add(g.orderId);
    render();
  });
  rowEl.appendChild(noteBtn);

  wrap.appendChild(rowEl);

  if(openOrderNoteIds.has(g.orderId)){
    const noteBox = document.createElement("div");
    noteBox.className = "note-box";
    const ta = document.createElement("textarea");
    ta.placeholder = "Ghi chú cho đơn hàng này...";
    ta.value = g.note || "";
    const saveNoteBtn = document.createElement("button");
    saveNoteBtn.className = "note-save";
    saveNoteBtn.textContent = "Lưu ghi chú";
    const commit = attachClickAwayCommit(noteBox, async () => {
      await saveOrderNote(g.orderId, ta.value);
      openOrderNoteIds.delete(g.orderId);
      render();
    });
    saveNoteBtn.addEventListener("click", commit);
    noteBox.appendChild(ta);
    noteBox.appendChild(saveNoteBtn);
    wrap.appendChild(noteBox);
    setTimeout(() => ta.focus(), 0);
  }

  return wrap;
}

// ---- Actions ----

async function advanceStatus(t){
  const next = t.status === "cho_in" ? "cho_dong_goi" : "xong";
  const patch = { status: next, updatedAt: serverTimestamp() };
  try{
    await updateDoc(doc(db, "tasks", t.id), patch);
  }catch(e){ showError("Không cập nhật được trạng thái: " + e.message); }
}

async function revertStatus(t){
  const prev = t.status === "cho_dong_goi" ? "cho_in" : t.status === "xong" ? "cho_dong_goi" : null;
  if(!prev) return;
  try{
    await updateDoc(doc(db, "tasks", t.id), { status: prev, updatedAt: serverTimestamp() });
  }catch(e){ showError("Không lùi được trạng thái: " + e.message); }
}

// Bàn giao cả đơn cho shipper: chuyển mọi sản phẩm của đơn đang ở tab "Chờ bàn
// giao" sang tab "Đã bàn giao". Nút chỉ hiện khi đơn đủ hàng (orderPackInfo).
async function handOverWholeOrder(orderId){
  const items = allTasks.filter(t => t.orderId === orderId && t.status === "cho_dong_goi");
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { status: "xong", updatedAt: serverTimestamp() });
    }
  }catch(e){ showError("Không bàn giao được cả đơn: " + e.message); }
}

// Ghi chú giờ là CHUNG CHO CẢ ĐƠN (không còn riêng từng sản phẩm) — ghi cùng
// 1 giá trị lên mọi item cùng orderId, giống cách renameOrder() đồng bộ tên đơn.
async function saveOrderNote(orderId, note){
  const items = allTasks.filter(t => t.orderId === orderId);
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { note: note || "", updatedAt: serverTimestamp() });
    }
  }catch(e){ showError("Không lưu được ghi chú: " + e.message); }
}
